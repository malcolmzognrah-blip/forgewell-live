<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgewell — Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.png">
<style>
:root{ --navy:#1B4B8C; --navy-dark:#123056; --green:#3FA34D; --gray:#6b6b6b; --bg:#FFFFFF; --panel:#F7F8F6; --line:#E4E4E0; }
*{box-sizing:border-box;}
body{ background:var(--bg); color:#1a1a1a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; margin:0; }

.admin-header{ background:var(--navy-dark); color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
.admin-header .title{ font-weight:700; font-size:1rem; }
.admin-header .title span{ color:var(--green); }
.admin-header a{ color:#fff; font-size:0.8rem; text-decoration:none; opacity:0.8; }
.admin-header a:hover{ opacity:1; }

.login-wrap{ max-width:360px; margin:80px auto; padding:0 20px; text-align:center; }
.login-wrap h1{ font-size:1.3rem; color:var(--navy-dark); margin-bottom:20px; }
.login-wrap input{ width:100%; box-sizing:border-box; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:0.9rem; margin-bottom:14px; }
.login-wrap button{ width:100%; padding:12px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; }
.login-error{ color:#c0392b; font-size:0.82rem; margin-top:10px; display:none; }
.login-error.show{ display:block; }

.admin-wrap{ max-width:1200px; margin:0 auto; padding:24px; display:none; }
.filters{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.filters input, .filters select{ padding:9px 12px; border:1.5px solid var(--line); border-radius:6px; font-size:0.85rem; }
.filters input{ flex:1; min-width:200px; }
.filters button{ padding:9px 16px; background:var(--navy); color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.85rem; }

.admin-tabs{ display:flex; gap:4px; margin-bottom:20px; border-bottom:1.5px solid var(--line); }
.admin-tab{ padding:10px 16px; background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1.5px; font-size:0.85rem; font-weight:700; color:var(--gray); cursor:pointer; }
.admin-tab.active{ color:var(--navy); border-bottom-color:var(--navy); }
.admin-view{ display:none; }
.admin-view.active{ display:block; }

.coa-panel{ max-width:640px; }
.coa-panel label{ display:block; font-size:0.78rem; font-weight:700; color:var(--gray); margin:14px 0 5px; }
.coa-panel label:first-of-type{ margin-top:0; }
.coa-panel input[type="text"], .coa-panel input[type="date"], .coa-panel select{ width:100%; padding:9px 12px; border:1.5px solid var(--line); border-radius:6px; font-size:0.85rem; }
.coa-fields{ display:grid; grid-template-columns:1fr 1fr; gap:0 16px; margin-top:6px; padding-top:10px; border-top:1px solid var(--line); }
.coa-extract-status{ font-size:0.8rem; color:var(--gray); margin-top:8px; }
.coa-existing-list{ margin-top:16px; }
.coa-existing-list h3{ font-size:0.82rem; color:var(--navy-dark); margin:0 0 8px; font-weight:700; }
.coa-existing-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; font-size:0.82rem; }
.coa-existing-item:last-child{ margin-bottom:0; }
.coa-existing-empty{ font-size:0.8rem; color:var(--gray); margin-top:12px; }
.coa-delete-btn{ padding:5px 10px; background:#fff; color:#c0392b; border:1px solid #c0392b; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.75rem; }
.coa-delete-btn:hover{ background:#c0392b; color:#fff; }
.coa-delete-btn:disabled{ opacity:0.5; cursor:not-allowed; }
.coa-mismatch-warning{ background:#FDECD2; color:#9A6B1E; font-size:0.8rem; padding:10px 12px; border-radius:6px; margin-top:12px; display:none; }
.coa-mismatch-warning.show{ display:block; }
.coa-save-btn{ margin-top:20px; padding:11px 20px; background:var(--navy); color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.85rem; }
.coa-save-btn:disabled{ opacity:0.5; cursor:not-allowed; }
.coa-save-status{ font-size:0.82rem; margin-top:10px; display:none; }
.coa-save-status.show{ display:block; }
.coa-save-status.error{ color:#c0392b; }
.coa-save-status.success{ color:#1F7A34; }

table.orders-table{ width:100%; border-collapse:collapse; font-size:0.82rem; }
table.orders-table th{ text-align:left; padding:10px; background:var(--panel); border-bottom:2px solid var(--line); color:var(--navy-dark); position:sticky; top:0; }
table.orders-table td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
table.orders-table tr:hover{ background:var(--panel); }
.order-status-pill{ display:inline-block; padding:3px 8px; border-radius:12px; font-size:0.7rem; font-weight:700; text-transform:uppercase; }
.order-status-pill.paid{ background:#DCF3E0; color:#1F7A34; }
.order-status-pill.pending_payment{ background:#FDECD2; color:#9A6B1E; }
.order-status-pill.other{ background:var(--line); color:var(--gray); }
.order-items-cell{ max-width:280px; font-size:0.78rem; line-height:1.5; }
.result-count{ color:var(--gray); font-size:0.8rem; margin-bottom:12px; }
</style>
</head>
<body>

<div class="admin-header">
  <div class="title">FORGE<span>WELL</span> Admin</div>
  <a href="#" id="admin-logout-link" style="display:none;">Log Out</a>
</div>

<div class="login-wrap" id="login-wrap">
  <h1>Admin Login</h1>
  <input type="password" id="admin-password-input" placeholder="Admin password">
  <button id="admin-login-btn">Log In</button>
  <p class="login-error" id="admin-login-error"></p>
</div>

<div class="admin-wrap" id="admin-wrap">
  <div class="admin-tabs">
    <button type="button" class="admin-tab active" id="tab-orders">Orders</button>
    <button type="button" class="admin-tab" id="tab-coas">Certificates of Analysis</button>
  </div>

  <div class="admin-view active" id="view-orders">
  <div class="filters">
    <input type="text" id="filter-email" placeholder="Filter by customer email...">
    <select id="filter-status">
      <option value="">All statuses</option>
      <option value="paid">Paid</option>
      <option value="pending_payment">Pending Payment</option>
    </select>
    <button id="filter-btn">Search</button>
  </div>
  <p class="result-count" id="result-count"></p>
  <table class="orders-table">
    <thead>
      <tr>
        <th>Order</th>
        <th>Customer</th>
        <th>Account</th>
        <th>Items</th>
        <th>Total</th>
        <th>Status</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="orders-tbody"></tbody>
  </table>
  </div>

  <div class="admin-view coa-panel" id="view-coas">
    <label for="coa-product-select">Product</label>
    <select id="coa-product-select"><option value="">Loading products...</option></select>

    <div class="coa-existing-list" id="coa-existing-list"></div>

    <label for="coa-file-input">COA PDF</label>
    <input type="file" id="coa-file-input" accept="application/pdf">
    <p class="coa-extract-status" id="coa-extract-status"></p>

    <p class="coa-mismatch-warning" id="coa-mismatch-warning"></p>

    <div class="coa-fields" id="coa-fields" style="display:none;">
      <div>
        <label for="coa-batch-lot">Lot Number</label>
        <input type="text" id="coa-batch-lot">
      </div>
      <div>
        <label for="coa-batch-date">Batch Date</label>
        <input type="date" id="coa-batch-date">
      </div>
      <div>
        <label for="coa-appearance">Appearance</label>
        <input type="text" id="coa-appearance">
      </div>
      <div>
        <label for="coa-net-content">Net Content Average</label>
        <input type="text" id="coa-net-content">
      </div>
      <div>
        <label for="coa-purity">Purity (HPLC-UV)</label>
        <input type="text" id="coa-purity">
      </div>
      <div>
        <label for="coa-endotoxin">Endotoxin Threshold</label>
        <input type="text" id="coa-endotoxin">
      </div>
      <div>
        <label for="coa-microbial">Microbial Analysis (PCR)</label>
        <input type="text" id="coa-microbial">
      </div>
      <div>
        <label for="coa-fentanyl">Fentanyl Screen</label>
        <input type="text" id="coa-fentanyl">
      </div>
    </div>

    <button type="button" class="coa-save-btn" id="coa-save-btn" style="display:none;">Save Certificate</button>
    <p class="coa-save-status" id="coa-save-status"></p>
  </div>
</div>

<script>
function formatDate(iso) {
  return new Date(iso).toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function statusClass(s) { return s === 'paid' ? 'paid' : s === 'pending_payment' ? 'pending_payment' : 'other'; }

function showAdmin() {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('admin-wrap').style.display = 'block';
  document.getElementById('admin-logout-link').style.display = 'inline';
  loadOrders();
}

function loadOrders() {
  var email = document.getElementById('filter-email').value.trim();
  var status = document.getElementById('filter-status').value;
  var params = new URLSearchParams();
  if (email) params.set('email', email);
  if (status) params.set('status', status);

  fetch('/api/admin/orders?' + params.toString(), { credentials: 'include' })
    .then(function(res) {
      if (res.status === 401) { showLogin(); return null; }
      return res.json();
    })
    .then(function(orders) {
      if (!orders) return;
      document.getElementById('result-count').textContent = orders.length + ' order' + (orders.length === 1 ? '' : 's');
      document.getElementById('orders-tbody').innerHTML = orders.map(function(o) {
        var items = (o.line_items || []).map(function(i) { return i.name + ' x' + i.qty; }).join('<br>');
        return '<tr>' +
          '<td><code>' + o.id.slice(0, 8) + '...</code></td>' +
          '<td>' + o.customer_email + '</td>' +
          '<td>' + (o.customer_name || (o.customer_id ? o.customer_id.slice(0,8) : '<span style="color:var(--gray)">guest</span>')) + '</td>' +
          '<td class="order-items-cell">' + items + '</td>' +
          '<td>$' + Number(o.total).toFixed(2) + '</td>' +
          '<td><span class="order-status-pill ' + statusClass(o.status) + '">' + o.status.replace('_', ' ') + '</span></td>' +
          '<td>' + formatDate(o.created_at) + '</td>' +
        '</tr>';
      }).join('');
    })
    .catch(function() {
      document.getElementById('orders-tbody').innerHTML = '<tr><td colspan="7" style="color:var(--gray);padding:20px;">Could not load orders.</td></tr>';
    });
}

function showLogin() {
  document.getElementById('login-wrap').style.display = 'block';
  document.getElementById('admin-wrap').style.display = 'none';
  document.getElementById('admin-logout-link').style.display = 'none';
}

function showOrdersTab() {
  document.getElementById('tab-coas').classList.remove('active');
  document.getElementById('tab-orders').classList.add('active');
  document.getElementById('view-coas').classList.remove('active');
  document.getElementById('view-orders').classList.add('active');
}

function showCoaTab() {
  document.getElementById('tab-orders').classList.remove('active');
  document.getElementById('tab-coas').classList.add('active');
  document.getElementById('view-orders').classList.remove('active');
  document.getElementById('view-coas').classList.add('active');
  loadCoaProducts();
}

// Lazy-loaded (and cached) the same live catalog every other page fetches
// from GET /api/products, rather than a dedicated admin endpoint -- there's
// nothing admin-specific about "list of products" here.
var coaProductsLoaded = false;
function loadCoaProducts() {
  if (coaProductsLoaded) return;
  coaProductsLoaded = true;
  fetch('/api/products', { credentials: 'include' })
    .then(function(res) { return res.json(); })
    .then(function(products) {
      var select = document.getElementById('coa-product-select');
      select.innerHTML = '<option value="">Select a product...</option>' +
        products.map(function(p) { return '<option value="' + p.id + '">' + p.name + '</option>'; }).join('');
    })
    .catch(function() {
      document.getElementById('coa-product-select').innerHTML = '<option value="">Could not load products</option>';
      coaProductsLoaded = false;
    });
}

// Set by the extraction response, read by checkProductMismatch() and cleared
// by resetCoaForm() -- extraction only ever runs again on a new file pick.
var lastCoaExtraction = null;

// Nudge, not a hard stop (see plan): naming conventions between the PDF's
// "Product:" line and the catalog's product.name won't always line up
// character-for-character, so this is a loose two-way substring check, not
// an exact-match gate on Save.
function checkProductMismatch() {
  var warningEl = document.getElementById('coa-mismatch-warning');
  if (!lastCoaExtraction || !lastCoaExtraction.product_name_on_coa) {
    warningEl.classList.remove('show');
    return;
  }
  var select = document.getElementById('coa-product-select');
  var selectedOption = select.options[select.selectedIndex];
  var selectedName = selectedOption ? selectedOption.text : '';
  if (!selectedName) {
    warningEl.classList.remove('show');
    return;
  }
  var coaName = lastCoaExtraction.product_name_on_coa.toLowerCase();
  var prodName = selectedName.toLowerCase();
  if (coaName.indexOf(prodName) !== -1 || prodName.indexOf(coaName) !== -1) {
    warningEl.classList.remove('show');
  } else {
    warningEl.textContent = 'This PDF appears to be for "' + lastCoaExtraction.product_name_on_coa +
      '", but you selected "' + selectedName + '". Double check before saving.';
    warningEl.classList.add('show');
  }
}

function resetCoaForm() {
  document.getElementById('coa-file-input').value = '';
  document.getElementById('coa-fields').style.display = 'none';
  document.getElementById('coa-save-btn').style.display = 'none';
  document.getElementById('coa-extract-status').textContent = '';
  document.getElementById('coa-mismatch-warning').classList.remove('show');
  lastCoaExtraction = null;
}

// Reuses the already-public GET /api/products/:id/coas (same endpoint
// product.html's own COA list fetches) rather than a dedicated admin-only
// listing route -- this data isn't sensitive, it's already shown to every
// site visitor on the product page.
function loadExistingCoas(productId) {
  var container = document.getElementById('coa-existing-list');
  if (!productId) { container.innerHTML = ''; return; }
  fetch('/api/products/' + encodeURIComponent(productId) + '/coas')
    .then(function(res) { return res.json(); })
    .then(function(coas) {
      if (!Array.isArray(coas) || coas.length === 0) {
        container.innerHTML = '<p class="coa-existing-empty">No certificates uploaded yet for this product.</p>';
        return;
      }
      container.innerHTML = '<h3>Existing Certificates</h3>' + coas.map(function(coa) {
        return '<div class="coa-existing-item">' +
          '<span>LOT #' + coa.batch_lot + ' — ' + coa.batch_date + '</span>' +
          '<button type="button" class="coa-delete-btn" data-coa-id="' + coa.id + '">Delete</button>' +
        '</div>';
      }).join('');
    })
    .catch(function() {
      container.innerHTML = '<p class="coa-existing-empty">Could not load existing certificates.</p>';
    });
}

document.getElementById('admin-login-btn').addEventListener('click', function() {
  var pw = document.getElementById('admin-password-input').value;
  var errorEl = document.getElementById('admin-login-error');
  errorEl.classList.remove('show');
  fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ password: pw }),
  })
    .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, d: d }; }); })
    .then(function(r) {
      if (!r.ok) {
        errorEl.textContent = r.d.error || 'Login failed.';
        errorEl.classList.add('show');
        return;
      }
      showAdmin();
    });
});

document.getElementById('admin-password-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('admin-login-btn').click();
});

document.getElementById('filter-btn').addEventListener('click', loadOrders);
document.getElementById('filter-email').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadOrders(); });

document.getElementById('tab-orders').addEventListener('click', showOrdersTab);
document.getElementById('tab-coas').addEventListener('click', showCoaTab);

document.getElementById('coa-product-select').addEventListener('change', function() {
  checkProductMismatch();
  loadExistingCoas(this.value);
});

document.getElementById('coa-existing-list').addEventListener('click', function(e) {
  var btn = e.target.closest('.coa-delete-btn');
  if (!btn) return;
  if (!window.confirm('Delete this certificate? This cannot be undone.')) return;

  var productId = document.getElementById('coa-product-select').value;
  var coaId = btn.getAttribute('data-coa-id');
  btn.disabled = true;

  fetch('/api/admin/products/' + encodeURIComponent(productId) + '/coas/' + encodeURIComponent(coaId), {
    method: 'DELETE',
    credentials: 'include',
  })
    .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, d: d }; }); })
    .then(function(r) {
      if (!r.ok) {
        btn.disabled = false;
        window.alert(r.d.error || 'Could not delete certificate.');
        return;
      }
      loadExistingCoas(productId);
    })
    .catch(function() {
      btn.disabled = false;
      window.alert('Could not delete certificate.');
    });
});

document.getElementById('coa-file-input').addEventListener('change', function() {
  var file = this.files[0];
  var statusEl = document.getElementById('coa-extract-status');
  var fieldsEl = document.getElementById('coa-fields');
  var saveBtn = document.getElementById('coa-save-btn');
  document.getElementById('coa-mismatch-warning').classList.remove('show');
  lastCoaExtraction = null;
  if (!file) {
    fieldsEl.style.display = 'none';
    saveBtn.style.display = 'none';
    statusEl.textContent = '';
    return;
  }

  statusEl.textContent = 'Extracting fields from PDF...';
  var formData = new FormData();
  formData.append('file', file);

  fetch('/api/admin/coa-extract', { method: 'POST', credentials: 'include', body: formData })
    .then(function(res) {
      if (!res.ok) throw new Error('extraction failed');
      return res.json();
    })
    .then(function(data) {
      lastCoaExtraction = data;
      statusEl.textContent = 'Fields extracted — review before saving.';
      document.getElementById('coa-batch-lot').value = data.current_lot || '';
      document.getElementById('coa-batch-date').value = data.batch_date_guess || '';
      document.getElementById('coa-appearance').value = data.appearance || '';
      document.getElementById('coa-net-content').value = data.net_content_average || '';
      document.getElementById('coa-purity').value = data.purity || '';
      document.getElementById('coa-endotoxin').value = data.endotoxin_threshold || '';
      document.getElementById('coa-microbial').value = data.microbial_analysis || '';
      document.getElementById('coa-fentanyl').value = data.fentanyl_screen || '';
      fieldsEl.style.display = 'grid';
      saveBtn.style.display = 'inline-block';
      checkProductMismatch();
    })
    .catch(function() {
      // Auto-extraction failing (endpoint down, unreadable PDF, unrecognized
      // layout) still leaves a fully usable blank form -- same fail-quiet
      // convention as loadProductCoas() on product.html: extraction is a
      // convenience on top of manual entry, never a requirement for it.
      statusEl.textContent = 'Could not auto-extract fields — enter them manually below.';
      fieldsEl.style.display = 'grid';
      saveBtn.style.display = 'inline-block';
    });
});

document.getElementById('coa-save-btn').addEventListener('click', function() {
  var saveBtn = this;
  var productId = document.getElementById('coa-product-select').value;
  var file = document.getElementById('coa-file-input').files[0];
  var statusEl = document.getElementById('coa-save-status');
  statusEl.classList.remove('show', 'error', 'success');

  if (!productId) {
    statusEl.textContent = 'Select a product first.';
    statusEl.classList.add('show', 'error');
    return;
  }
  if (!file) {
    statusEl.textContent = 'Choose a COA PDF first.';
    statusEl.classList.add('show', 'error');
    return;
  }

  saveBtn.disabled = true;
  var formData = new FormData();
  formData.append('file', file);
  formData.append('batch_lot', document.getElementById('coa-batch-lot').value.trim());
  formData.append('batch_date', document.getElementById('coa-batch-date').value);
  formData.append('appearance', document.getElementById('coa-appearance').value.trim());
  formData.append('net_content_average', document.getElementById('coa-net-content').value.trim());
  formData.append('purity', document.getElementById('coa-purity').value.trim());
  formData.append('endotoxin_threshold', document.getElementById('coa-endotoxin').value.trim());
  formData.append('microbial_analysis', document.getElementById('coa-microbial').value.trim());
  formData.append('fentanyl_screen', document.getElementById('coa-fentanyl').value.trim());

  fetch('/api/admin/products/' + encodeURIComponent(productId) + '/coas', {
    method: 'POST',
    credentials: 'include',
    body: formData,
  })
    .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, d: d }; }); })
    .then(function(r) {
      saveBtn.disabled = false;
      if (!r.ok) {
        statusEl.textContent = r.d.error || 'Could not save certificate.';
        statusEl.classList.add('show', 'error');
        return;
      }
      statusEl.textContent = 'Certificate saved.';
      statusEl.classList.add('show', 'success');
      resetCoaForm();
      loadExistingCoas(productId);
    })
    .catch(function() {
      saveBtn.disabled = false;
      statusEl.textContent = 'Could not save certificate.';
      statusEl.classList.add('show', 'error');
    });
});

document.getElementById('admin-logout-link').addEventListener('click', function(e) {
  e.preventDefault();
  fetch('/api/admin/logout', { method: 'POST', credentials: 'include' }).then(showLogin);
});

// Check for an existing admin session on load
fetch('/api/admin/me', { credentials: 'include' })
  .then(function(res) { if (res.ok) showAdmin(); })
  .catch(function() {});
</script>

</body>
</html>
