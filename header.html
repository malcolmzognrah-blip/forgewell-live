<style>
/* .header-search-slot is a NEW wrapper (not present before) around the
   existing .header-search-row -- fixes a real bug where focusing the
   search box on mobile visibly shifted the sign-in/cart/hamburger group
   left and, at certain widths, left the sign-in dropdown's hit area
   sitting under where the tap/cursor landed, making it look like tapping
   search "opened" the sign-in menu. Root cause: .header-search-row itself
   used to be both the flex item in header's row AND the thing that went
   position:absolute on focus -- removing a flex item from flow makes
   every following sibling in a flex-wrap:nowrap row (menu-toggle's
   account/cart/hamburger group) slide left to fill the gap, which is
   exactly the "shift" that was happening. Confirmed directly (not just
   theorized) by focusing the input and diffing getBoundingClientRect()
   for the account icon before/after -- it moved ~115px left on a 390px
   viewport.
   Fix: .header-search-slot now takes over every flex-sizing property
   .header-search-row used to carry as a direct child of header (moved
   here from each host page's own <style> block, which still has the old
   declarations on .header-search-row itself -- now harmless no-ops there,
   since flex-basis/margin-left:auto/etc. only do anything on a direct
   flex child, left in place rather than editing all 16 pages purely to
   delete dead code). .header-search-slot never changes position, so it
   always keeps reserving its normal slot in header's row regardless of
   what its child does -- flexbox allocates row space from each item's
   width/flex-basis, which doesn't depend on that item's height or
   in-flow content, so .header-search-row collapsing to a 0-height
   absolutely-positioned box on focus doesn't shrink or vacate the slot
   it sits in. .header-search-row itself keeps expanding into a
   full-width strip below the header exactly as before (still
   position:absolute on :focus-within, still anchored to header's own
   position:sticky as its containing block, since .header-search-slot
   deliberately has no position value of its own to intercept that) --
   only WHERE that expansion's containing block sits changed conceptually
   (nested one level deeper), not what it visually does.
   :focus-within's specificity (0,2,0) still beats the plain max-width
   rules on .header-search-row (0,1,0) duplicated in every host page
   regardless of load order, so no !important is needed there either --
   though those rules are also now no-ops, superseded by
   .header-search-slot's own max-width below. */
@media (max-width: 1150px) {
  .header-search-row:focus-within {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 20;
    max-width: none;
    background: #fff;
    box-shadow: 0 8px 16px rgba(18,48,86,0.12);
    padding: 10px 16px;
    display: flex;
    align-items: center;
  }
}

/* Base (desktop-and-up) sizing -- matches what .header-search-row used to
   carry as a direct flex child of header before the .header-search-slot
   wrapper existed. */
.header-search-slot {
  flex: 0 1 240px;
  min-width: 0;
  max-width: 240px;
  margin-left: auto;
}
/* min-width below (overriding the base min-width:0) is a fix, not just a
   copy of the old per-host-page rules -- confirmed by testing at 320px
   that without it, .header-search-slot's flex-shrink math bottoms out
   narrow enough that the <input>'s own horizontal padding (icon space --
   56px unscoped/<=1150px: padding 11px 16px 11px 40px; 46px <=420px:
   padding 10px 12px 10px 34px) doesn't shrink to match, forcing the
   input to overflow its now-too-narrow slot and visibly collide with the
   sign-in icon next to it.
   48px/44px below are a few px UNDER each tier's own padding floor, not
   an exact match -- a signed-in customer's account-menu-wrap got
   measurably wider at narrow widths in the mobile-header change just
   before this one (the person icon re-appears below 420px specifically,
   so there's less slack at that tier than there used to be), and setting
   min-width to the exact padding value left the header itself
   overflowing the viewport by a few px at exactly 320px and 421px.
   Trimmed both down empirically (alongside the reduced <=420px
   margin-right below) until 320px through 1280px all measured 0px of
   header horizontal overflow, signed in, at every width actually tested
   -- narrower than 320px (no real device) still overflows and isn't
   pursued further, matching the site's own existing breakpoints, which
   don't explicitly target anything narrower either. */
@media (max-width: 1150px) {
  .header-search-slot {
    max-width: 200px;
    min-width: 48px;
  }
}
@media (max-width: 420px) {
  .header-search-slot {
    max-width: 160px;
    min-width: 44px;
  }
}

/* The only spacing between the search box and the account/cart/hamburger
   group is header{gap}, which shrinks to 10px (<=1150px) and 6px (<=420px)
   in each host page's own <style> block to make room as things get tighter
   -- comfortable on desktop's 18px gap, but the search box and the sign-in
   element read as touching on mobile. On .header-search-slot now (the
   actual flex item), not .header-search-row -- margin-right on the inner,
   no-longer-a-flex-item .header-search-row would just eat into its own
   parent slot's width instead of pushing the next flex sibling over.
   Smaller (4px, not 10px) specifically <=420px -- header{gap:6px} already
   applies on top of this (gap and margin both add up, they don't
   replace each other), so the two tiers land on a combined 16px/10px
   gap respectively; trimmed the redundant part of the narrower tier's
   to help it fit the min-width floor above without the header
   overflowing the viewport, verified empirically alongside it. */
@media (max-width: 1150px) {
  .header-search-slot {
    margin-right: 10px;
  }
}
@media (max-width: 420px) {
  .header-search-slot {
    margin-right: 4px;
  }
}

/* A signed-in customer's account label reads "Hi, <name>" (or their email's
   local-part if no name was set at signup -- see wireHeaderFooter() in every
   host page) instead of the short, fixed "Sign In" -- unbounded length,
   since it's the customer's own name/email. .menu-toggle (which contains
   this label) is flex-shrink:0 in header{flex-wrap:nowrap}, same as the
   logo -- only .header-search-row shrinks to compensate for its neighbors'
   width, so a long name can squeeze/overlap the search box on mobile even
   though a short "Sign In" never did. Bounding the label's width keeps
   .menu-toggle's footprint contained regardless of name length. Scoped to
   the same <=1150px tier as the focus-expand rule above -- desktop has room
   to spare and keeps showing "Hi, <name>" on one line via the plain
   .login-icon-label{ white-space:nowrap; } rule duplicated in every host
   page; the label is already hidden entirely below 420px (see each host
   page's own <style> block), so this only matters in the 420-1150px
   window. header selector prefix (not just .login-icon-label) gives this
   (0,1,1) specificity, beating that plain per-host-page rule (0,1,0)
   regardless of script-load timing -- same reasoning as :focus-within
   above, just via specificity instead of a pseudo-class.
   wireHeaderFooter() sets this label's text as "Hi,\n<name>" (a literal
   newline, not just a space) specifically so white-space:pre-line here has
   something to break on -- "Hi," lands on its own first line and the name
   on the second, rather than truncating with "..." (the old single-line
   ellipsis behavior) or wrapping unpredictably mid-word. -webkit-line-clamp
   is a second, independent safety net -- if the name itself is long enough
   to still wrap within 70px, this caps it at 2 total lines instead of
   growing a 3rd, clipping the overflow rather than expanding the header's
   height. */
@media (max-width: 1150px) {
  header .login-icon-label {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    max-width: 70px;
    white-space: pre-line;
    font-size: 0.82rem;
    line-height: 1.2;
    text-align: left;
    vertical-align: middle;
  }
}

/* Amazon-style account dropdown (Account / Sign Out) under the signed-in
   name, replacing the old direct "click the name to go straight to
   Account" behavior and the separate standalone sign-out icon. Hover needs
   no JS at all -- :hover on the wrapper (which contains both the trigger
   and the panel, so moving the mouse from one to the other never closes
   it) shows the panel directly. Click support (each host page's own
   wireHeaderFooter() toggles .open, since -- as with the hamburger's
   #nav-overlay -- interactive JS can't live in this injected fragment,
   only CSS can) is layered on the same display rule, so either mechanism
   alone is enough to show it. The arrow and dropdown both start hidden in
   the static markup above and are only revealed once JS detects a signed-in
   customer (adding .signed-in to #account-menu-wrap) -- a guest's "Sign In"
   keeps behaving exactly as it always has, plain link, no menu. */
.account-menu-wrap { position: relative; }
.account-menu-arrow { display: none; }
.account-menu-wrap.signed-in .account-menu-arrow { display: inline-block; }
/* "Hi, <name>" already identifies the account -- the generic person icon
   next to it is redundant once signed in, on both desktop and mobile (no
   media query here, unlike the other rules in this block) -- EXCEPT below
   420px, where each host page's own <style> block hides .login-icon-label
   entirely (see the media query rule above). Without this override, a
   signed-in customer on a narrow phone was left with neither the name nor
   the icon -- just the bare dropdown arrow, no visible account-menu
   affordance at all. Caught while testing the two-line mobile greeting:
   fixing the pre-existing specificity bug that kept the label wrongly
   visible below 420px (see each host page's own comment on this) also
   stopped it from accidentally masking this gap. Same selector as the
   unconditional rule above, so plain source order (this rule comes later)
   is enough to override it here -- no specificity trick needed. */
.account-menu-wrap.signed-in .login-icon-glyph { display: none; }
@media (max-width: 420px) {
  .account-menu-wrap.signed-in .login-icon-glyph { display: inline-block; }
}
.account-dropdown {
  display: none;
  position: absolute;
  top: 100%;
  right: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(18,48,86,0.16);
  z-index: 9999;
  min-width: 140px;
  padding: 6px 0;
}
.account-menu-wrap.signed-in:hover .account-dropdown,
.account-menu-wrap.signed-in.open .account-dropdown {
  display: block;
}
.account-dropdown-item {
  display: block;
  color: var(--navy-dark);
  font-size: 0.9rem;
  font-weight: 700;
  text-decoration: none;
  font-family: 'Quicksand', sans-serif;
  padding: 11px 18px;
}
.account-dropdown-item:hover { background: var(--panel); }
</style>
