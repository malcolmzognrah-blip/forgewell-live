<!-- Account creation is now mandatory to browse (see index.html's landing
     flow) -- this hides the real page and bounces straight to the landing
     page's sign-in step for anyone without a session, so a direct/bookmarked
     link here can't bypass it. Kept separate from the age-gate modal below,
     which still runs unchanged for whoever does have a session but hasn't
     seen it on this device. -->
<style>html:not(.gw-auth-ok){ visibility:hidden; }</style>
<script>
fetch('/api/auth/me', { credentials: 'include' }).then(function(res){
  if (!res.ok) { window.location.replace('/index.html'); return; }
  document.documentElement.classList.add('gw-auth-ok');
}).catch(function(){
  window.location.replace('/index.html');
});
</script>

<style>
@font-face { font-family:'Quicksand'; src:url('/fonts/quicksand-variable.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
:root{ --navy:#1B4B8C; --navy-dark:#123056; --green:#3FA34D; --gray:#6b6b6b; --bg:#FFFFFF; --panel:#F7F8F6; --line:#E4E4E0; }
*{box-sizing:border-box;margin:0;padding:0;}
body{ background:var(--bg); color:#1a1a1a; font-family:'Quicksand',sans-serif; font-weight:500; }

/* ---- header (single-row, matches header.html) ---- */
header{
  display:flex; align-items:center; flex-wrap:nowrap; gap:18px;
  padding:12px 20px; max-width:1200px; margin:0 auto;
  position:sticky; top:0; z-index:10;
  background:#fff; border-bottom:1px solid var(--line);

.logo-mark{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.logo-word{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.2rem; color:var(--navy); white-space:nowrap; }

.header-nav-link{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; color:var(--navy); text-decoration:none; white-space:nowrap; }

.header-search-row{ position:relative; flex:0 1 240px; min-width:0; max-width:240px; margin-left:auto; }
.header-search-row input{ width:100%; box-sizing:border-box; min-width:0; padding:11px 16px 11px 40px; border-radius:6px; border:1.5px solid var(--line); background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6b6b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center/16px 16px; color:#333; font-size:0.95rem; font-family:'Quicksand',sans-serif; }

<script>
(function(){
  var KEY = 'forgewell_age_verified';
  if (localStorage.getItem(KEY) === 'yes') {
    var existingOverlay = document.getElementById('age-gate-overlay');
    if (existingOverlay) existingOverlay.remove();
    document.body.classList.remove('gate-active');
    return;
  }

  document.body.classList.add('gate-active');
  var overlay = document.getElementById('age-gate-overlay');
  var ageCheck = document.getElementById('gate-age-check');
  var researchCheck = document.getElementById('gate-research-check');
  var rememberCheck = document.getElementById('gate-remember-check');
  var acceptBtn = document.getElementById('gate-accept-btn');
  var exitBtn = document.getElementById('gate-exit-btn');

  function updateAcceptState(){
    if (ageCheck.checked && researchCheck.checked) {
      acceptBtn.classList.add('enabled');
    } else {
      acceptBtn.classList.remove('enabled');
    }
  }
  ageCheck.addEventListener('change', updateAcceptState);
  researchCheck.addEventListener('change', updateAcceptState);

  acceptBtn.addEventListener('click', function(){
    if (!ageCheck.checked || !researchCheck.checked) return;
    if (rememberCheck.checked) localStorage.setItem(KEY, 'yes');
    overlay.remove();
    document.body.classList.remove('gate-active');
  });

  exitBtn.addEventListener('click', function(){
    window.location.href = 'https://www.google.com';
  });
})();
</script>

<script>

let allProducts = [];
let cart = JSON.parse(localStorage.getItem('forgewell_cart') || '[]');
let productGroupList = [];
let currentCategoryFilter = 'all';
let currentSortMode = 'az';
let inStockOnlyFilter = false;
let currentSearchQuery = '';
let currentPage = 1;
// Caches HEAD-check results per image URL so revisiting a page (or flipping
// between category tabs) doesn't re-verify images already confirmed this
// session. Paired with renderGeneration below so a slow in-flight check from
// a page the user has already navigated away from can't clobber the grid.
let verifiedImageCache = new Map();
let renderGeneration = 0;

// So clicking "Shop" in product.html's breadcrumb returns to this exact
// category/page/scroll position instead of a blank default -- sessionStorage
// (not a URL param) so product.html's Shop link and the multi-hop breadcrumb
// trail param don't need to know anything about shop.html's state at all,
// and so two tabs browsing the shop independently can't clobber each other.
const SHOP_STATE_KEY = 'forgewell_shop_state';

function saveShopState() {
  sessionStorage.setItem(SHOP_STATE_KEY, JSON.stringify({
    category: currentCategoryFilter,
    sort: currentSortMode,
    inStockOnly: inStockOnlyFilter,
    search: currentSearchQuery,
    page: currentPage,
    scrollY: window.scrollY,
  }));
}

const SORT_MODES = ['az', 'za', 'price_low', 'price_high', 'popular', 'sales'];

// Applied after the category filter and before pagination -- everything
// needed (inStock/onSale/unitsSold/lowestPrice/name) was already computed
// per-group in renderShopGrid()'s grouping step, so this never re-fetches
// or re-groups, just re-orders the already-loaded list.
function sortGroupList(list, mode) {
  const sorted = list.slice();
  switch (mode) {
    case 'za':
      sorted.sort((a, b) => b.name.localeCompare(a.name));
      break;
    case 'price_low':
      sorted.sort((a, b) => a.lowestPrice - b.lowestPrice);
      break;
    case 'price_high':
      sorted.sort((a, b) => b.lowestPrice - a.lowestPrice);
      break;
    case 'popular':
      sorted.sort((a, b) => b.unitsSold - a.unitsSold);
      break;
    case 'sales':
      // onSale families first; A-Z as a stable tiebreak within each bucket
      // (both the on-sale group and the not-on-sale group) rather than
      // leaving same-bucket order unspecified.
      sorted.sort((a, b) => {
        if (a.onSale !== b.onSale) return a.onSale ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      break;
    case 'az':
    default:
      sorted.sort((a, b) => a.name.localeCompare(b.name));
      break;
  }
  return sorted;
}

// Ids that are base component records for blend/kit products -- intentionally
// $0, never meant to be sold standalone. Excluded from the shop grid and
// from the size-selector on product pages. Confirmed intentional, not a
// pending-Apex pricing gap. mt-2/pt-141 removed -- both are now real,
// priced, sellable products; cjc-1295/semax/selank stay excluded since
// they have real combo-product alternatives instead of a standalone listing.
const EXCLUDED_COMPONENT_IDS = ['cjc-1295', 'semax', 'selank'];

// Category tab colors -- assigned round-robin from real category values
// found in the live data, since the old hardcoded 5-category taxonomy
// (glp/secretagogue/healing/blend/cosmetic) doesn't match the current
// ~125-item catalog's categories. Falls back to gray if we run out.
// Fixed mapping confirmed against the live DB (SELECT category, count(*)
// FROM products GROUP BY category -- returned exactly these 4 clean,
// lowercase, singular values, no nulls, no typos): essential(5), amino(26),
// kit(28), peptide(69). Anything unexpected falls back to "Other" / gray
// rather than silently vanishing from every tab.
const CATEGORY_META = {
  peptide:   { label: 'Peptides',   color: '#1B4B8C' },
  amino:     { label: 'Aminos',     color: '#3FA34D' },
  kit:       { label: 'Kits',       color: '#E0812C' },
  essential: { label: 'Essentials', color: '#6B4FA0' },
};
const FALLBACK_CATEGORY = { label: 'Other', color: '#6b6b6b' };

function categoryMeta(cat) {
  return CATEGORY_META[cat] || FALLBACK_CATEGORY;
}

// Strips a trailing size/dose token like "5mg", "(5mg)", "10 mcg", "10ct"
// to get the base product label used to group sibling size-tier rows into
// one card. "ct" (count) covers non-dosage quantity tiers like Insulin
// Needles' 10ct/100ct. String match against `name`, not a real key --
// base_product_id is empty for simple tiered products (confirmed in the
// DB this session).
function baseLabel(name) {
  if (!name) return '';
  return name.replace(/\s*\(?\d+(\.\d+)?\s?(mg|mcg|iu|ml|ct)(?:\s*\/\s*\d+(\.\d+)?\s?(mg|mcg|iu|ml|ct))*\)?\s*$/i, '').trim();
}

// Kit names are formatted "<Family> Kit (<dosage>, <N>-Pack)" -- the
// ", N-Pack" text before the closing paren means baseLabel()'s regex
// (which expects the string to end right after the dosage/unit) never
// matches, so kits never grouped under baseLabel() alone. Strip the whole
// trailing parenthetical instead, but only for kits -- broadening
// baseLabel() itself to strip any trailing parenthetical would also wrongly
// merge unrelated non-kit products that happen to end in parens (e.g. two
// differently-sized "Insulin Needles (Large pack)" / "(Small pack)"
// listings).
function groupKeyFor(p) {
  return p.category === 'kit'
    ? p.name.replace(/\s*\([^)]*\)\s*$/, '').trim()
    : baseLabel(p.name);
}

function resolveImagePath(path) {
  if (!path) return null;
  if (path.indexOf('http') === 0) return path;
  // DB stores paths like "images/glutathione.png" -- relative to site root.
  // Actual files are served as WebP (much smaller); the DB only ever knows
  // about the .png name, so the swap happens here rather than at the source.
  path = path.replace(/\.png$/i, '.webp');
  if (path.indexOf('/') === 0) return path;
  return '/' + path;
}

async function catalogSearchJump(query) {
  query = query.trim().toLowerCase();
  if (!query) return;
  await productsReady;
  const match = allProducts.find(p => {
    const base = baseLabel(p.name).toLowerCase();
    return base === query || base.indexOf(query) !== -1;
  });
  if (match) {
    saveShopState();
    window.location.href = '/product.html?id=' + encodeURIComponent(match.id);
  } else {
    window.location.href = '/shop.html#tabs';
  }
}

// Wires up all header/footer interactivity. Runs only after header.html and
// footer.html have been fetched and injected below -- their elements don't
// exist in the DOM before then.
function wireHeaderFooter() {
  var footerSearchInput = document.getElementById('footer-catalog-search-input');
  if (footerSearchInput) {
    footerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var footerSearchIconBtn = document.getElementById('footer-search-icon-btn');
  if (footerSearchIconBtn && footerSearchInput) {
    footerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var headerSearchInput = document.getElementById('header-catalog-search-input');
  if (headerSearchInput) {
    headerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(headerSearchInput.value);
    });
  }
  var headerSearchIconBtn = document.getElementById('header-search-icon-btn');
  if (headerSearchIconBtn && headerSearchInput) {
    headerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(headerSearchInput.value);
    });
  }

  var hamBtn = document.getElementById('hamburger-btn');
  var overlay = document.getElementById('nav-overlay');
  if (hamBtn && overlay) {
    hamBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.toggle('open');
    });
  }
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target.closest('a')) overlay.classList.remove('open');
    });
    document.addEventListener('click', function(e) {
      if (overlay.classList.contains('open') && !overlay.contains(e.target)) {
        overlay.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') overlay.classList.remove('open');
    });
  }

  // Amazon-style Account/Sign Out dropdown under the account name (see
  // #account-menu-wrap's CSS in header.html -- hover alone already shows it
  // via pure CSS there; this wires click-to-toggle plus close-on-outside-
  // click/Escape, same pattern as the hamburger/#nav-overlay above). Wired
  // unconditionally (not inside the signed-in check below) so the listener
  // exists regardless of session state, but it only intercepts the click
  // once #account-menu-wrap carries .signed-in -- a guest's click still
  // falls through to the plain /login.html link exactly as before.
  var accountMenuWrap = document.getElementById('account-menu-wrap');
  if (accountMenuWrap) {
    document.getElementById('account-icon').addEventListener('click', function(e) {
      if (!accountMenuWrap.classList.contains('signed-in')) return;
      e.preventDefault();
      accountMenuWrap.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (accountMenuWrap.classList.contains('open') && !accountMenuWrap.contains(e.target)) {
        accountMenuWrap.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') accountMenuWrap.classList.remove('open');
    });
  }

  // Checks whether the person is logged in and updates the header's account
  // icon accordingly -- shows "Hi, [name]" linking to order history if
  // logged in, "Sign In" linking to the login/signup page otherwise. Runs
  // on every page that shares this header.
  var loginIcon = document.getElementById('account-icon');
  if (loginIcon) {
    fetch('/api/auth/me', { credentials: 'include' })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(customer) {
        if (customer) {
          loginIcon.href = '/account.html#orders';
          loginIcon.title = 'My Account (' + customer.email + ')';
          // Name wasn't always required at signup -- older accounts can
          // still have a null name, so fall back to the email's local-part
          // rather than showing a blank/broken greeting.
          var displayName = customer.name || customer.email.split('@')[0];
          var labelEl = loginIcon.querySelector('.login-icon-label');
          if (labelEl) labelEl.textContent = 'Hi, ' + displayName;

          function doLogout() {
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
              .then(function() { window.location.href = '/shop.html'; });
          }

          // Reveals the arrow and enables the Account/Sign Out dropdown
          // (see #account-menu-wrap's CSS in header.html) -- replaces the
          // old standalone icon-only sign-out button.
          if (accountMenuWrap) accountMenuWrap.classList.add('signed-in');
          var signOutItem = document.getElementById('account-dropdown-signout');
          if (signOutItem) {
            signOutItem.addEventListener('click', function(e) {
              e.preventDefault();
              doLogout();
            });
          }

          var navInner = document.querySelector('.nav-overlay-inner');
          if (navInner && !document.getElementById('nav-logout-link')) {
            var logoutLink = document.createElement('a');
            logoutLink.href = '#';
            logoutLink.id = 'nav-logout-link';
            logoutLink.textContent = 'Log Out';
            logoutLink.addEventListener('click', function(e) {
              e.preventDefault();
              doLogout();
            });
            navInner.appendChild(logoutLink);
          }
        }
      })
      .catch(function() { /* not logged in or request failed -- leave icon pointing to /login.html */ });
  }

  var signupBtn = document.getElementById('footer-signup-btn');
  if (signupBtn) {
    signupBtn.addEventListener('click', async () => {
      const input = document.getElementById('footer-email-input');
      const msg = document.getElementById('footer-signup-msg');
      const email = input.value.trim();
      if (!email || email.indexOf('@') === -1) {
        msg.style.color = '#c0392b';
        msg.textContent = 'Please enter a valid email.';
        return;
      }
      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email: email})
        });
        const data = await res.json();
        msg.style.color = '#3FA34D';
        msg.textContent = data.alreadySubscribed
          ? 'Already signed up — code: ' + data.discountCode
          : 'Success! Your code: ' + data.discountCode;
        input.value = '';
      } catch (err) {
        msg.style.color = '#c0392b';
        msg.textContent = 'Something went wrong. Please try again.';
      }
    });
  }

  // Restores the header's cart count from localStorage now that the header
  // actually exists in the DOM (it didn't yet when updateCartIcon() first
  // ran further down this script).
  updateCartIcon();
}

Promise.all([
  fetch('/header.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('header-placeholder').innerHTML = html;
  }),
  fetch('/footer.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('footer-placeholder').innerHTML = html;
  })
]).then(wireHeaderFooter).catch(function(err) {
  console.error('Failed to load shared header/footer', err);
});

function buildCardHtml(group) {
  // group = {baseId, name, category, lowestPrice, highestPrice, lowestRegularPrice, lot, dosage, imgUrl}
  // lowestPrice/highestPrice are already effectivePrice (sale-aware) as
  // computed in renderShopGrid()'s grouping step below -- a range (kit
  // with varying tiers) never gets a "was" strikethrough since the range
  // itself already communicates variability; a single/"From" price does,
  // when the cheapest tier backing that card is actually on sale.
  const meta = categoryMeta(group.category);
  let priceLabel;
  if (group.category === 'kit' && group.multi && group.highestPrice > group.lowestPrice) {
    priceLabel = '$' + group.lowestPrice.toFixed(2) + '–$' + group.highestPrice.toFixed(2);
  } else if (group.lowestPrice > 0) {
    priceLabel = (group.multi ? 'From $' : '$') + group.lowestPrice.toFixed(2);
    if (group.lowestRegularPrice > group.lowestPrice) {
      priceLabel += '<span class="was">$' + group.lowestRegularPrice.toFixed(2) + '</span>';
    }
  } else {
    priceLabel = '$XX';
  }
  return '<div class="card" data-tag="' + group.category + '" data-product-id="' + group.baseId + '">' +
    '<div class="tag-pill" style="background:' + meta.color + '">' + meta.label + '</div>' +
    (group.onSale ? '<div class="sale-badge">Sale</div>' : '') +
    '<div class="vial"><img src="' + group.imgUrl + '" alt="' + group.name + '" loading="lazy" onerror="this.closest(\'.card\').remove()"></div>' +
    '<h3>' + group.name + '</h3>' +
    '<div class="price-row">' +
      '<span class="price">' + priceLabel + '</span>' +
      '<span class="buy-btn" style="background:' + meta.color + '">Buy Now</span>' +
      '<span class="add-btn" style="border-color:' + meta.color + '; color:' + meta.color + ';">Add to Cart</span>' +
    '</div>' +
  '</div>';
}

async function renderShopGrid() {
  const gridEl = document.getElementById('grid');
  const tabsEl = document.getElementById('tabs');
  if (!gridEl) return;

  let products;
  try {
    const res = await fetch('/api/products');
    products = await res.json();
    allProducts = products;
  } catch (err) {
    console.error('Failed to load products from backend:', err);
    gridEl.innerHTML = '<p style="padding:20px;color:#6b6b6b;">Could not load products right now.</p>';
    return;
  }

  // Group by base label (size-tier variants collapse into one card, linking
  // to the lowest-priced tier by default), excluding component-only records.
  // inStock/onSale/unitsSold are family-level aggregates for the sort/filter
  // controls, not just the representative (cheapest) tier's own values --
  // a family counts as in-stock or on-sale if ANY tier is, and unitsSold is
  // summed across every tier, since the card represents the whole family,
  // not one arbitrary row within it (same reasoning already applied to
  // "cheapest tier wins the card" for price/dosage/lot below).
  const groups = {};
  products.forEach(p => {
    if (EXCLUDED_COMPONENT_IDS.indexOf(p.id) !== -1) return;
    const imgUrl = resolveImagePath(p.image_path);
    if (!imgUrl) return; // image-matching display rule: no image, no listing
    const base = groupKeyFor(p);
    if (!groups[base]) {
      groups[base] = { baseId: p.id, name: base, category: p.category || 'other',
        lowestPrice: p.effectivePrice, highestPrice: p.effectivePrice, lowestRegularPrice: p.price,
        lot: p.lot, dosage: p.dosage, imgUrl: imgUrl, multi: false, count: 1,
        inStock: p.stock_status !== 'out_of_stock', onSale: !!p.onSaleNow, unitsSold: p.units_sold || 0 };
    } else {
      groups[base].count += 1;
      groups[base].multi = true;
      groups[base].inStock = groups[base].inStock || (p.stock_status !== 'out_of_stock');
      groups[base].onSale = groups[base].onSale || !!p.onSaleNow;
      groups[base].unitsSold += (p.units_sold || 0);
      if (p.effectivePrice > 0 && (groups[base].lowestPrice <= 0 || p.effectivePrice < groups[base].lowestPrice)) {
        groups[base].lowestPrice = p.effectivePrice;
        groups[base].lowestRegularPrice = p.price;
        groups[base].baseId = p.id; // link to the cheapest tier
        groups[base].dosage = p.dosage;
        groups[base].lot = p.lot;
      }
      if (p.effectivePrice > 0 && p.effectivePrice > groups[base].highestPrice) {
        groups[base].highestPrice = p.effectivePrice;
      }
    }
  });

  // The "no image, no listing" rule above only checks that image_path is a
  // non-empty string -- it doesn't catch a path that 404s. That's now handled
  // by renderProductsPage(), which HEAD-checks only the current page's items
  // (12-24) instead of the whole catalog here -- checking all ~120 groups
  // up front, before any pagination happened, cost ~6s of pure network
  // latency on every load for the sake of catching a small handful of dead
  // links. A dead image on a page still means that page renders a bit short
  // rather than a perfectly full grid, but that's a rare, one-page-at-a-time
  // cosmetic trade-off against blocking the entire grid on every visit.
  productGroupList = Object.values(groups).sort((a, b) => a.name.localeCompare(b.name));

  // Categories present in the live data, ordered to match the confirmed
  // DB values (peptide/amino/kit/essential), any unexpected value sorts last.
  const knownOrder = ['peptide', 'amino', 'kit', 'essential'];
  const categories = [...new Set(productGroupList.map(g => g.category))]
    .sort((a, b) => {
      const ai = knownOrder.indexOf(a), bi = knownOrder.indexOf(b);
      if (ai === -1 && bi === -1) return a.localeCompare(b);
      if (ai === -1) return 1;
      if (bi === -1) return -1;
      return ai - bi;
    });

  // Restore whatever category/sort/filter/page/scroll the customer had
  // before clicking into a product (see saveShopState()), so the "Shop"
  // breadcrumb link on product.html returns them to where they actually
  // were instead of a blank default. Falls back to the normal defaults if
  // there's no saved state, or if the saved category no longer exists in
  // the live catalog.
  //
  // saveShopState() runs whenever a product card is clicked (or the header
  // search jumps to one) -- not only when the breadcrumb will later be
  // used -- so the saved state can sit in sessionStorage indefinitely and
  // would otherwise get silently reapplied to ANY later shop.html visit
  // (Home link, logo, a different nav link, a bookmark, typing the URL
  // directly), not just a real "came back via the breadcrumb" trip. Gating
  // on document.referrer -- which reflects the actual previous page for a
  // normal same-origin navigation, regardless of whether the link was a
  // plain <a> (the breadcrumb) or a JS-driven window.location.href (the
  // header search jump) -- restricts restoration to genuinely arriving
  // from product.html, which is the only case this was ever meant for.
  let cameFromProduct = false;
  try {
    cameFromProduct = !!document.referrer && new URL(document.referrer).pathname === '/product.html';
  } catch (e) { cameFromProduct = false; }

  let savedShopState = null;
  if (cameFromProduct) {
    try {
      const raw = sessionStorage.getItem(SHOP_STATE_KEY);
      if (raw) savedShopState = JSON.parse(raw);
    } catch (e) { savedShopState = null; }
  }
  const savedCategoryValid = savedShopState && (savedShopState.category === 'all' || categories.includes(savedShopState.category));
  const savedSortValid = savedShopState && SORT_MODES.includes(savedShopState.sort);

  currentCategoryFilter = savedCategoryValid ? savedShopState.category : 'all';
  currentSortMode = savedSortValid ? savedShopState.sort : 'az';
  inStockOnlyFilter = !!(savedShopState && savedShopState.inStockOnly);
  currentSearchQuery = (savedShopState && savedShopState.search) || '';
  currentPage = (savedShopState && savedShopState.page) || 1;
  const sortSelectEl = document.getElementById('sort-select');
  if (sortSelectEl) sortSelectEl.value = currentSortMode;
  const inStockCheckboxEl = document.getElementById('in-stock-only-checkbox');
  if (inStockCheckboxEl) inStockCheckboxEl.checked = inStockOnlyFilter;
  const searchInputEl = document.getElementById('product-search-input');
  if (searchInputEl) searchInputEl.value = currentSearchQuery;
  renderProductsPage().then(() => {
    if (savedShopState && typeof savedShopState.scrollY === 'number') {
      window.scrollTo(0, savedShopState.scrollY);
    }
  });

  // Rebuild tabs from real categories.
  if (tabsEl) {
    const allActive = currentCategoryFilter === 'all';
    let tabsHtml = '<div class="cat-tab' + (allActive ? ' active' : '') + '" data-filter="all"' +
      (allActive ? ' style="background:#141414; color:#fff; border-color:#141414;"' : '') + '>All</div>';
    categories.forEach(cat => {
      const meta = categoryMeta(cat);
      const isActive = currentCategoryFilter === cat;
      tabsHtml += '<div class="cat-tab' + (isActive ? ' active' : '') + '" data-filter="' + cat + '" data-color="' + meta.color + '"' +
        (isActive ? ' style="background:' + meta.color + '; color:#fff; border-color:' + meta.color + ';"' : '') + '>' + meta.label + '</div>';
    });
    tabsEl.innerHTML = tabsHtml;
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(t => {
          t.classList.remove('active');
          t.style.background = '#fff';
          t.style.color = '#6b6b6b';
          t.style.borderColor = '#E4E4E0';
        });
        tab.classList.add('active');
        const color = tab.dataset.color || '#141414';
        tab.style.background = color;
        tab.style.color = '#fff';
        tab.style.borderColor = color;
        currentCategoryFilter = tab.dataset.filter;
        currentPage = 1;
        renderProductsPage();
      });
    });
  }
}

// .grid uses grid-template-columns:repeat(auto-fill, minmax(160px,1fr)) with
// no breakpoint overrides, so column count is fluid rather than fixed per
// screen size. auto-fill (unlike auto-fit) always resolves to one computed
// track per column that fits the container, even when the grid is empty or
// partially filled, so this reads the real current column count straight
// from layout instead of guessing at breakpoints.
function computeGridColumns() {
  const gridEl = document.getElementById('grid');
  if (!gridEl) return 1;
  const cols = getComputedStyle(gridEl).gridTemplateColumns.trim().split(/\s+/).filter(Boolean).length;
  return cols || 1;
}

async function renderProductsPage() {
  const gridEl = document.getElementById('grid');
  if (!gridEl) return;

  const myGeneration = ++renderGeneration;

  let filtered = currentCategoryFilter === 'all'
    ? productGroupList
    : productGroupList.filter(g => g.category === currentCategoryFilter);
  if (inStockOnlyFilter) filtered = filtered.filter(g => g.inStock);
  if (currentSearchQuery) filtered = filtered.filter(g => g.name.toLowerCase().includes(currentSearchQuery));
  filtered = sortGroupList(filtered, currentSortMode);

  const itemsPerPage = computeGridColumns() * 4;
  let totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));

  // totalPages is computed from the unverified count (see renderShopGrid()),
  // so it doesn't account for broken images -- it's just how many items
  // exist, which won't always divide evenly by itemsPerPage. A trailing page
  // left with less than half a page's worth (e.g. a single lonely card) reads
  // as broken rather than a normal partial last row, so fold it into the
  // previous page instead of giving it its own page.
  if (totalPages > 1) {
    const lastPageSize = filtered.length - (totalPages - 1) * itemsPerPage;
    if (lastPageSize <= itemsPerPage / 2) totalPages -= 1;
  }
  currentPage = Math.min(Math.max(1, currentPage), totalPages);

  const start = (currentPage - 1) * itemsPerPage;
  // The (possibly merged) last page absorbs whatever remains rather than a
  // fixed-size slice, so it can run a bit larger than itemsPerPage.
  const end = currentPage === totalPages ? filtered.length : start + itemsPerPage;
  const pageItems = filtered.slice(start, end);

  // Only HEAD-check this page's ~12-24 items, not the whole catalog (see the
  // comment in renderShopGrid()). verifiedImageCache means flipping back to
  // a page or category tab already seen this session re-checks nothing.
  const verifiedPageItems = (await Promise.all(pageItems.map(async (g) => {
    if (verifiedImageCache.has(g.imgUrl)) {
      return verifiedImageCache.get(g.imgUrl) ? g : null;
    }
    let ok;
    try {
      const res = await fetch(g.imgUrl, { method: 'HEAD' });
      ok = res.ok;
    } catch (err) {
      ok = false;
    }
    verifiedImageCache.set(g.imgUrl, ok);
    return ok ? g : null;
  }))).filter(Boolean);

  // A page/tab/resize change that started after this one began should win --
  // discard this result rather than overwrite the grid with stale content.
  if (myGeneration !== renderGeneration) return;

  gridEl.innerHTML = verifiedPageItems.length
    ? verifiedPageItems.map(g => buildCardHtml(g)).join('')
    : '<p style="padding:20px;color:#6b6b6b;">' + (currentSearchQuery ? 'No products match your search.' : 'No products in this category.') + '</p>';

  renderPaginationControls(totalPages, currentPage);
}

function renderPaginationControls(totalPages, page) {
  const pagerEl = document.getElementById('pagination');
  if (!pagerEl) return;

  if (totalPages <= 1) {
    pagerEl.innerHTML = '';
    return;
  }

  // First/last + neighbors of the current page, with an ellipsis filling
  // any gap -- keeps the control from growing unbounded as the catalog does.
  const pageNumbers = [1];
  for (let p = page - 1; p <= page + 1; p++) {
    if (p > 1 && p < totalPages) pageNumbers.push(p);
  }
  if (totalPages > 1) pageNumbers.push(totalPages);
  const uniquePages = [...new Set(pageNumbers)].sort((a, b) => a - b);

  let html = '<button class="page-btn" data-page="prev"' + (page === 1 ? ' disabled' : '') + '>‹ Prev</button>';
  let prevPage = 0;
  uniquePages.forEach(p => {
    if (p - prevPage > 1) {
      html += '<span class="page-btn ellipsis">…</span>';
    }
    html += '<button class="page-btn' + (p === page ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
    prevPage = p;
  });
  html += '<button class="page-btn" data-page="next"' + (page === totalPages ? ' disabled' : '') + '>Next ›</button>';

  pagerEl.innerHTML = html;
}

let gridResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(gridResizeTimer);
  gridResizeTimer = setTimeout(renderProductsPage, 150);
});

document.addEventListener('click', (e) => {
  const pageBtn = e.target.closest('.page-btn[data-page]');
  if (!pageBtn || pageBtn.disabled) return;
  const target = pageBtn.dataset.page;
  if (target === 'prev') currentPage -= 1;
  else if (target === 'next') currentPage += 1;
  else currentPage = parseInt(target, 10);
  renderProductsPage();
  const heading = document.querySelector('.section-heading');
  if (heading) heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

document.getElementById('sort-select').addEventListener('change', function() {
  currentSortMode = this.value;
  currentPage = 1;
  renderProductsPage();
});

document.getElementById('in-stock-only-checkbox').addEventListener('change', function() {
  inStockOnlyFilter = this.checked;
  currentPage = 1;
  renderProductsPage();
});

// Debounced -- renderProductsPage() HEAD-checks every visible card's image
// before rendering (see the image-verification block above), so firing it
// on every raw keystroke would mean a burst of network requests per
// character typed instead of one pass after the customer pauses.
let productSearchDebounceTimer = null;
document.getElementById('product-search-input').addEventListener('input', function() {
  var value = this.value;
  clearTimeout(productSearchDebounceTimer);
  productSearchDebounceTimer = setTimeout(function() {
    currentSearchQuery = value.trim().toLowerCase();
    currentPage = 1;
    renderProductsPage();
  }, 200);
});

function saveCart() {
  localStorage.setItem('forgewell_cart', JSON.stringify(cart));
  updateCartIcon();
}

function updateCartIcon() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById('cart-count');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }
}

function addToCart(productId) {
  const product = allProducts.find(p => p.id === productId);
  if (!product) return;
  const existing = cart.find(i => i.productId === productId);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ productId: product.id, name: product.name, price: (product.effectivePrice != null ? product.effectivePrice : product.price), qty: 1 });
  }
  saveCart();
}

// Visual confirmation that an Add to Cart click landed, shown directly on
// the clicked element itself rather than a toast -- works the same way
// regardless of where/how big the button is. Styles via direct inline JS
// (not a CSS class) since this card's .add-btn already carries its own
// inline style (category-colored outline) that a stylesheet class couldn't
// override without !important -- capturing/restoring the original style
// attribute string works whether or not one was already present. Returns
// false (caller should skip the actual addToCart call) while a previous
// flash on the same element is still cooling down, so a rapid double-click
// can't silently add twice.
function flashAddedFeedback(el) {
  if (el.dataset.adding === 'true') return false;
  el.dataset.adding = 'true';
  var originalText = el.textContent;
  var originalStyle = el.getAttribute('style');
  el.textContent = '✓ Added!';
  el.style.background = 'var(--green)';
  el.style.borderColor = 'var(--green)';
  el.style.color = '#fff';
  setTimeout(function() {
    el.textContent = originalText;
    if (originalStyle) {
      el.setAttribute('style', originalStyle);
    } else {
      el.removeAttribute('style');
    }
    el.dataset.adding = 'false';
  }, 1200);
  return true;
}

document.addEventListener('click', (e) => {
  if (e.target.classList.contains('add-btn')) {
    const card = e.target.closest('.card');
    const productId = card?.dataset.productId;
    if (!productId) {
      alert('Product not loaded yet — try refreshing the page.');
      return;
    }
    if (flashAddedFeedback(e.target)) addToCart(productId);
    return;
  }
  if (e.target.classList.contains('buy-btn')) {
    const card = e.target.closest('.card');
    const productId = card?.dataset.productId;
    if (!productId) {
      alert('Product not loaded yet — try refreshing the page.');
      return;
    }
    addToCart(productId);
    window.location.href = '/checkout.html';
    return;
  }

  // Clicking anywhere else on a card (image, name, lot, price) goes to
  // that product's detail page — the buttons above are handled first
  // and return early, so they're excluded from this navigation.
  const card = e.target.closest('.card');
  if (card) {
    const productId = card.dataset.productId;
    if (productId) {
      saveShopState();
      window.location.href = '/product.html?id=' + encodeURIComponent(productId);
    }
  }
});

let productsReady = renderShopGrid();
updateCartIcon();
</script>


<style>
#email-popup-overlay{position:fixed;inset:0;background:rgba(18,48,86,0.55);z-index:9998;display:none;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;}
#email-popup-overlay.popup-active{display:flex;}
#email-popup-modal{background:#F7F8F6;border:1px solid #E4E4E0;border-radius:12px;max-width:420px;width:90%;padding:32px 28px;position:relative;text-align:center;}
#email-popup-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:22px;color:#6b6b6b;cursor:pointer;line-height:1;}
#email-popup-modal h2{color:#1B4B8C;margin:0 0 8px;font-size:24px;}
.popup-sub{color:#6b6b6b;margin:0 0 20px;font-size:14px;}
#email-popup-input{width:100%;padding:12px 14px;border:1px solid #E4E4E0;border-radius:8px;font-family:'Quicksand',sans-serif;font-size:15px;margin-bottom:8px;box-sizing:border-box;}
#email-popup-error{color:#c0392b;font-size:13px;min-height:16px;margin-bottom:8px;}
#email-popup-submit,#email-popup-copy{width:100%;padding:12px;background:#1B4B8C;color:#fff;border:none;border-radius:8px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:15px;cursor:pointer;margin-top:4px;}
#email-popup-submit:hover,#email-popup-copy:hover{background:#123056;}
.popup-skip{margin-top:14px;color:#6b6b6b;font-size:13px;cursor:pointer;text-decoration:underline;}
#email-popup-code{font-size:28px;font-weight:700;color:#3FA34D;letter-spacing:2px;margin:14px 0;padding:12px;background:#fff;border:1px dashed #3FA34D;border-radius:8px;}
</style>

<div id="email-popup-overlay">
  <div id="email-popup-modal">
    <button id="email-popup-close" aria-label="Close">&times;</button>
    <div id="email-popup-step-form">
      <h2>Get 15% Off</h2>
      <p class="popup-sub">Sign up for exclusive discounts on your next order.</p>
      <input type="email" id="email-popup-input" placeholder="you@example.com" />
      <div id="email-popup-error"></div>
      <button id="email-popup-submit">Get My Code</button>
      <div class="popup-skip" id="email-popup-skip">No thanks</div>
    </div>
    <div id="email-popup-step-success" style="display:none;">
      <h2>You're In!</h2>
      <p class="popup-sub">Use this code on your next order:</p>
      <div id="email-popup-code">FORGE15</div>
      <button id="email-popup-copy">Copy Code</button>
    </div>
  </div>
</div>

<script>
(function(){
  var POPUP_KEY = 'forgewell_email_popup_shown';
  // Matches the code shown in #email-popup-code below. If this popup ever
  // offers more than one code, update this to look up whichever code is
  // actually being offered -- suppressing on THIS code's redemption status
  // only, not "any coupon redeemed", is the intended behavior.
  var PROMO_CODE = 'FORGE15';

  // Signed-in customers who've already redeemed this code shouldn't be
  // prompted for it again. /api/coupons/mine is cookie-gated (same session
  // as /api/auth/me) and 401s for a signed-out visitor -- caught below and
  // treated as "can't tell, so behave as before" rather than suppressing,
  // since a signed-out visitor has no redemption history to check yet.
  function isPromoAlreadyRedeemed(cb){
    fetch('/api/coupons/mine', { credentials: 'include' })
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(coupons){
        var mine = Array.isArray(coupons) && coupons.find(function(c){ return c.code === PROMO_CODE; });
        cb(!!mine && mine.status === 'redeemed');
      })
      .catch(function(){ cb(false); });
  }

  function waitForGateThenShow(){
    if (localStorage.getItem(POPUP_KEY)) return;
    if (!document.body.classList.contains('gate-active')) {
      setTimeout(function(){
        if (localStorage.getItem(POPUP_KEY)) return;
        isPromoAlreadyRedeemed(function(alreadyRedeemed){
          if (localStorage.getItem(POPUP_KEY)) return;
          localStorage.setItem(POPUP_KEY, 'yes');
          if (alreadyRedeemed) return;
          document.getElementById('email-popup-overlay').classList.add('popup-active');
        });
      }, 3000);
    } else {
      setTimeout(waitForGateThenShow, 300);
    }
  }
  waitForGateThenShow();

  document.getElementById('email-popup-close').addEventListener('click', function(){
    document.getElementById('email-popup-overlay').classList.remove('popup-active');
  });
  document.getElementById('email-popup-skip').addEventListener('click', function(){
    document.getElementById('email-popup-overlay').classList.remove('popup-active');
  });

  document.getElementById('email-popup-submit').addEventListener('click', function(){
    var input = document.getElementById('email-popup-input');
    var errorDiv = document.getElementById('email-popup-error');
    var email = input.value.trim();
    if (!email || email.indexOf('@') === -1) {
      errorDiv.textContent = 'Please enter a valid email.';
      return;
    }
    errorDiv.textContent = '';
    fetch('/api/subscribe', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: email})
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      document.getElementById('email-popup-code').textContent = data.discountCode;
      document.getElementById('email-popup-step-form').style.display = 'none';
      document.getElementById('email-popup-step-success').style.display = 'block';
    })
    .catch(function(){
      errorDiv.textContent = 'Something went wrong. Please try again.';
    });
  });

  document.getElementById('email-popup-copy').addEventListener('click', function(){
    var code = document.getElementById('email-popup-code').textContent;
    navigator.clipboard.writeText(code);
    var btn = document.getElementById('email-popup-copy');
    var original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(function(){ btn.textContent = original; }, 1500);
  });
})();
</script>

</body>
