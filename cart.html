<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgewell — Shopping Cart</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.png">
<style>
@font-face { font-family:'Quicksand'; src:url('/fonts/quicksand-variable.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
:root{ --navy:#1B4B8C; --navy-dark:#123056; --green:#3FA34D; --gray:#6b6b6b; --bg:#FFFFFF; --panel:#F7F8F6; --line:#E4E4E0; }
*{box-sizing:border-box;}
body{ background:var(--bg); color:#1a1a1a; font-family:'Quicksand',sans-serif; font-weight:500; margin:0; }
a{color:inherit;}

/* ---- header (single-row, matches header.html) ---- */
header{
  display:flex; align-items:center; flex-wrap:nowrap; gap:18px;
  padding:12px 20px; max-width:1200px; margin:0 auto;
  position:sticky; top:0; z-index:10;
  background:#fff; border-bottom:1px solid var(--line);
}
.logo-mark{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.logo-word{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.2rem; color:var(--navy); white-space:nowrap; }
.logo-word .well{ color:var(--green); }
.header-nav-links{ display:flex; align-items:center; gap:22px; flex-shrink:0; margin-left:16px; }
.header-nav-link{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; color:var(--navy); text-decoration:none; white-space:nowrap; }
.header-nav-link:hover{ color:var(--green); }
.header-search-row{ position:relative; flex:0 1 240px; min-width:0; max-width:240px; margin-left:auto; }
.header-search-row input{ width:100%; box-sizing:border-box; min-width:0; padding:11px 16px 11px 40px; border-radius:6px; border:1.5px solid var(--line); background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6b6b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center/16px 16px; color:#333; font-size:0.95rem; font-family:'Quicksand',sans-serif; }
.header-search-row input:focus{ outline:none; border-color:var(--navy); }
.search-icon-btn{ position:absolute; top:50%; transform:translateY(-50%); padding:0; margin:0; border:none; background:transparent; cursor:pointer; }
.header-search-row .search-icon-btn{ left:14px; width:16px; height:16px; }
.menu-toggle{ display:flex; align-items:center; gap:22px; flex-shrink:0; position:relative; }
.hamburger{ display:none; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
.hamburger span{ display:block; width:22px; height:2.5px; background:var(--navy); border-radius:2px; }
.nav-overlay{ display:none; position:absolute; top:calc(100% + 12px); right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(18,48,86,0.16); z-index:9999; min-width:170px; padding:6px 0; }
.nav-overlay.open{ display:block; }
.nav-overlay-inner{ display:flex; flex-direction:column; }
.nav-overlay-inner a{ color:var(--navy-dark); font-size:0.9rem; font-weight:700; text-decoration:none; font-family:'Quicksand',sans-serif; padding:11px 18px; }
.nav-overlay-inner a:hover{ background:var(--panel); }
.cart-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; text-decoration:none; }
.cart-icon:hover{ color:var(--green); }
.cart-icon-inner{ display:flex; align-items:center; position:relative; }
.cart-count{ position:absolute; top:-2px; right:-4px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--navy); color:#fff; font-size:0.6rem; font-weight:700; line-height:15px; text-align:center; display:none; font-family:'Quicksand',sans-serif; box-sizing:border-box; }
.cart-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }
.login-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; }
.login-icon:hover{ color:var(--green); }
.login-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }

@media (max-width: 1150px){
  .header-nav-links{ display:none; }
  .hamburger{ display:flex; }
  header{ gap:10px; padding:10px 14px; }
  .header-search-row{ max-width:200px; }
  .logo-word{ font-size:0.95rem; }
  /* Icon-only for the whole hamburger-mode range, not just below 420px --
     "Cart" plus the login label was tight enough to visibly overlap the
     search box's icon in the 421-455px window specifically (measured
     directly), so the fix needs to cover that window too, not just the
     narrower phones the 420px tier already handled. */
  .cart-icon-label{ display:none; }
}
@media (max-width: 420px){
  header{ gap:6px; padding:8px 10px; }
  .header-search-row{ max-width:160px; }
  .header-search-row input{ padding:10px 12px 10px 34px; font-size:0.8rem; }
  .header-search-row .search-icon-btn{ left:11px; width:14px; height:14px; }
  .menu-toggle{ gap:10px; }
  .cart-icon svg{ width:18px; height:18px; }
  .cart-count{ font-size:0.55rem; min-width:13px; height:13px; line-height:13px; }
  .logo-word{ font-size:0.85rem; }
  .login-icon svg{ width:18px; height:18px; }
  /* header.html's <=1150px rule for this label (header .login-icon-label,
     specificity 0,1,1) would otherwise beat a plain .login-icon-label
     rule (0,1,0) here regardless of which one loads later -- confirmed
     as a real, pre-existing bug (the label was never actually hidden
     below 420px despite this rule) while testing the two-line mobile
     greeting. header .menu-toggle .login-icon-label (0,2,1) reliably
     outranks it instead, same specificity-engineering approach as
     header.html's own comments describe for its rules. */
  header .menu-toggle .login-icon-label{ display:none; }
}

/* ---- footer (matches shop.html) ---- */
footer.footer-main{margin-top:60px; padding:40px 20px 24px; background:var(--navy-dark); border-top:1px solid var(--line); font-family:'Quicksand',sans-serif;}
.footer-grid{max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:28px; margin-bottom:28px;}
.footer-col{ text-align:left; }
.footer-col h4{color:rgba(255,255,255,0.45); font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin:0 0 14px;}
.footer-col a{display:block; color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.85rem; margin-bottom:8px; overflow-wrap:break-word;}
.footer-col a:hover{ color:var(--green); }
.footer-col p{ color:rgba(255,255,255,0.6); font-size:0.82rem; line-height:1.6; margin:0 0 6px; overflow-wrap:break-word; }
.footer-social{display:flex; gap:10px;}
.footer-social a{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; margin:0;}
.footer-signup-input{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-family:'Quicksand',sans-serif;font-size:0.78rem;margin-bottom:8px;box-sizing:border-box;background:rgba(255,255,255,0.08);color:#fff;}
.footer-signup-input::placeholder{ color:rgba(255,255,255,0.4); }
.footer-signup-btn{width:100%;padding:9px;background:var(--green);color:#fff;border:none;border-radius:6px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:0.78rem;cursor:pointer;}
.footer-signup-btn:hover{ background:#358f41; }
.footer-signup-msg{font-size:0.75rem; margin-top:6px; color:var(--green);}
.footer-legal{max-width:1200px; margin:24px auto 0; font-size:0.7rem; color:rgba(255,255,255,0.5); line-height:1.5; border-top:1px solid rgba(255,255,255,0.15); padding-top:16px;}
.footer-legal a{ color:rgba(255,255,255,0.75); text-decoration:underline; }
.footer-legal a:hover{ color:#fff; }
.footer-info-row{ position:relative; display:flex; align-items:center; min-height:34px; max-width:1200px; margin:0 auto 20px; }
.footer-info-brand{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.footer-logo-mark{ flex-shrink:0; }
.footer-flag-icon{ flex-shrink:0; border-radius:2px; overflow:hidden; margin-left:16px; }
.footer-brand-name{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.8rem; white-space:nowrap; }
.footer-brand-name .forge{ color:#fff; }
.footer-brand-name .well{ color:var(--green); }
.footer-country-label{ font-size:0.72rem; color:rgba(255,255,255,0.6); white-space:nowrap; }
.footer-info-row .footer-catalog-search{ margin-left:auto; }
.footer-catalog-search{ max-width:220px; width:100%; position:relative; }
.footer-catalog-search .search-icon-btn{ left:10px; width:14px; height:14px; }
.footer-catalog-search input{ width:100%; box-sizing:border-box; padding:9px 10px 9px 32px; border-radius:6px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.05) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='0.6'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 10px center/14px 14px; color:#fff; font-size:0.8rem; }
.footer-catalog-search input::placeholder{ color:rgba(255,255,255,0.45); }
.footer-bottom{max-width:1200px; margin:16px auto 0; text-align:center;}
.footer-copyright{font-size:0.75rem; color:rgba(255,255,255,0.5); margin:0 0 12px;}
.footer-legal-links{display:flex; flex-wrap:wrap; justify-content:center; gap:14px;}
.footer-legal-links a{color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.75rem;}
.footer-legal-links a:hover{ color:#fff; text-decoration:underline; }
@media (max-width: 600px) {
  .footer-info-row{ flex-direction:column; align-items:center; gap:14px; min-height:0; }
  .footer-info-brand{ position:static; transform:none; }
  .footer-info-row .footer-catalog-search{ margin-left:0; }
}

.cart-page-wrap{ max-width:1200px; margin:32px auto 80px; padding:0 24px; }
.cart-page-wrap h1{ color:var(--navy-dark); font-size:1.6rem; margin-bottom:24px; }

.cart-empty-state{ text-align:center; padding:60px 24px; color:var(--gray); }
.cart-empty-state p{ font-size:1rem; margin-bottom:16px; }
.cart-empty-cta{ display:inline-block; padding:12px 28px; background:var(--navy); color:#fff; font-weight:700; font-size:0.85rem; border-radius:6px; text-decoration:none; }
.cart-empty-cta:hover{ background:var(--navy-dark); }

.cart-page-grid{ display:grid; grid-template-columns:1fr 340px; gap:32px; align-items:start; }

.cart-item-row{ display:grid; grid-template-columns:80px 1fr auto; gap:16px; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); }
.cart-item-img-link{ display:block; }
.cart-item-img{ width:80px; height:80px; object-fit:cover; border-radius:8px; background:var(--panel); border:1px solid var(--line); display:block; }
.cart-item-img-placeholder{ display:flex; }
.cart-item-info{ min-width:0; }
.cart-item-name{ display:block; color:var(--navy-dark); font-weight:700; font-size:0.95rem; text-decoration:none; margin-bottom:4px; overflow-wrap:break-word; }
.cart-item-name:hover{ color:var(--navy); text-decoration:underline; }
.cart-item-unit-price{ color:var(--gray); font-size:0.8rem; margin-bottom:10px; }
.cart-item-controls{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.qty-stepper{ display:flex; align-items:center; border:1.5px solid var(--line); border-radius:6px; overflow:hidden; }
.qty-stepper button{ width:32px; height:32px; background:#fff; border:none; cursor:pointer; font-size:1rem; color:var(--navy); font-family:'Quicksand',sans-serif; }
.qty-stepper button:hover{ background:var(--panel); }
.qty-stepper input{ width:38px; text-align:center; border:none; font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.85rem; }
.cart-remove-link{ background:none; border:none; color:#C0447A; font-size:0.8rem; cursor:pointer; padding:0; font-family:'Quicksand',sans-serif; text-decoration:underline; }
.cart-item-line-total{ font-weight:700; color:var(--navy-dark); font-size:0.95rem; white-space:nowrap; }

.cart-summary-card{ border:1px solid var(--line); border-radius:10px; padding:20px; background:var(--panel); position:sticky; top:90px; }
.cart-summary-line{ display:flex; justify-content:space-between; font-size:0.85rem; color:#444; margin-bottom:10px; }
.cart-summary-discount{ color:var(--green); font-weight:700; }
.cart-free-shipping-message{ font-size:0.78rem; font-weight:700; color:var(--navy-dark); background:#fff; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:0 0 12px; }
.cart-free-shipping-message.qualified{ color:var(--green); }
.cart-field-label{ display:block; font-size:0.72rem; font-weight:700; color:var(--navy-dark); text-transform:uppercase; letter-spacing:0.03em; margin:14px 0 4px; }
.cart-field-label:first-child{ margin-top:0; }
.cart-coupon-row{ display:flex; gap:8px; margin:0 0 6px; }
.cart-coupon-row button{ padding:9px 14px; background:#fff; border:1.5px solid var(--navy); color:var(--navy); border-radius:6px; font-weight:700; font-size:0.8rem; cursor:pointer; font-family:'Quicksand',sans-serif; }
.cart-coupon-row button:hover{ background:var(--navy); color:#fff; }
/* Custom combobox -- a plain <input list>/<datalist> renders its
   suggestion popup entirely via the browser/OS (unstyled, platform-native
   look), so this is hand-built instead: a normal text input plus a
   JS-driven dropdown panel, styled to match the site's other dropdown
   panels (see header.html's #account-dropdown -- same white/border/
   border-radius/box-shadow combo). */
.cart-coupon-combo{ position:relative; flex:1; min-width:0; }
.cart-coupon-combo input{ width:100%; box-sizing:border-box; padding:9px 30px 9px 10px; border:1px solid var(--line); border-radius:6px; font-family:'Quicksand',sans-serif; font-size:0.82rem; background:#fff; color:#333; }
.cart-coupon-combo input:focus{ outline:none; border-color:var(--navy); }
/* Hidden unless there are coupons to pick from (see loadCoupons()) --
   same chevron glyph as header.html's .account-menu-arrow, so this reads
   as the same "dropdown available" affordance used elsewhere on the site.
   A plain text field with nothing to select from just stays a plain text
   field, with no dead arrow implying otherwise. */
/* Selectors below are scoped as .cart-coupon-combo .cart-coupon-arrow-btn
   (two classes), not just .cart-coupon-arrow-btn alone -- needed to
   out-specificity .cart-coupon-row button above, which would otherwise
   also match this button (it's a <button> nested inside .cart-coupon-row)
   and paint it with the Apply button's white/bordered/padded look,
   hiding the chevron inside an oversized box. */
.cart-coupon-combo .cart-coupon-arrow-btn{
  display:none; position:absolute; right:4px; top:50%; transform:translateY(-50%);
  width:22px; height:22px; align-items:center; justify-content:center;
  padding:0; background:none; border:none; outline:none; color:var(--gray); cursor:pointer;
  -webkit-appearance:none; appearance:none;
}
.cart-coupon-combo .cart-coupon-arrow-btn.show{ display:flex; }
/* background/border repeated here, not just in the base rule above --
   .cart-coupon-row button:hover (the Apply button's own hover style)
   also matches this element and sets a navy background; CSS cascades
   per-property, so a higher-specificity rule that's silent on
   background does not block that property specifically, only color. */
.cart-coupon-combo .cart-coupon-arrow-btn:hover{ color:var(--navy); background:none; border:none; }
.cart-coupon-dropdown{
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0;
  background:#fff; border:1px solid var(--line); border-radius:10px;
  box-shadow:0 8px 24px rgba(18,48,86,0.16); z-index:20;
  max-height:220px; overflow-y:auto; padding:6px 0;
}
.cart-coupon-dropdown.open{ display:block; }
.cart-coupon-option{ padding:9px 14px; font-size:0.82rem; font-weight:700; color:var(--navy-dark); font-family:'Quicksand',sans-serif; cursor:pointer; }
.cart-coupon-option:hover, .cart-coupon-option.active{ background:var(--panel); }
.cart-coupon-option-empty{ padding:9px 14px; font-size:0.78rem; font-weight:500; color:var(--gray); font-family:'Quicksand',sans-serif; }
.cart-promo-msg{ font-size:0.72rem; color:var(--gray); min-height:14px; margin:6px 0 10px; }
.cart-promo-msg.error{ color:#c0392b; }
.cart-total-row{ display:flex; justify-content:space-between; font-weight:700; font-size:1.05rem; color:var(--navy-dark); padding-top:14px; border-top:1px solid var(--line); margin-top:4px; margin-bottom:16px; }
.cart-checkout-btn{ width:100%; padding:14px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-weight:700; font-size:0.95rem; cursor:pointer; font-family:'Quicksand',sans-serif; }
.cart-checkout-btn:hover{ background:var(--navy-dark); }
.cart-continue-shopping-link{ display:block; text-align:center; margin-top:14px; color:var(--navy); font-size:0.8rem; text-decoration:none; }
.cart-continue-shopping-link:hover{ text-decoration:underline; }

@media (max-width:800px){
  .cart-page-grid{ grid-template-columns:1fr; }
  .cart-summary-card{ position:static; }
}
@media (max-width:600px){
  .cart-page-wrap{ margin:20px auto 60px; padding:0 16px; }
  .cart-item-row{ grid-template-columns:64px 1fr auto; gap:10px; }
  .cart-item-img{ width:64px; height:64px; }
  .cart-item-name{ font-size:0.88rem; }
  .cart-item-line-total{ font-size:0.85rem; }
}
</style>

</head>
<body>

<div id="header-placeholder"></div>




<div class="cart-page-wrap">
  <h1>Shopping Cart</h1>

  <div id="cart-page-empty" class="cart-empty-state" style="display:none;">
    <p>Your cart is empty.</p>
    <a href="/shop.html" class="cart-empty-cta">Continue Shopping</a>
  </div>

  <div id="cart-page-content" class="cart-page-grid" style="display:none;">
    <div class="cart-items-col">
      <div id="cart-items-list"></div>
    </div>
    <div class="cart-summary-col">
      <div class="cart-summary-card">
        <div id="cart-summary-lines"></div>
        <div class="cart-coupon-block">
          <label class="cart-field-label" for="cart-coupon-input">Coupon Code</label>
          <div class="cart-coupon-row">
            <div class="cart-coupon-combo" id="cart-coupon-combo">
              <input type="text" id="cart-coupon-input" placeholder="Enter a coupon code" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="cart-coupon-dropdown">
              <button type="button" id="cart-coupon-arrow-btn" class="cart-coupon-arrow-btn" tabindex="-1" aria-label="Show available coupons" aria-hidden="true">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="cart-coupon-dropdown" id="cart-coupon-dropdown" role="listbox"></div>
            </div>
            <button type="button" id="cart-coupon-apply-btn">Apply</button>
          </div>
        </div>
        <div id="cart-promo-msg" class="cart-promo-msg"></div>
        <p class="cart-free-shipping-message" id="cart-free-shipping-message" style="display:none;"></p>
        <div class="cart-total-row">
          <span>Order Total</span>
          <span id="cart-page-total">$0.00</span>
        </div>
        <button type="button" id="cart-checkout-btn" class="cart-checkout-btn">Proceed to Checkout</button>
        <a href="/shop.html" class="cart-continue-shopping-link">&larr; Continue Shopping</a>
      </div>
    </div>
  </div>
</div>


<div id="footer-placeholder"></div>

<script>
let allProducts = [];
let cart = JSON.parse(localStorage.getItem('forgewell_cart') || '[]');
// Populated by loadCoupons() below (signed-in customers only) -- empty
// until then, so renderCartPage() just shows no coupon-savings line yet.
let availableCoupons = [];
// True once /api/coupons/mine has actually resolved successfully (a real
// signed-in session, whether or not they have any coupons) -- stays false
// for a signed-out guest (401) or before the fetch resolves. Lets
// renderCartPage() tell "this code is genuinely invalid" (we have the
// full list and it's not in it) apart from "we simply don't know."
let couponsKnown = false;
// Populated by loadFreeShippingThreshold() below -- null (message stays
// hidden) until that fetch resolves, same "unknown state stays quiet"
// pattern as couponsKnown above.
let freeShippingThreshold = null;

async function catalogSearchJump(query) {
  query = query.trim().toLowerCase();
  if (!query) return;
  await productsReady;
  const match = allProducts.find(p => {
    const base = (p.name || '').replace(/\s*\(?\d+(\.\d+)?\s?(mg|mcg|iu|ml)\)?\s*$/i, '').trim().toLowerCase();
    return base === query || base.indexOf(query) !== -1;
  });
  if (match) {
    window.location.href = '/product.html?id=' + encodeURIComponent(match.id);
  } else {
    window.location.href = '/shop.html#tabs';
  }
}

// Wires up all header/footer interactivity. Runs only after header.html and
// footer.html have been fetched and injected below -- their elements don't
// exist in the DOM before then.
// Updates the header's account icon for a signed-in customer -- shows
// "Hi, [name]" linking to order history, wires the Account/Sign Out
// dropdown and hamburger "Log Out" link. Declared at top level (not
// nested inside wireHeaderFooter()) so checkLoginStatus() below can call
// it both on page load and again from the pageshow/persisted handler
// further down this script, without re-running wireHeaderFooter()'s own
// hamburger/search wiring a second time (which would double-bind those
// listeners on a bfcache restore).
function updateAccountIcon(customer) {
  var loginIcon = document.getElementById('account-icon');
  if (!loginIcon || !customer) return;

  loginIcon.href = '/account.html#orders';
  loginIcon.title = 'My Account (' + customer.email + ')';
  // Name wasn't always required at signup -- older accounts can still have
  // a null name, so fall back to the email's local-part rather than
  // showing a blank/broken greeting.
  var displayName = customer.name || customer.email.split('@')[0];
  var labelEl = loginIcon.querySelector('.login-icon-label');
  // Literal newline (not just a leading space) -- on mobile, header.html's
  // white-space:pre-line rule for this label breaks on it to show "Hi,"
  // and the name on two lines; on desktop the plain white-space:nowrap
  // rule collapses it back to a single space, so "Hi, <name>" still reads
  // as one line there.
  if (labelEl) labelEl.textContent = 'Hi,\n' + displayName;

  function doLogout() {
    fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
      .then(function() { window.location.href = '/shop.html'; });
  }

  // Reveals the arrow and enables the Account/Sign Out dropdown (see
  // #account-menu-wrap's CSS in header.html) -- replaces the old
  // standalone icon-only sign-out button.
  var accountMenuWrap = document.getElementById('account-menu-wrap');
  if (accountMenuWrap) accountMenuWrap.classList.add('signed-in');
  var signOutItem = document.getElementById('account-dropdown-signout');
  if (signOutItem) {
    // Can now run more than once per page (once on load, again on a
    // bfcache pageshow restore -- see the pageshow listener further down
    // this script) -- guard against binding the click handler twice,
    // which would fire doLogout() twice per click.
    if (!signOutItem.dataset.wired) {
      signOutItem.dataset.wired = 'true';
      signOutItem.addEventListener('click', function(e) {
        e.preventDefault();
        doLogout();
      });
    }
  }

  var navInner = document.querySelector('.nav-overlay-inner');
  if (navInner && !document.getElementById('nav-logout-link')) {
    var logoutLink = document.createElement('a');
    logoutLink.href = '#';
    logoutLink.id = 'nav-logout-link';
    logoutLink.textContent = 'Log Out';
    logoutLink.addEventListener('click', function(e) {
      e.preventDefault();
      doLogout();
    });
    navInner.appendChild(logoutLink);
  }
}

// Fetches session state and updates the header's account icon
// accordingly -- called once from wireHeaderFooter() on normal page
// load, and again from the pageshow/persisted handler further down this
// script so a bfcache-restored page (browser Back/Forward landing on a
// frozen, previously-rendered copy of this page, without re-running any
// script) doesn't keep showing whatever login state happened to be
// frozen in.
function checkLoginStatus() {
  var loginIcon = document.getElementById('account-icon');
  if (!loginIcon) return;
  fetch('/api/auth/me', { credentials: 'include' })
    .then(function(res) { return res.ok ? res.json() : null; })
    .then(function(customer) { if (customer) updateAccountIcon(customer); })
    .catch(function() { /* not logged in or request failed -- leave icon pointing to /login.html */ });
}

function wireHeaderFooter() {
  var footerSearchInput = document.getElementById('footer-catalog-search-input');
  if (footerSearchInput) {
    footerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var footerSearchIconBtn = document.getElementById('footer-search-icon-btn');
  if (footerSearchIconBtn && footerSearchInput) {
    footerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var headerSearchInput = document.getElementById('header-catalog-search-input');
  if (headerSearchInput) {
    headerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(headerSearchInput.value);
    });
  }
  var headerSearchIconBtn = document.getElementById('header-search-icon-btn');
  if (headerSearchIconBtn && headerSearchInput) {
    headerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(headerSearchInput.value);
    });
  }

  var hamBtn = document.getElementById('hamburger-btn');
  var overlay = document.getElementById('nav-overlay');
  if (hamBtn && overlay) {
    hamBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.toggle('open');
    });
  }
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target.closest('a')) overlay.classList.remove('open');
    });
    document.addEventListener('click', function(e) {
      if (overlay.classList.contains('open') && !overlay.contains(e.target)) {
        overlay.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') overlay.classList.remove('open');
    });
  }

  // Amazon-style Account/Sign Out dropdown under the account name (see
  // #account-menu-wrap's CSS in header.html -- hover alone already shows it
  // via pure CSS there; this wires click-to-toggle plus close-on-outside-
  // click/Escape, same pattern as the hamburger/#nav-overlay above). Wired
  // unconditionally (not inside the signed-in check below) so the listener
  // exists regardless of session state, but it only intercepts the click
  // once #account-menu-wrap carries .signed-in -- a guest's click still
  // falls through to the plain /login.html link exactly as before.
  var accountMenuWrap = document.getElementById('account-menu-wrap');
  if (accountMenuWrap) {
    document.getElementById('account-icon').addEventListener('click', function(e) {
      if (!accountMenuWrap.classList.contains('signed-in')) return;
      e.preventDefault();
      accountMenuWrap.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (accountMenuWrap.classList.contains('open') && !accountMenuWrap.contains(e.target)) {
        accountMenuWrap.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') accountMenuWrap.classList.remove('open');
    });
  }

  // Checks whether the person is logged in and updates the header's account
  // icon accordingly -- shows "Hi, [name]" linking to order history if
  // logged in, "Sign In" linking to the login/signup page otherwise. Runs
  // on every page that shares this header.
  checkLoginStatus();

  var signupBtn = document.getElementById('footer-signup-btn');
  if (signupBtn) {
    signupBtn.addEventListener('click', async () => {
      const input = document.getElementById('footer-email-input');
      const msg = document.getElementById('footer-signup-msg');
      const email = input.value.trim();
      if (!email || email.indexOf('@') === -1) {
        msg.style.color = '#c0392b';
        msg.textContent = 'Please enter a valid email.';
        return;
      }
      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email: email})
        });
        const data = await res.json();
        msg.style.color = '#3FA34D';
        msg.textContent = data.alreadySubscribed
          ? 'Already signed up — code: ' + data.discountCode
          : 'Success! Your code: ' + data.discountCode;
        input.value = '';
      } catch (err) {
        msg.style.color = '#c0392b';
        msg.textContent = 'Something went wrong. Please try again.';
      }
    });
  }

  // Company contact info (phone/hours/address) is admin-editable (see
  // admin.html's Content > Contact Info tab) rather than hardcoded in
  // footer.html -- same site_content-backed pattern as the canonical
  // disclaimer, just targeting the footer fragment instead of the page's
  // own markup, so this has to run from inside wireHeaderFooter() once
  // footer.html actually exists in the DOM. company_address here is the
  // same value the Email Campaign feature uses as the physical mailing
  // address in its outgoing email (routes/admin.js's POST
  // /campaigns/coupon/send) -- one source of truth, edited in one place.
  fetch('/api/content/company-info').then(function(r) { return r.json(); })
    .then(function(d) {
      var phoneEl = document.getElementById('footer-contact-phone');
      var hoursEl = document.getElementById('footer-contact-hours');
      var addressEl = document.getElementById('footer-contact-address');
      // Phone is the one line of the three that's allowed to be unset
      // (PUT /api/admin/content/company-phone, backend repo, no longer
      // rejects an empty save) -- hidden entirely rather than showing a
      // literal "[Phone Number]" placeholder when nobody's filled it in
      // yet. Hours/address are unchanged -- always required at save time,
      // so they always have something real to show.
      if (phoneEl) {
        if (d.phone) { phoneEl.textContent = d.phone; phoneEl.style.display = ''; }
        else { phoneEl.style.display = 'none'; }
      }
      if (hoursEl && d.businessHours) hoursEl.textContent = d.businessHours;
      if (addressEl && d.address) addressEl.textContent = d.address;
    })
    .catch(function() {});

  // Social links (Instagram/X/Facebook) -- same admin-editable,
  // hide-if-unset pattern as the phone line just above, but per-icon
  // rather than all-or-nothing: filling in just one of the three shows
  // only that one. Each <a> starts with display:none in footer.html
  // itself so there's no flash of a dead "#" link before this resolves.
  fetch('/api/content/social-links').then(function(r) { return r.json(); })
    .then(function(d) {
      var links = [['footer-social-instagram', d.instagram], ['footer-social-x', d.x], ['footer-social-facebook', d.facebook]];
      var anySet = false;
      links.forEach(function(pair) {
        var el = document.getElementById(pair[0]);
        if (!el) return;
        if (pair[1]) { el.href = pair[1]; el.style.display = ''; anySet = true; }
        else { el.style.display = 'none'; }
      });
      // Whole section (heading + icon row) hides together when nothing's
      // set, not just the individual icons -- otherwise a store with no
      // social links configured yet shows a bare "Follow Us" heading over
      // an empty row.
      var sectionEl = document.getElementById('footer-social-section');
      if (sectionEl) sectionEl.style.display = anySet ? '' : 'none';
    })
    .catch(function() {});

  // Restores the header's cart count from localStorage now that the header
  // actually exists in the DOM (it didn't yet when updateCartIcon() first
  // ran further down this script).
  updateCartIcon();
}

Promise.all([
  fetch('/header.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('header-placeholder').innerHTML = html;
  }),
  fetch('/footer.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('footer-placeholder').innerHTML = html;
  })
]).then(wireHeaderFooter).catch(function(err) {
  console.error('Failed to load shared header/footer', err);
});

// Refreshes login status AND cart contents on a bfcache restore (browser
// Back/Forward landing on a frozen, previously-rendered copy of this
// page without re-running any script) -- CONFIRMED LIVE BUG, now fixed:
// without this, a customer who completed a purchase (clearing
// forgewell_cart) after this exact cart.html was frozen into bfcache
// would see the stale, pre-purchase cart contents indefinitely, even
// though localStorage itself is already correctly empty. Re-reads
// forgewell_cart fresh rather than trusting whatever `cart` held at
// freeze time. Only checkLoginStatus() re-runs for the header, not
// wireHeaderFooter() itself, since re-running that wholesale would
// double-bind the hamburger/search click listeners it also sets up.
window.addEventListener('pageshow', function(e) {
  if (e.persisted) {
    checkLoginStatus();
    cart = JSON.parse(localStorage.getItem('forgewell_cart') || '[]');
    renderCartPage();
  }
});

// Only used here to look up each cart item's image_path for display --
// cart.html has no product cards, so there's no card-population step
// like the other pages' loadProducts() has.
async function loadProducts() {
  try {
    const res = await fetch('/api/products');
    allProducts = await res.json();
  } catch (err) {
    console.error('Failed to load products from backend:', err);
  }
  renderCartPage();
}

// Paths come from the product DB as "images/foo.png", relative to site
// root -- same normalization used on product.html/shop.html/home.html.
function resolveImagePath(path) {
  if (!path) return null;
  if (path.indexOf('http') === 0) return path;
  // Actual files are served as WebP (much smaller); the DB only ever knows
  // about the .png name, so the swap happens here rather than at the source.
  path = path.replace(/\.png$/i, '.webp');
  if (path.indexOf('/') === 0) return path;
  return '/' + path;
}

// A kit created without its own image falls back to its backing vial's
// image -- same base_product_id + dosage matching rule product.html's
// findBackingVial() uses (duplicated here per this codebase's no-shared-
// JS convention).
function resolveKitImagePath(p) {
  const direct = resolveImagePath(p.image_path);
  if (direct) return direct;
  if (p.category !== 'kit' || !p.base_product_id) return null;
  const base = p.base_product_id;
  const vial = allProducts.find(v => v.category !== 'kit' && (v.id === base || v.id.indexOf(base + '-') === 0) && v.dosage === p.dosage);
  return vial ? resolveImagePath(vial.image_path) : null;
}

function saveCart() {
  localStorage.setItem('forgewell_cart', JSON.stringify(cart));
  updateCartIcon();
  syncCartToServer();
}

// Best-effort mirror of the cart to the server, for the abandoned-cart
// reminder job (lib/jobs.js, backend repo) to poll -- NOT the source of
// truth for rendering the cart anywhere, localStorage still is.
// Fire-and-forget: a signed-out visitor's call here just 401s and is
// silently ignored, same "let the server enforce auth, client no-ops on
// failure" pattern used elsewhere in this codebase -- cheaper than
// checking sign-in state client-side first, and no worse than one extra
// small request per cart action.
function syncCartToServer() {
  fetch('/api/cart/mine', {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ items: cart }),
  }).catch(function() {});
}

function updateCartIcon() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById('cart-count');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }
}

function removeFromCart(productId) {
  cart = cart.filter(i => i.productId !== productId);
  saveCart();
  renderCartPage();
}

function updateCartQty(productId, newQty) {
  const item = cart.find(i => i.productId === productId);
  if (!item) return;
  item.qty = Math.max(1, newQty);
  saveCart();
  renderCartPage();
}

// Mirrors the exact same rule as the backend (routes/checkout.js):
// flat 10% off, either buy 3+ of one item OR spend $300+ total —
// whichever gives the bigger discount, never both stacked. This is
// just a live preview for the customer; the backend recalculates the
// real charge from scratch at checkout time, so this can't be gamed.
const BULK_QTY_THRESHOLD = 3;
const BULK_QTY_DISCOUNT = 0.10;
const CART_TOTAL_THRESHOLD = 300;
const CART_TOTAL_DISCOUNT = 0.10;

function calculateCartDiscount(cartItems) {
  let rawTotal = 0;
  let perItemTotal = 0;
  cartItems.forEach(item => {
    const lineTotal = item.price * item.qty;
    rawTotal += lineTotal;
    perItemTotal += item.qty >= BULK_QTY_THRESHOLD
      ? lineTotal * (1 - BULK_QTY_DISCOUNT)
      : lineTotal;
  });
  const cartWideTotal = rawTotal >= CART_TOTAL_THRESHOLD
    ? rawTotal * (1 - CART_TOTAL_DISCOUNT)
    : rawTotal;
  const finalTotal = Math.min(perItemTotal, cartWideTotal, rawTotal);
  return {
    subtotal: rawTotal,
    total: finalTotal,
    discountApplied: finalTotal < rawTotal,
    savings: rawTotal - finalTotal,
  };
}

function couponDiscountedTotal(rawTotal, coupon) {
  if (coupon.discountType === 'fixed') {
    return Math.max(0, rawTotal - Number(coupon.discountValue));
  }
  return rawTotal * (1 - Number(coupon.discountValue) / 100);
}

// Mirrors routes/checkout.js's applyBulkDiscount(): the coupon only ever
// "wins" (and only ever gets shown/charged as the applied discount) if it
// beats the bulk discount above -- bulk and coupon never stack. This is
// what lets the cart page show the customer's actual coupon savings
// instead of just silently folding it into the total.
function calculateCartTotals(cartItems, coupon) {
  const { subtotal, total: bulkTotal, discountApplied: bulkDiscountApplied, savings: bulkSavings } = calculateCartDiscount(cartItems);
  let finalTotal = bulkTotal;
  let couponWon = false;
  let couponSavings = 0;
  // free_shipping coupons have no real discountValue and never affect
  // the subtotal -- their entire effect is on shipping, computed only on
  // checkout.html (cart.html doesn't calculate shipping at all). Same
  // split as routes/checkout.js's applyBulkDiscount(), which this
  // function mirrors.
  if (coupon && coupon.discountType !== 'free_shipping') {
    const couponTotal = couponDiscountedTotal(subtotal, coupon);
    if (couponTotal < finalTotal) {
      finalTotal = couponTotal;
      couponWon = true;
      couponSavings = subtotal - couponTotal;
    }
  }
  finalTotal = Math.round(finalTotal * 100) / 100;
  return {
    subtotal,
    total: finalTotal,
    discountApplied: finalTotal < subtotal,
    couponWon,
    couponSavings: Math.round(couponSavings * 100) / 100,
    bulkDiscountApplied,
    bulkSavings,
  };
}

function renderCartPage() {
  const emptyState = document.getElementById('cart-page-empty');
  const content = document.getElementById('cart-page-content');

  if (cart.length === 0) {
    emptyState.style.display = 'block';
    content.style.display = 'none';
    return;
  }
  emptyState.style.display = 'none';
  content.style.display = 'grid';

  const list = document.getElementById('cart-items-list');
  list.innerHTML = '';
  cart.forEach(item => {
    const product = allProducts.find(p => p.id === item.productId);
    const imgUrl = product ? resolveKitImagePath(product) : null;
    const lineTotal = item.price * item.qty;
    const productLink = '/product.html?id=' + encodeURIComponent(item.productId);

    const row = document.createElement('div');
    row.className = 'cart-item-row';
    row.innerHTML =
      '<a href="' + productLink + '" class="cart-item-img-link">' +
        (imgUrl
          ? '<img src="' + imgUrl + '" alt="' + item.name + '" class="cart-item-img">'
          : '<div class="cart-item-img cart-item-img-placeholder"></div>') +
      '</a>' +
      '<div class="cart-item-info">' +
        '<a href="' + productLink + '" class="cart-item-name">' + item.name + '</a>' +
        '<div class="cart-item-unit-price">$' + item.price.toFixed(2) + ' each</div>' +
        '<div class="cart-item-controls">' +
          '<div class="qty-stepper">' +
            '<button type="button" class="cart-qty-minus" data-product-id="' + item.productId + '">-</button>' +
            '<input type="text" class="cart-qty-input" value="' + item.qty + '" readonly>' +
            '<button type="button" class="cart-qty-plus" data-product-id="' + item.productId + '">+</button>' +
          '</div>' +
          '<button type="button" class="cart-remove-link" data-product-id="' + item.productId + '">Remove</button>' +
        '</div>' +
      '</div>' +
      '<div class="cart-item-line-total">$' + lineTotal.toFixed(2) + '</div>';
    list.appendChild(row);
  });

  // Shipping is intentionally not shown or calculated here anymore -- it
  // depends on the shipping address, which isn't collected until
  // checkout.html, and used to just be a client-side guess here that had
  // no way to confirm it matched the real backend rate. checkout.html is
  // now the only place shipping is shown.
  const appliedCode = localStorage.getItem('forgewell_promo_code');
  const matchedCoupon = appliedCode
    ? availableCoupons.find(function(c) { return c.code.toUpperCase() === appliedCode.trim().toUpperCase(); })
    : null;
  const { subtotal, total, couponWon, couponSavings, bulkDiscountApplied, bulkSavings } = calculateCartTotals(cart, matchedCoupon);

  const itemCount = cart.reduce((sum, i) => sum + i.qty, 0);
  let html = '<div class="cart-summary-line"><span>Subtotal (' + itemCount + ' item' + (itemCount === 1 ? '' : 's') + ')</span><span>$' + subtotal.toFixed(2) + '</span></div>';
  if (couponWon) {
    html += '<div class="cart-summary-line cart-summary-discount"><span>Coupon ' + matchedCoupon.code + ' applied</span><span>-$' + couponSavings.toFixed(2) + '</span></div>';
  } else if (bulkDiscountApplied) {
    html += '<div class="cart-summary-line cart-summary-discount"><span>Discount</span><span>-$' + bulkSavings.toFixed(2) + '</span></div>';
  }
  document.getElementById('cart-summary-lines').innerHTML = html;
  document.getElementById('cart-page-total').textContent = '$' + total.toFixed(2);

  // Subtotal-only eligibility nudge for the (admin-configurable)
  // free-shipping threshold -- see lib/orderPricing.js's
  // getFreeShippingThreshold() (backend repo). Deliberately compared
  // against `total` (post-bulk/coupon-discount) rather than the raw
  // subtotal above, matching exactly what routes/checkout.js itself
  // compares the threshold against at charge time (its own `total`
  // there is applyBulkDiscount()'s output, not the raw subtotal) -- a
  // percent/fixed coupon or the bulk discount genuinely changes what a
  // customer needs to spend to clear this threshold, so comparing raw
  // subtotal here would disagree with the real backend eligibility
  // check. Unlike checkout.html's own free-shipping message (driven by
  // a real POST /api/shipping/rates response, since that page also has
  // to reconcile this against an actual per-address carrier quote),
  // this is address-independent by design -- cart.html never collects
  // one (see the shipping comment above) -- so it's worded as a
  // subtotal-based eligibility indicator, not a confirmed shipping cost.
  const freeShipEl = document.getElementById('cart-free-shipping-message');
  const isFreeShippingCoupon = matchedCoupon && matchedCoupon.discountType === 'free_shipping';
  if (isFreeShippingCoupon || freeShippingThreshold == null) {
    // Suppressed for a free_shipping coupon -- shipping is already
    // guaranteed free for that reason, so a subtotal-threshold nudge
    // alongside it would be redundant noise, not new information.
    // Also suppressed (unknown state stays quiet) until the threshold
    // fetch below has actually resolved.
    freeShipEl.style.display = 'none';
  } else if (total >= freeShippingThreshold) {
    freeShipEl.textContent = 'You qualify for free standard shipping, based on your order subtotal!';
    freeShipEl.className = 'cart-free-shipping-message qualified';
    freeShipEl.style.display = 'block';
  } else {
    const remaining = freeShippingThreshold - total;
    freeShipEl.textContent = 'Add $' + remaining.toFixed(2) + ' more to qualify for free standard shipping (based on subtotal).';
    freeShipEl.className = 'cart-free-shipping-message';
    freeShipEl.style.display = 'block';
  }

  // Centralized here (not in applyPromoCode()) so it stays correct across
  // any re-render, not just right after applying -- e.g. changing a qty
  // can flip whether the bulk discount or the coupon wins, and this needs
  // to reflect that without the customer re-applying anything.
  var msgEl = document.getElementById('cart-promo-msg');
  msgEl.classList.remove('error');
  if (!appliedCode || couponWon) {
    msgEl.textContent = '';
  } else if (matchedCoupon && matchedCoupon.discountType === 'free_shipping') {
    // couponWon is deliberately always false for this type (see
    // calculateCartTotals()'s own comment -- it never affects the
    // subtotal at all), so without this branch a valid free_shipping
    // coupon would fall into the "doesn't beat your current discount"
    // message below, which would be wrong -- it's not competing with
    // anything, it just has nothing to show on THIS page. Its actual
    // effect (zeroing standard shipping) only shows up on checkout.html,
    // once a shipping address exists to rate-shop against.
    msgEl.textContent = 'Coupon ' + matchedCoupon.code + ' applied -- free standard shipping will show at checkout.';
  } else if (matchedCoupon) {
    msgEl.textContent = "Coupon " + matchedCoupon.code + " doesn't beat your current discount, so it wasn't applied.";
  } else if (couponsKnown) {
    // /api/coupons/mine already returns every active, unused coupon in the
    // whole system for a signed-in customer -- so once that's actually
    // loaded, a typed code that isn't in it is genuinely invalid (or
    // already used by this email), not just "unverified." Previously this
    // showed "Code saved -- it'll be applied at checkout," which read as
    // a success message for what's actually a bad code -- bug fix.
    msgEl.textContent = 'Invalid coupon.';
    msgEl.classList.add('error');
  } else {
    // Signed out, or the coupons fetch hasn't resolved/failed -- there's
    // no way to tell if this code is real, so don't claim either way.
    msgEl.textContent = "We can't verify this code until checkout.";
  }
}

// Delegated so it keeps working after renderCartPage() rebuilds the item
// rows -- the qty/remove controls don't exist yet at script-parse time.
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('cart-qty-minus')) {
    const id = e.target.dataset.productId;
    const item = cart.find(i => i.productId === id);
    if (item) updateCartQty(id, item.qty - 1);
    return;
  }
  if (e.target.classList.contains('cart-qty-plus')) {
    const id = e.target.dataset.productId;
    const item = cart.find(i => i.productId === id);
    if (item) updateCartQty(id, item.qty + 1);
    return;
  }
  if (e.target.classList.contains('cart-remove-link')) {
    removeFromCart(e.target.dataset.productId);
    return;
  }
});

function couponOptionLabel(c) {
  var amount = c.discountType === 'free_shipping'
    ? 'Free standard shipping'
    : (c.discountType === 'percent'
      ? Number(c.discountValue) + '% off'
      : '$' + Number(c.discountValue).toFixed(2) + ' off');
  return c.code + ' — ' + amount;
}

// No address needed -- this is the same plain dollar-amount comparison
// product.html's freeShippingBadgeText() already reads this same
// endpoint for (see that page), just re-fetched here since cart.html
// and product.html don't share any JS. Not signed-in-gated -- the
// threshold applies to guest and signed-in checkouts alike.
function loadFreeShippingThreshold() {
  fetch('/api/content/free-shipping-threshold')
    .then(function(res) { return res.ok ? res.json() : null; })
    .then(function(data) {
      if (data && typeof data.threshold === 'number') {
        freeShippingThreshold = data.threshold;
        renderCartPage();
      }
    })
    .catch(function() {});
}

// NEW endpoint -- see the backend handoff spec. Only 'available' coupons
// are offered (already-redeemed/expired/inactive ones are excluded
// server-side). 401s for a signed-out visitor -- caught below, leaving
// availableCoupons empty and couponsKnown false, same as a signed-in
// customer with zero coupons except renderCartPage()'s invalid-coupon
// messaging treats the two differently -- see its own comment.
function loadCoupons() {
  fetch('/api/coupons/mine', { credentials: 'include' })
    .then(function(res) {
      couponsKnown = res.ok;
      return res.ok ? res.json() : [];
    })
    .then(function(coupons) {
      availableCoupons = (Array.isArray(coupons) ? coupons : []).filter(function(c) { return c.status === 'available'; });
      // The dropdown arrow (and the "or select" wording) only make sense
      // when there's actually something to pick from -- a guest, or a
      // signed-in customer with zero available coupons, just gets a plain
      // text field with nothing implying otherwise.
      var hasCoupons = availableCoupons.length > 0;
      couponArrowBtn.classList.toggle('show', hasCoupons);
      couponArrowBtn.setAttribute('aria-hidden', hasCoupons ? 'false' : 'true');
      couponInput.placeholder = hasCoupons ? 'Enter or select a coupon code' : 'Enter a coupon code';
      renderCartPage();
    })
    .catch(function() {});
}

// One combined field: typing and picking from a dropdown both land in the
// same input, but nothing is applied until the separate Apply button next
// to it is clicked -- no auto-apply on selection, typing, or Enter. Only
// one coupon is ever active at a time (forgewell_promo_code is a single
// value, not a list), so clicking Apply with a new code always just
// replaces whatever was there; clicking it with the field emptied removes
// the current coupon entirely.
//
// The dropdown itself is hand-built (a plain <input list>/<datalist>
// renders its suggestion popup entirely via the browser/OS -- unstyled,
// platform-native look, not matching the site's other dropdowns) rather
// than relying on native browser autocomplete UI.
var couponInput = document.getElementById('cart-coupon-input');
var couponDropdown = document.getElementById('cart-coupon-dropdown');
var couponArrowBtn = document.getElementById('cart-coupon-arrow-btn');
var savedPromoCode = localStorage.getItem('forgewell_promo_code');
if (savedPromoCode) couponInput.value = savedPromoCode;

var couponDropdownActiveIndex = -1;
var couponDropdownVisibleCoupons = [];

function closeCouponDropdown() {
  couponDropdown.classList.remove('open');
  couponInput.setAttribute('aria-expanded', 'false');
  couponDropdownActiveIndex = -1;
}

// filterText is matched against the code (case-insensitive, substring) --
// same forgiving match the manual-entry field itself already tolerates.
function openCouponDropdown(filterText) {
  var query = (filterText || '').trim().toUpperCase();
  couponDropdownVisibleCoupons = query
    ? availableCoupons.filter(function(c) { return c.code.toUpperCase().indexOf(query) !== -1; })
    : availableCoupons.slice();

  if (couponDropdownVisibleCoupons.length === 0) {
    couponDropdown.innerHTML = '<div class="cart-coupon-option-empty">No matching coupons</div>';
  } else {
    couponDropdown.innerHTML = couponDropdownVisibleCoupons.map(function(c, i) {
      return '<div class="cart-coupon-option" data-index="' + i + '" role="option">' + couponOptionLabel(c) + '</div>';
    }).join('');
  }
  couponDropdown.classList.add('open');
  couponInput.setAttribute('aria-expanded', 'true');
  couponDropdownActiveIndex = -1;
}

function setCouponDropdownActive(index) {
  var options = couponDropdown.querySelectorAll('.cart-coupon-option');
  options.forEach(function(el, i) { el.classList.toggle('active', i === index); });
  couponDropdownActiveIndex = index;
  var activeEl = options[index];
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

// Picking an option only populates the field (same as typing it by hand)
// -- it does not apply the coupon, matching the Apply-button-only rule
// above.
function selectCouponOption(index) {
  var coupon = couponDropdownVisibleCoupons[index];
  if (!coupon) return;
  couponInput.value = coupon.code;
  closeCouponDropdown();
}

// 'click' is needed alongside 'focus' -- clicking an input that's already
// focused (e.g. right after Enter/Escape closed the dropdown but left
// focus in the field) doesn't fire a new 'focus' event, so relying on
// 'focus' alone would leave the dropdown stuck closed in that case.
couponInput.addEventListener('focus', function() {
  if (availableCoupons.length > 0) openCouponDropdown(couponInput.value);
});
couponInput.addEventListener('click', function() {
  if (availableCoupons.length > 0 && !couponDropdown.classList.contains('open')) openCouponDropdown(couponInput.value);
});
couponInput.addEventListener('input', function() {
  if (availableCoupons.length > 0) openCouponDropdown(couponInput.value);
});
// The arrow button itself only ever shows once loadCoupons() confirms
// there's something to pick from, so no availableCoupons.length guard is
// needed here the way the listeners above need one. Always opens with
// the full list (not filtered by whatever's currently typed) -- clicking
// a dedicated "show everything" affordance shouldn't be at the mercy of
// stray text already in the field. Doesn't call couponInput.focus() --
// that would re-trigger the 'focus' listener above and re-filter by the
// current value, undoing the unfiltered list this just opened.
couponArrowBtn.addEventListener('click', function(e) {
  e.preventDefault();
  if (couponDropdown.classList.contains('open')) {
    closeCouponDropdown();
  } else {
    openCouponDropdown('');
  }
});
couponInput.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (!couponDropdown.classList.contains('open')) { openCouponDropdown(couponInput.value); }
    if (couponDropdownVisibleCoupons.length === 0) return;
    setCouponDropdownActive((couponDropdownActiveIndex + 1) % couponDropdownVisibleCoupons.length);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!couponDropdown.classList.contains('open')) { openCouponDropdown(couponInput.value); }
    if (couponDropdownVisibleCoupons.length === 0) return;
    setCouponDropdownActive((couponDropdownActiveIndex - 1 + couponDropdownVisibleCoupons.length) % couponDropdownVisibleCoupons.length);
  } else if (e.key === 'Enter') {
    // Selects the highlighted option into the field, same as a click --
    // it still doesn't apply the coupon. If nothing is highlighted, Enter
    // does nothing here (same as before this change -- only the Apply
    // button applies).
    if (couponDropdown.classList.contains('open') && couponDropdownActiveIndex >= 0) {
      e.preventDefault();
      selectCouponOption(couponDropdownActiveIndex);
    }
  } else if (e.key === 'Escape') {
    closeCouponDropdown();
  }
});
couponDropdown.addEventListener('click', function(e) {
  var option = e.target.closest('.cart-coupon-option');
  if (!option) return;
  selectCouponOption(Number(option.dataset.index));
});
document.addEventListener('click', function(e) {
  if (!couponDropdown.classList.contains('open')) return;
  if (!document.getElementById('cart-coupon-combo').contains(e.target)) closeCouponDropdown();
});

// #cart-promo-msg itself is set by renderCartPage(), not here, so it stays
// correct across any later re-render (e.g. a qty change flipping whether
// the bulk discount or the coupon wins), not just right after applying.
function applyPromoCode(code) {
  if (!code) {
    localStorage.removeItem('forgewell_promo_code');
    couponInput.value = '';
  } else {
    couponInput.value = code;
    localStorage.setItem('forgewell_promo_code', code);
  }
  renderCartPage();
}

document.getElementById('cart-coupon-apply-btn').addEventListener('click', function() {
  closeCouponDropdown();
  applyPromoCode(couponInput.value.trim());
});

document.getElementById('cart-checkout-btn').addEventListener('click', function() {
  if (cart.length === 0) return;
  window.location.href = '/checkout.html';
});

renderCartPage();
let productsReady = loadProducts();
loadCoupons();
loadFreeShippingThreshold();
updateCartIcon();



</script>

</style>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
</button>

  <div class="chat-widget-header">Chat with us</div>

      <input type="text" id="chat-widget-input" placeholder="Type a message..." autocomplete="off" />

    </div>
  </div>

      <textarea id="chat-widget-offline-message" placeholder="Type your message..."></textarea>

      <button type="button" id="chat-widget-offline-send-btn">Send</button>

<!-- Version-pinned to match the server's exact installed socket.io
     version -- same CDN tag/failure-handling convention as home.html
     (see that page's own comment for the full reasoning): plain
     synchronous <script src>, no async/defer, placed directly above the
     script that needs it; a failed load just means no `io` global,
     handled by the typeof guard in that script below. -->
<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

<script>
(function(){
  // Failed CDN load (network block, ad blocker, CDN outage) means no `io`
  // global -- bail out entirely so the rest of the page is completely
  // unaffected. The bubble button stays in the DOM but inert with no
  // listener attached.
  if (typeof io === 'undefined') return;

  var GUEST_ID_KEY = 'forgewell_chat_guest_id';
  function getOrCreateGuestId() {
    var id = localStorage.getItem(GUEST_ID_KEY);
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem(GUEST_ID_KEY, id);
    }
    return id;
  }

  // Server-side identity resolution (lib/chat.js) ignores this guestId
  // outright and uses the real forgewell_session cookie instead whenever
  // one is present and valid -- sent unconditionally here since the
  // client has no reliable way to know in advance which one will win.
  var socket = io({ auth: { guestId: getOrCreateGuestId() } });

  var panel = document.getElementById('chat-widget-panel');
  var bubble = document.getElementById('chat-widget-bubble');
  var messagesEl = document.getElementById('chat-widget-messages');
  var errorEl = document.getElementById('chat-widget-error');
  var input = document.getElementById('chat-widget-input');
  var sendBtn = document.getElementById('chat-widget-send-btn');
  var errorClearTimer = null;

  var liveEl = document.getElementById('chat-widget-live');
  var offlineEl = document.getElementById('chat-widget-offline');
  var offlineFormEl = document.getElementById('chat-widget-offline-form');
  var offlineConfirmationEl = document.getElementById('chat-widget-offline-confirmation');
  var offlineMessageInput = document.getElementById('chat-widget-offline-message');
  var offlineEmailInput = document.getElementById('chat-widget-offline-email');
  var offlineSendBtn = document.getElementById('chat-widget-offline-send-btn');

  // Undefined until the first chat:supportStatus arrives (sent right
  // after chat:init on every connection -- see lib/chat.js) -- mode isn't
  // decided until that's been heard at least once, so the opening moment
  // doesn't flash the wrong mode before it's actually known.
  var supportOnline;
  var hasConversationHistory = false;
  var widgetMode = 'live';

  function setLiveMode() {
    widgetMode = 'live';
    liveEl.style.display = 'flex';
    offlineEl.style.display = 'none';
  }

  function setOfflineFormMode() {
    widgetMode = 'offlineForm';
    liveEl.style.display = 'none';
    offlineEl.style.display = 'flex';
    offlineFormEl.style.display = 'flex';
    offlineConfirmationEl.style.display = 'none';
  }

  function setOfflineConfirmationMode() {
    widgetMode = 'offlineConfirmation';
    liveEl.style.display = 'none';
    offlineEl.style.display = 'flex';
    offlineFormEl.style.display = 'none';
    offlineConfirmationEl.style.display = 'block';
  }

  // Re-run on every chat:init (history) and chat:supportStatus (online
  // flag) change. The offline "leave a message" form is specifically for
  // a customer with no conversation history yet -- one who already has a
  // real back-and-forth keeps seeing that thread even if support just
  // went offline. Deliberately NOT called from the offline send handler
  // below: once that form's been submitted, the confirmation screen
  // stays up (not the live thread) until support is back online,
  // regardless of hasConversationHistory now being true from that send.
  function decideMode() {
    if (supportOnline === undefined) return;
    if (widgetMode === 'offlineConfirmation') {
      if (supportOnline) setLiveMode();
      return;
    }
    if (!supportOnline && !hasConversationHistory) {
      setOfflineFormMode();
    } else {
      setLiveMode();
    }
  }

  function sendOfflineMessage() {
    var body = offlineMessageInput.value;
    if (!body || !body.trim()) return;
    var email = offlineEmailInput.value && offlineEmailInput.value.trim();
    // chat:message only ever carries a body -- lib/chat.js's customer-side
    // handler has no email field to send it as, so a provided email is
    // folded into the message text itself rather than silently dropped.
    // Still just one plain chat:message emit, same event/shape as the
    // live send path below.
    socket.emit('chat:message', { body: email ? ('Email: ' + email + '\n\n' + body) : body });
    hasConversationHistory = true;
    offlineMessageInput.value = '';
    offlineEmailInput.value = '';
    setOfflineConfirmationMode();
  }

  offlineSendBtn.addEventListener('click', sendOfflineMessage);
  offlineMessageInput.addEventListener('keydown', function(e){
    // Enter submits, matching the live input's Enter-to-send -- Shift+Enter
    // allows a newline since this is a multi-line textarea, unlike the
    // live path's single-line <input> where Enter always means send.
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendOfflineMessage();
    }
  });

  bubble.addEventListener('click', function(){
    panel.classList.toggle('chat-widget-open');
  });

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendMessage(msg) {
    var div = document.createElement('div');
    div.className = 'chat-widget-msg chat-widget-msg-' + (msg.senderType === 'admin' ? 'admin' : 'customer');
    div.textContent = msg.body;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  socket.on('chat:init', function(data){
    messagesEl.innerHTML = '';
    (data.messages || []).forEach(appendMessage);
    hasConversationHistory = (data.messages || []).length > 0;
    decideMode();
  });

  socket.on('chat:supportStatus', function(data){
    supportOnline = !!(data && data.online);
    decideMode();
  });

  // Covers both the sender's own echoed message (delivery confirmation)
  // and, once Phase 3 exists, an admin's reply -- same event either way.
  socket.on('chat:message', function(msg){
    hasConversationHistory = true;
    appendMessage(msg);
  });

  socket.on('chat:error', function(data){
    clearTimeout(errorClearTimer);
    errorEl.textContent = (data && data.error) || 'Something went wrong.';
    errorClearTimer = setTimeout(function(){ errorEl.textContent = ''; }, 4000);
  });

  function sendMessage() {
    var body = input.value;
    if (!body || !body.trim()) return;
    socket.emit('chat:message', { body: body });
    input.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter') sendMessage();
  });
})();
</script>

</body>
