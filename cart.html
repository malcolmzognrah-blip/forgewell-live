<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgewell — Shopping Cart</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.png">
<style>
@font-face { font-family:'Quicksand'; src:url('/fonts/quicksand-variable.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
:root{ --navy:#1B4B8C; --navy-dark:#123056; --green:#3FA34D; --gray:#6b6b6b; --bg:#FFFFFF; --panel:#F7F8F6; --line:#E4E4E0; }
*{box-sizing:border-box;}
body{ background:var(--bg); color:#1a1a1a; font-family:'Quicksand',sans-serif; font-weight:500; margin:0; }
a{color:inherit;}

/* ---- header (single-row, matches header.html) ---- */
header{
  display:flex; align-items:center; flex-wrap:nowrap; gap:18px;
  padding:12px 20px; max-width:1200px; margin:0 auto;
  position:sticky; top:0; z-index:10;
  background:#fff; border-bottom:1px solid var(--line);
}
.logo-mark{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.logo-word{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.2rem; color:var(--navy); white-space:nowrap; }
.logo-word .well{ color:var(--green); }
.header-nav-links{ display:flex; align-items:center; gap:22px; flex-shrink:0; margin-left:16px; }
.header-nav-link{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; color:var(--navy); text-decoration:none; white-space:nowrap; }
.header-nav-link:hover{ color:var(--green); }
.header-search-row{ position:relative; flex:0 1 240px; min-width:0; max-width:240px; margin-left:auto; }
.header-search-row input{ width:100%; box-sizing:border-box; min-width:0; padding:11px 16px 11px 40px; border-radius:6px; border:1.5px solid var(--line); background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6b6b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center/16px 16px; color:#333; font-size:0.95rem; font-family:'Quicksand',sans-serif; }
.header-search-row input:focus{ outline:none; border-color:var(--navy); }
.search-icon-btn{ position:absolute; top:50%; transform:translateY(-50%); padding:0; margin:0; border:none; background:transparent; cursor:pointer; }
.header-search-row .search-icon-btn{ left:14px; width:16px; height:16px; }
.menu-toggle{ display:flex; align-items:center; gap:22px; flex-shrink:0; position:relative; }
.hamburger{ display:none; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
.hamburger span{ display:block; width:22px; height:2.5px; background:var(--navy); border-radius:2px; }
.nav-overlay{ display:none; position:absolute; top:calc(100% + 12px); right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(18,48,86,0.16); z-index:9999; min-width:170px; padding:6px 0; }
.nav-overlay.open{ display:block; }
.nav-overlay-inner{ display:flex; flex-direction:column; }
.nav-overlay-inner a{ color:var(--navy-dark); font-size:0.9rem; font-weight:700; text-decoration:none; font-family:'Quicksand',sans-serif; padding:11px 18px; }
.nav-overlay-inner a:hover{ background:var(--panel); }
.cart-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; text-decoration:none; }
.cart-icon:hover{ color:var(--green); }
.cart-icon-inner{ display:flex; align-items:center; position:relative; }
.cart-count{ position:absolute; top:-2px; right:-4px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--navy); color:#fff; font-size:0.6rem; font-weight:700; line-height:15px; text-align:center; display:none; font-family:'Quicksand',sans-serif; box-sizing:border-box; }
.cart-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }
.login-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; }
.login-icon:hover{ color:var(--green); }
.login-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }
.logout-icon-btn{ display:flex; align-items:center; color:var(--navy); cursor:pointer; padding:4px; }
.logout-icon-btn:hover{ color:var(--green); }

@media (max-width: 1150px){
  .header-nav-links{ display:none; }
  .hamburger{ display:flex; }
  header{ gap:10px; padding:10px 14px; }
  .header-search-row{ max-width:200px; }
  .logo-word{ font-size:0.95rem; }
}
@media (max-width: 420px){
  header{ gap:6px; padding:8px 10px; }
  .header-search-row{ max-width:160px; }
  .header-search-row input{ padding:10px 12px 10px 34px; font-size:0.8rem; }
  .header-search-row .search-icon-btn{ left:11px; width:14px; height:14px; }
  .menu-toggle{ gap:10px; }
  .cart-icon svg{ width:18px; height:18px; }
  .cart-count{ font-size:0.55rem; min-width:13px; height:13px; line-height:13px; }
  .cart-icon-label{ display:none; }
  .logo-word{ font-size:0.85rem; }
  .login-icon svg{ width:18px; height:18px; }
  .login-icon-label{ display:none; }
}

/* ---- footer (matches shop.html) ---- */
footer.footer-main{margin-top:60px; padding:40px 20px 24px; background:var(--navy-dark); border-top:1px solid var(--line); font-family:'Quicksand',sans-serif;}
.footer-grid{max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:28px; margin-bottom:28px;}
.footer-col{ text-align:left; }
.footer-col h4{color:rgba(255,255,255,0.45); font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin:0 0 14px;}
.footer-col a{display:block; color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.85rem; margin-bottom:8px; overflow-wrap:break-word;}
.footer-col a:hover{ color:var(--green); }
.footer-col p{ color:rgba(255,255,255,0.6); font-size:0.82rem; line-height:1.6; margin:0 0 6px; overflow-wrap:break-word; }
.footer-social{display:flex; gap:10px;}
.footer-social a{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; margin:0;}
.footer-signup-input{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-family:'Quicksand',sans-serif;font-size:0.78rem;margin-bottom:8px;box-sizing:border-box;background:rgba(255,255,255,0.08);color:#fff;}
.footer-signup-input::placeholder{ color:rgba(255,255,255,0.4); }
.footer-signup-btn{width:100%;padding:9px;background:var(--green);color:#fff;border:none;border-radius:6px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:0.78rem;cursor:pointer;}
.footer-signup-btn:hover{ background:#358f41; }
.footer-signup-msg{font-size:0.75rem; margin-top:6px; color:var(--green);}
.footer-legal{max-width:1200px; margin:24px auto 0; font-size:0.7rem; color:rgba(255,255,255,0.5); line-height:1.5; border-top:1px solid rgba(255,255,255,0.15); padding-top:16px;}
.footer-legal a{ color:rgba(255,255,255,0.75); text-decoration:underline; }
.footer-legal a:hover{ color:#fff; }
.footer-info-row{ position:relative; display:flex; align-items:center; min-height:34px; max-width:1200px; margin:0 auto 20px; }
.footer-info-brand{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.footer-logo-mark{ flex-shrink:0; }
.footer-flag-icon{ flex-shrink:0; border-radius:2px; overflow:hidden; margin-left:16px; }
.footer-brand-name{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.8rem; white-space:nowrap; }
.footer-brand-name .forge{ color:#fff; }
.footer-brand-name .well{ color:var(--green); }
.footer-country-label{ font-size:0.72rem; color:rgba(255,255,255,0.6); white-space:nowrap; }
.footer-info-row .footer-catalog-search{ margin-left:auto; }
.footer-catalog-search{ max-width:220px; width:100%; position:relative; }
.footer-catalog-search .search-icon-btn{ left:10px; width:14px; height:14px; }
.footer-catalog-search input{ width:100%; box-sizing:border-box; padding:9px 10px 9px 32px; border-radius:6px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.05) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='0.6'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 10px center/14px 14px; color:#fff; font-size:0.8rem; }
.footer-catalog-search input::placeholder{ color:rgba(255,255,255,0.45); }
.footer-bottom{max-width:1200px; margin:16px auto 0; text-align:center;}
.footer-copyright{font-size:0.75rem; color:rgba(255,255,255,0.5); margin:0 0 12px;}
.footer-legal-links{display:flex; flex-wrap:wrap; justify-content:center; gap:14px;}
.footer-legal-links a{color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.75rem;}
.footer-legal-links a:hover{ color:#fff; text-decoration:underline; }
@media (max-width: 600px) {
  .footer-info-row{ flex-direction:column; align-items:center; gap:14px; min-height:0; }
  .footer-info-brand{ position:static; transform:none; }
  .footer-info-row .footer-catalog-search{ margin-left:0; }
}

.cart-page-wrap{ max-width:1200px; margin:32px auto 80px; padding:0 24px; }
.cart-page-wrap h1{ color:var(--navy-dark); font-size:1.6rem; margin-bottom:24px; }

.cart-empty-state{ text-align:center; padding:60px 24px; color:var(--gray); }
.cart-empty-state p{ font-size:1rem; margin-bottom:16px; }
.cart-empty-cta{ display:inline-block; padding:12px 28px; background:var(--navy); color:#fff; font-weight:700; font-size:0.85rem; border-radius:6px; text-decoration:none; }
.cart-empty-cta:hover{ background:var(--navy-dark); }

.cart-page-grid{ display:grid; grid-template-columns:1fr 340px; gap:32px; align-items:start; }

.cart-item-row{ display:grid; grid-template-columns:80px 1fr auto; gap:16px; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); }
.cart-item-img-link{ display:block; }
.cart-item-img{ width:80px; height:80px; object-fit:cover; border-radius:8px; background:var(--panel); border:1px solid var(--line); display:block; }
.cart-item-img-placeholder{ display:flex; }
.cart-item-info{ min-width:0; }
.cart-item-name{ display:block; color:var(--navy-dark); font-weight:700; font-size:0.95rem; text-decoration:none; margin-bottom:4px; overflow-wrap:break-word; }
.cart-item-name:hover{ color:var(--navy); text-decoration:underline; }
.cart-item-unit-price{ color:var(--gray); font-size:0.8rem; margin-bottom:10px; }
.cart-item-controls{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.qty-stepper{ display:flex; align-items:center; border:1.5px solid var(--line); border-radius:6px; overflow:hidden; }
.qty-stepper button{ width:32px; height:32px; background:#fff; border:none; cursor:pointer; font-size:1rem; color:var(--navy); font-family:'Quicksand',sans-serif; }
.qty-stepper button:hover{ background:var(--panel); }
.qty-stepper input{ width:38px; text-align:center; border:none; font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.85rem; }
.cart-remove-link{ background:none; border:none; color:#C0447A; font-size:0.8rem; cursor:pointer; padding:0; font-family:'Quicksand',sans-serif; text-decoration:underline; }
.cart-item-line-total{ font-weight:700; color:var(--navy-dark); font-size:0.95rem; white-space:nowrap; }

.cart-summary-card{ border:1px solid var(--line); border-radius:10px; padding:20px; background:var(--panel); position:sticky; top:90px; }
.cart-summary-line{ display:flex; justify-content:space-between; font-size:0.85rem; color:#444; margin-bottom:10px; }
.cart-summary-discount{ color:var(--green); font-weight:700; }
.cart-promo-row{ display:flex; gap:8px; margin:16px 0 6px; }
.cart-promo-row input{ flex:1; min-width:0; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-family:'Quicksand',sans-serif; font-size:0.82rem; box-sizing:border-box; }
.cart-promo-row button{ padding:9px 14px; background:#fff; border:1.5px solid var(--navy); color:var(--navy); border-radius:6px; font-weight:700; font-size:0.8rem; cursor:pointer; font-family:'Quicksand',sans-serif; }
.cart-promo-row button:hover{ background:var(--navy); color:#fff; }
.cart-promo-msg{ font-size:0.72rem; color:var(--gray); min-height:14px; margin-bottom:10px; }
.cart-total-row{ display:flex; justify-content:space-between; font-weight:700; font-size:1.05rem; color:var(--navy-dark); padding-top:14px; border-top:1px solid var(--line); margin-top:4px; margin-bottom:16px; }
.cart-checkout-btn{ width:100%; padding:14px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-weight:700; font-size:0.95rem; cursor:pointer; font-family:'Quicksand',sans-serif; }
.cart-checkout-btn:hover{ background:var(--navy-dark); }

@media (max-width:800px){
  .cart-page-grid{ grid-template-columns:1fr; }
  .cart-summary-card{ position:static; }
}
@media (max-width:600px){
  .cart-page-wrap{ margin:20px auto 60px; padding:0 16px; }
  .cart-item-row{ grid-template-columns:64px 1fr auto; gap:10px; }
  .cart-item-img{ width:64px; height:64px; }
  .cart-item-name{ font-size:0.88rem; }
  .cart-item-line-total{ font-size:0.85rem; }
}
</style>

</head>
<body>

<div id="header-placeholder"></div>




<div class="cart-page-wrap">
  <h1>Shopping Cart</h1>

  <div id="cart-page-empty" class="cart-empty-state" style="display:none;">
    <p>Your cart is empty.</p>
    <a href="/shop.html" class="cart-empty-cta">Continue Shopping</a>
  </div>

  <div id="cart-page-content" class="cart-page-grid" style="display:none;">
    <div class="cart-items-col">
      <div id="cart-items-list"></div>
    </div>
    <div class="cart-summary-col">
      <div class="cart-summary-card">
        <div id="cart-summary-lines"></div>
        <div class="cart-promo-row">
          <input type="text" id="cart-promo-input" placeholder="Promo code">
          <button type="button" id="cart-promo-btn">Apply</button>
        </div>
        <div id="cart-promo-msg" class="cart-promo-msg"></div>
        <div class="cart-total-row">
          <span>Order Total</span>
          <span id="cart-page-total">$0.00</span>
        </div>
        <button type="button" id="cart-checkout-btn" class="cart-checkout-btn">Proceed to Checkout</button>
      </div>
    </div>
  </div>
</div>


<div id="footer-placeholder"></div>

<script>
let allProducts = [];
let cart = JSON.parse(localStorage.getItem('forgewell_cart') || '[]');

async function catalogSearchJump(query) {
  query = query.trim().toLowerCase();
  if (!query) return;
  await productsReady;
  const match = allProducts.find(p => {
    const base = (p.name || '').replace(/\s*\(?\d+(\.\d+)?\s?(mg|mcg|iu|ml)\)?\s*$/i, '').trim().toLowerCase();
    return base === query || base.indexOf(query) !== -1;
  });
  if (match) {
    window.location.href = '/product.html?id=' + encodeURIComponent(match.id);
  } else {
    window.location.href = '/shop.html#tabs';
  }
}

// Wires up all header/footer interactivity. Runs only after header.html and
// footer.html have been fetched and injected below -- their elements don't
// exist in the DOM before then.
function wireHeaderFooter() {
  var footerSearchInput = document.getElementById('footer-catalog-search-input');
  if (footerSearchInput) {
    footerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var footerSearchIconBtn = document.getElementById('footer-search-icon-btn');
  if (footerSearchIconBtn && footerSearchInput) {
    footerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var headerSearchInput = document.getElementById('header-catalog-search-input');
  if (headerSearchInput) {
    headerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(headerSearchInput.value);
    });
  }
  var headerSearchIconBtn = document.getElementById('header-search-icon-btn');
  if (headerSearchIconBtn && headerSearchInput) {
    headerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(headerSearchInput.value);
    });
  }

  var hamBtn = document.getElementById('hamburger-btn');
  var overlay = document.getElementById('nav-overlay');
  if (hamBtn && overlay) {
    hamBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.toggle('open');
    });
  }
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target.closest('a')) overlay.classList.remove('open');
    });
    document.addEventListener('click', function(e) {
      if (overlay.classList.contains('open') && !overlay.contains(e.target)) {
        overlay.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') overlay.classList.remove('open');
    });
  }

  // Checks whether the person is logged in and updates the header's account
  // icon accordingly -- shows "Hi, [name]" linking to order history if
  // logged in, "Sign In" linking to the login/signup page otherwise. Runs
  // on every page that shares this header.
  var loginIcon = document.getElementById('account-icon');
  if (loginIcon) {
    fetch('/api/auth/me', { credentials: 'include' })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(customer) {
        if (customer) {
          loginIcon.href = '/orders.html';
          loginIcon.title = 'My Account (' + customer.email + ')';
          // Name wasn't always required at signup -- older accounts can
          // still have a null name, so fall back to the email's local-part
          // rather than showing a blank/broken greeting.
          var displayName = customer.name || customer.email.split('@')[0];
          var labelEl = loginIcon.querySelector('.login-icon-label');
          if (labelEl) labelEl.textContent = 'Hi, ' + displayName;

          function doLogout() {
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
              .then(function() { window.location.href = '/shop.html'; });
          }

          // Icon-only sign-out control next to the account icon -- only
          // created/shown once logged in, so it adds no width to the
          // header's tightly-tuned breakpoint math for the (far more
          // common) logged-out state. Gives desktop-width visitors a
          // direct sign-out path: today the hamburger dropdown below
          // (the only other place "Log Out" lives) is hidden above 1150px.
          var logoutIconBtn = document.getElementById('logout-icon-btn');
          if (logoutIconBtn) {
            logoutIconBtn.style.display = 'flex';
            logoutIconBtn.addEventListener('click', function(e) {
              e.preventDefault();
              doLogout();
            });
          }

          var navInner = document.querySelector('.nav-overlay-inner');
          if (navInner && !document.getElementById('nav-logout-link')) {
            var logoutLink = document.createElement('a');
            logoutLink.href = '#';
            logoutLink.id = 'nav-logout-link';
            logoutLink.textContent = 'Log Out';
            logoutLink.addEventListener('click', function(e) {
              e.preventDefault();
              doLogout();
            });
            navInner.appendChild(logoutLink);
          }
        }
      })
      .catch(function() { /* not logged in or request failed -- leave icon pointing to /login.html */ });
  }

  // Restores the header's cart count from localStorage now that the header
  // actually exists in the DOM (it didn't yet when updateCartIcon() first
  // ran further down this script).
  updateCartIcon();
}

Promise.all([
  fetch('/header.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('header-placeholder').innerHTML = html;
  }),
  fetch('/footer.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('footer-placeholder').innerHTML = html;
  })
]).then(wireHeaderFooter).catch(function(err) {
  console.error('Failed to load shared header/footer', err);
});

// Only used here to look up each cart item's image_path for display --
// cart.html has no product cards, so there's no card-population step
// like the other pages' loadProducts() has.
async function loadProducts() {
  try {
    const res = await fetch('/api/products');
    allProducts = await res.json();
  } catch (err) {
    console.error('Failed to load products from backend:', err);
  }
  renderCartPage();
}

// Paths come from the product DB as "images/foo.png", relative to site
// root -- same normalization used on product.html/shop.html/home.html.
function resolveImagePath(path) {
  if (!path) return null;
  if (path.indexOf('http') === 0) return path;
  // Actual files are served as WebP (much smaller); the DB only ever knows
  // about the .png name, so the swap happens here rather than at the source.
  path = path.replace(/\.png$/i, '.webp');
  if (path.indexOf('/') === 0) return path;
  return '/' + path;
}

function saveCart() {
  localStorage.setItem('forgewell_cart', JSON.stringify(cart));
  updateCartIcon();
}

function updateCartIcon() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById('cart-count');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }
}

function removeFromCart(productId) {
  cart = cart.filter(i => i.productId !== productId);
  saveCart();
  renderCartPage();
}

function updateCartQty(productId, newQty) {
  const item = cart.find(i => i.productId === productId);
  if (!item) return;
  item.qty = Math.max(1, newQty);
  saveCart();
  renderCartPage();
}

// Mirrors the exact same rule as the backend (routes/checkout.js):
// flat 10% off, either buy 3+ of one item OR spend $150+ total —
// whichever gives the bigger discount, never both stacked. This is
// just a live preview for the customer; the backend recalculates the
// real charge from scratch at checkout time, so this can't be gamed.
const BULK_QTY_THRESHOLD = 3;
const BULK_QTY_DISCOUNT = 0.10;
const CART_TOTAL_THRESHOLD = 150;
const CART_TOTAL_DISCOUNT = 0.10;

function calculateCartDiscount(cartItems) {
  let rawTotal = 0;
  let perItemTotal = 0;
  cartItems.forEach(item => {
    const lineTotal = item.price * item.qty;
    rawTotal += lineTotal;
    perItemTotal += item.qty >= BULK_QTY_THRESHOLD
      ? lineTotal * (1 - BULK_QTY_DISCOUNT)
      : lineTotal;
  });
  const cartWideTotal = rawTotal >= CART_TOTAL_THRESHOLD
    ? rawTotal * (1 - CART_TOTAL_DISCOUNT)
    : rawTotal;
  const finalTotal = Math.min(perItemTotal, cartWideTotal, rawTotal);
  return {
    subtotal: rawTotal,
    total: finalTotal,
    discountApplied: finalTotal < rawTotal,
    savings: rawTotal - finalTotal,
  };
}

function renderCartPage() {
  const emptyState = document.getElementById('cart-page-empty');
  const content = document.getElementById('cart-page-content');

  if (cart.length === 0) {
    emptyState.style.display = 'block';
    content.style.display = 'none';
    return;
  }
  emptyState.style.display = 'none';
  content.style.display = 'grid';

  const list = document.getElementById('cart-items-list');
  list.innerHTML = '';
  cart.forEach(item => {
    const product = allProducts.find(p => p.id === item.productId);
    const imgUrl = product ? resolveImagePath(product.image_path) : null;
    const lineTotal = item.price * item.qty;
    const productLink = '/product.html?id=' + encodeURIComponent(item.productId);

    const row = document.createElement('div');
    row.className = 'cart-item-row';
    row.innerHTML =
      '<a href="' + productLink + '" class="cart-item-img-link">' +
        (imgUrl
          ? '<img src="' + imgUrl + '" alt="' + item.name + '" class="cart-item-img">'
          : '<div class="cart-item-img cart-item-img-placeholder"></div>') +
      '</a>' +
      '<div class="cart-item-info">' +
        '<a href="' + productLink + '" class="cart-item-name">' + item.name + '</a>' +
        '<div class="cart-item-unit-price">$' + item.price.toFixed(2) + ' each</div>' +
        '<div class="cart-item-controls">' +
          '<div class="qty-stepper">' +
            '<button type="button" class="cart-qty-minus" data-product-id="' + item.productId + '">-</button>' +
            '<input type="text" class="cart-qty-input" value="' + item.qty + '" readonly>' +
            '<button type="button" class="cart-qty-plus" data-product-id="' + item.productId + '">+</button>' +
          '</div>' +
          '<button type="button" class="cart-remove-link" data-product-id="' + item.productId + '">Remove</button>' +
        '</div>' +
      '</div>' +
      '<div class="cart-item-line-total">$' + lineTotal.toFixed(2) + '</div>';
    list.appendChild(row);
  });

  const { subtotal, total, discountApplied, savings } = calculateCartDiscount(cart);

  // Shipping preview: free at $150+ subtotal, $9.95 flat below that.
  // NOTE: mirrors the rate documented in project notes -- I don't have
  // direct read access to routes/checkout.js from here to confirm this
  // still matches the live backend calculation. If the real checkout
  // charges a different amount, this preview will be wrong and needs
  // updating to match.
  const shippingCost = subtotal >= 150 ? 0 : 9.95;
  const grandTotal = total + shippingCost;

  const itemCount = cart.reduce((sum, i) => sum + i.qty, 0);
  let html = '<div class="cart-summary-line"><span>Subtotal (' + itemCount + ' item' + (itemCount === 1 ? '' : 's') + ')</span><span>$' + subtotal.toFixed(2) + '</span></div>';
  if (discountApplied) {
    html += '<div class="cart-summary-line cart-summary-discount"><span>Discount</span><span>-$' + savings.toFixed(2) + '</span></div>';
  }
  html += '<div class="cart-summary-line"><span>Shipping</span><span>' +
    (shippingCost === 0 ? 'Free' : '$' + shippingCost.toFixed(2)) + '</span></div>';
  document.getElementById('cart-summary-lines').innerHTML = html;
  document.getElementById('cart-page-total').textContent = '$' + grandTotal.toFixed(2);
}

// Delegated so it keeps working after renderCartPage() rebuilds the item
// rows -- the qty/remove controls don't exist yet at script-parse time.
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('cart-qty-minus')) {
    const id = e.target.dataset.productId;
    const item = cart.find(i => i.productId === id);
    if (item) updateCartQty(id, item.qty - 1);
    return;
  }
  if (e.target.classList.contains('cart-qty-plus')) {
    const id = e.target.dataset.productId;
    const item = cart.find(i => i.productId === id);
    if (item) updateCartQty(id, item.qty + 1);
    return;
  }
  if (e.target.classList.contains('cart-remove-link')) {
    removeFromCart(e.target.dataset.productId);
    return;
  }
});

document.getElementById('cart-promo-btn').addEventListener('click', function() {
  document.getElementById('cart-promo-msg').textContent = "Promo codes aren't available yet — check back soon.";
});

document.getElementById('cart-checkout-btn').addEventListener('click', function() {
  if (cart.length === 0) return;
  window.location.href = '/checkout.html';
});

renderCartPage();
let productsReady = loadProducts();
updateCartIcon();



</script>
