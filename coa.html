<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgewell — Certificates of Analysis</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.png">
<style>
@font-face { font-family:'Quicksand'; src:url('/fonts/quicksand-variable.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
:root{ --navy:#1B4B8C; --navy-dark:#123056; --green:#3FA34D; --gray:#6b6b6b; --bg:#FFFFFF; --panel:#F7F8F6; --line:#E4E4E0; }
*{box-sizing:border-box;}
body{ background:var(--bg); color:#1a1a1a; font-family:'Quicksand',sans-serif; font-weight:500; margin:0; }
a{color:inherit;}

/* ---- header (single-row, matches header.html) ---- */
header{
  display:flex; align-items:center; flex-wrap:nowrap; gap:18px;
  padding:12px 20px; max-width:1200px; margin:0 auto;
  position:sticky; top:0; z-index:10;
  background:#fff; border-bottom:1px solid var(--line);
}
.logo-mark{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.logo-word{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.2rem; color:var(--navy); white-space:nowrap; }
.logo-word .well{ color:var(--green); }
.header-nav-links{ display:flex; align-items:center; gap:22px; flex-shrink:0; margin-left:16px; }
.header-nav-link{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; color:var(--navy); text-decoration:none; white-space:nowrap; }
.header-nav-link:hover{ color:var(--green); }
.header-search-row{ position:relative; flex:0 1 240px; min-width:0; max-width:240px; margin-left:auto; }
.header-search-row input{ width:100%; box-sizing:border-box; min-width:0; padding:11px 16px 11px 40px; border-radius:6px; border:1.5px solid var(--line); background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6b6b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center/16px 16px; color:#333; font-size:0.95rem; font-family:'Quicksand',sans-serif; }
.header-search-row input:focus{ outline:none; border-color:var(--navy); }
.search-icon-btn{ position:absolute; top:50%; transform:translateY(-50%); padding:0; margin:0; border:none; background:transparent; cursor:pointer; }
.header-search-row .search-icon-btn{ left:14px; width:16px; height:16px; }
.menu-toggle{ display:flex; align-items:center; gap:22px; flex-shrink:0; position:relative; }
.hamburger{ display:none; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
.hamburger span{ display:block; width:22px; height:2.5px; background:var(--navy); border-radius:2px; }
.nav-overlay{ display:none; position:absolute; top:calc(100% + 12px); right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(18,48,86,0.16); z-index:9999; min-width:170px; padding:6px 0; }
.nav-overlay.open{ display:block; }
.nav-overlay-inner{ display:flex; flex-direction:column; }
.nav-overlay-inner a{ color:var(--navy-dark); font-size:0.9rem; font-weight:700; text-decoration:none; font-family:'Quicksand',sans-serif; padding:11px 18px; }
.nav-overlay-inner a:hover{ background:var(--panel); }
.cart-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; text-decoration:none; }
.cart-icon:hover{ color:var(--green); }
.cart-icon-inner{ display:flex; align-items:center; position:relative; }
.cart-count{ position:absolute; top:-2px; right:-4px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--navy); color:#fff; font-size:0.6rem; font-weight:700; line-height:15px; text-align:center; display:none; font-family:'Quicksand',sans-serif; box-sizing:border-box; }
.cart-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }
.login-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; }
.login-icon:hover{ color:var(--green); }
.login-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }

@media (max-width: 1150px){
  .header-nav-links{ display:none; }
  .hamburger{ display:flex; }
  header{ gap:10px; padding:10px 14px; }
  .header-search-row{ max-width:200px; }
  .logo-word{ font-size:0.95rem; }
}
@media (max-width: 420px){
  header{ gap:6px; padding:8px 10px; }
  .header-search-row{ max-width:160px; }
  .header-search-row input{ padding:10px 12px 10px 34px; font-size:0.8rem; }
  .header-search-row .search-icon-btn{ left:11px; width:14px; height:14px; }
  .menu-toggle{ gap:10px; }
  .cart-icon svg{ width:18px; height:18px; }
  .cart-count{ font-size:0.55rem; min-width:13px; height:13px; line-height:13px; }
  .cart-icon-label{ display:none; }
  .logo-word{ font-size:0.85rem; }
  .login-icon svg{ width:18px; height:18px; }
  .login-icon-label{ display:none; }
}

/* ---- footer (matches shop.html) ---- */
footer.footer-main{margin-top:60px; padding:40px 20px 24px; background:var(--navy-dark); border-top:1px solid var(--line); font-family:'Quicksand',sans-serif;}
.footer-grid{max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:28px; margin-bottom:28px;}
.footer-col{ text-align:left; }
.footer-col h4{color:rgba(255,255,255,0.45); font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin:0 0 14px;}
.footer-col a{display:block; color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.85rem; margin-bottom:8px; overflow-wrap:break-word;}
.footer-col a:hover{ color:var(--green); }
.footer-col p{ color:rgba(255,255,255,0.6); font-size:0.82rem; line-height:1.6; margin:0 0 6px; overflow-wrap:break-word; }
.footer-social{display:flex; gap:10px;}
.footer-social a{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; margin:0;}
.footer-signup-input{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-family:'Quicksand',sans-serif;font-size:0.78rem;margin-bottom:8px;box-sizing:border-box;background:rgba(255,255,255,0.08);color:#fff;}
.footer-signup-input::placeholder{ color:rgba(255,255,255,0.4); }
.footer-signup-btn{width:100%;padding:9px;background:var(--green);color:#fff;border:none;border-radius:6px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:0.78rem;cursor:pointer;}
.footer-signup-btn:hover{ background:#358f41; }
.footer-signup-msg{font-size:0.75rem; margin-top:6px; color:var(--green);}
.footer-legal{max-width:1200px; margin:24px auto 0; font-size:0.7rem; color:rgba(255,255,255,0.5); line-height:1.5; border-top:1px solid rgba(255,255,255,0.15); padding-top:16px;}
.footer-info-row{ position:relative; display:flex; align-items:center; min-height:34px; max-width:1200px; margin:0 auto 20px; }
.footer-info-brand{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.footer-logo-mark{ flex-shrink:0; }
.footer-flag-icon{ flex-shrink:0; border-radius:2px; overflow:hidden; margin-left:16px; }
.footer-brand-name{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.8rem; white-space:nowrap; }
.footer-brand-name .forge{ color:#fff; }
.footer-brand-name .well{ color:var(--green); }
.footer-country-label{ font-size:0.72rem; color:rgba(255,255,255,0.6); white-space:nowrap; }
.footer-info-row .footer-catalog-search{ margin-left:auto; }
.footer-catalog-search{ max-width:220px; width:100%; position:relative; }
.footer-catalog-search .search-icon-btn{ left:10px; width:14px; height:14px; }
.footer-catalog-search input{ width:100%; box-sizing:border-box; padding:9px 10px 9px 32px; border-radius:6px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.05) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='0.6'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 10px center/14px 14px; color:#fff; font-size:0.8rem; }
.footer-catalog-search input::placeholder{ color:rgba(255,255,255,0.45); }
.footer-bottom{max-width:1200px; margin:16px auto 0; text-align:center;}
.footer-copyright{font-size:0.75rem; color:rgba(255,255,255,0.5); margin:0 0 12px;}
.footer-legal-links{display:flex; flex-wrap:wrap; justify-content:center; gap:14px;}
.footer-legal-links a{color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.75rem;}
.footer-legal-links a:hover{ color:#fff; text-decoration:underline; }
@media (max-width: 600px) {
  .footer-info-row{ flex-direction:column; align-items:center; gap:14px; min-height:0; }
  .footer-info-brand{ position:static; transform:none; }
  .footer-info-row .footer-catalog-search{ margin-left:0; }
}

/* ---- product page layout ---- */
.product-wrap{max-width:1200px; margin:24px auto 0; padding:0 24px;}
.breadcrumb{font-size:0.78rem; color:var(--gray); margin-bottom:18px;}
.breadcrumb a{color:var(--navy); text-decoration:none;}
.product-main{display:grid; grid-template-columns:1fr 1fr; gap:40px;}
@media (max-width:800px){ .product-main{grid-template-columns:1fr;} }

.gallery-main{width:100%; aspect-ratio:1/1; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.gallery-main img{width:100%; height:100%; object-fit:cover;}
.gallery-thumbs{display:flex; gap:10px; margin-top:10px;}
.gallery-thumbs img{width:64px; height:64px; object-fit:cover; border-radius:6px; border:1.5px solid var(--line); cursor:pointer;}
.gallery-thumbs img.active{border-color:var(--navy);}

.purity-badge{display:inline-block; background:var(--green); color:#fff; font-size:0.7rem; font-weight:700; padding:4px 10px; border-radius:20px; margin-bottom:10px;}
.product-title{font-size:1.7rem; color:var(--navy-dark); margin:0 0 4px; font-weight:700;}
.product-lot{color:var(--gray); font-size:0.8rem; margin-bottom:14px;}
.product-price{font-size:1.9rem; color:var(--navy); font-weight:700; margin-bottom:16px;}
.product-price .was{font-size:1rem; color:var(--gray); text-decoration:line-through; font-weight:500; margin-left:8px;}

.size-selector{margin-bottom:18px;}
.size-selector label{display:block; font-size:0.8rem; font-weight:700; color:var(--navy-dark); margin-bottom:8px;}
.size-options{display:flex; flex-wrap:wrap; gap:8px;}
.size-option{padding:9px 16px; border:1.5px solid var(--line); border-radius:6px; cursor:pointer; font-size:0.85rem; font-family:'Quicksand',sans-serif; background:#fff;}

.qty-row{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.qty-stepper{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:6px; overflow:hidden;}
.qty-stepper button{width:36px; height:36px; background:#fff; border:none; cursor:pointer; font-size:1.1rem; color:var(--navy);}
.qty-stepper input{width:44px; text-align:center; border:none; font-family:'Quicksand',sans-serif; font-weight:700;}

.buy-buttons{display:flex; gap:10px; margin-bottom:20px;}
.btn-add{flex:1; padding:14px; background:#fff; color:var(--navy); border:1.5px solid var(--navy); border-radius:8px; font-weight:700; cursor:pointer; font-family:'Quicksand',sans-serif;}
.btn-buy{flex:1; padding:14px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-family:'Quicksand',sans-serif;}

.trust-row{display:flex; gap:18px; flex-wrap:wrap; font-size:0.75rem; color:var(--gray); margin-bottom:6px;}
.coa-link{color:var(--navy); text-decoration:underline; font-size:0.8rem;}

.product-section{max-width:1200px; margin:36px auto 0; padding:0 24px;}
.product-section h2{font-size:1.1rem; color:var(--navy-dark); border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:14px;}
.bullets{padding-left:18px; margin:0 0 14px; font-size:0.9rem; line-height:1.6;}
.research-text{font-size:0.88rem; line-height:1.7; color:#333;}

table.tech-table{width:100%; border-collapse:collapse; font-size:0.85rem;}
table.tech-table th, table.tech-table td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line);}
table.tech-table th{width:220px; color:var(--gray); font-weight:700;}

.ruo-note{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; font-size:0.75rem; color:var(--gray); line-height:1.5; margin-top:20px;}

.loading-state, .error-state{max-width:1200px; margin:60px auto; padding:0 24px; text-align:center; color:var(--gray);}

</style>
<style>

.login-icon-large{ color:var(--navy); margin-bottom:16px; text-align:center; }
.login-wrap h1{ color:var(--navy-dark); font-size:1.4rem; margin-bottom:6px; text-align:center; }

.auth-tabs{ display:flex; border-bottom:1.5px solid var(--line); margin-bottom:22px; }
.auth-tab{ flex:1; text-align:center; padding:10px; font-weight:700; font-size:0.85rem; color:var(--gray); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1.5px; }
.auth-tab.active{ color:var(--navy); border-bottom-color:var(--navy); }

.auth-form input:focus{ outline:none; border-color:var(--navy); }
.auth-submit-btn{ width:100%; padding:13px; margin-top:20px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-weight:700; font-size:0.9rem; cursor:pointer; font-family:'Quicksand',sans-serif; }
.auth-submit-btn:disabled{ opacity:0.6; cursor:default; }

<style>
.legal-wrap{ max-width:760px; margin:40px auto 80px; padding:0 24px; }
@media (max-width:600px){ .legal-wrap{ padding-left:16px; padding-right:16px; } }
.legal-wrap h1{ color:var(--navy-dark); font-size:1.5rem; margin-bottom:4px; }
.legal-wrap .updated{ color:var(--gray); font-size:0.78rem; margin-bottom:28px; }
.legal-wrap h2{ color:var(--navy-dark); font-size:1.05rem; margin:26px 0 8px; }
.legal-wrap p, .legal-wrap li{ color:#333; font-size:0.9rem; line-height:1.7; }
.legal-wrap ul{ padding-left:20px; }
.legal-wrap a{ color:var(--navy); }
.draft-banner{ background:#FDECD2; border:1px solid #E8B96A; color:#7A4E12; font-size:0.8rem; font-weight:700; padding:12px 16px; border-radius:8px; margin-bottom:24px; }

<body>

<div id="header-placeholder"></div>











<div class="legal-wrap">
  <h1>Certificates of Analysis</h1>
  <p class="updated">Content coming soon.</p>
  <p><a href="/shop.html">Browse the shop &rarr;</a></p>
</div>


<div id="footer-placeholder"></div>

<script>
let allProducts = [];
let cart = JSON.parse(localStorage.getItem('forgewell_cart') || '[]');

async function catalogSearchJump(query) {
  query = query.trim().toLowerCase();
  if (!query) return;
  await productsReady;
  const match = allProducts.find(p => {
    const base = (p.name || '').replace(/\s*\(?\d+(\.\d+)?\s?(mg|mcg|iu|ml)\)?\s*$/i, '').trim().toLowerCase();
    return base === query || base.indexOf(query) !== -1;
  });
  if (match) {
    window.location.href = '/product.html?id=' + encodeURIComponent(match.id);
  } else {
    window.location.href = '/shop.html#tabs';
  }
}

// Wires up all header/footer interactivity. Runs only after header.html and
// footer.html have been fetched and injected below -- their elements don't
// exist in the DOM before then.
function wireHeaderFooter() {
  var footerSearchInput = document.getElementById('footer-catalog-search-input');
  if (footerSearchInput) {
    footerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var footerSearchIconBtn = document.getElementById('footer-search-icon-btn');
  if (footerSearchIconBtn && footerSearchInput) {
    footerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var headerSearchInput = document.getElementById('header-catalog-search-input');
  if (headerSearchInput) {
    headerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(headerSearchInput.value);
    });
  }
  var headerSearchIconBtn = document.getElementById('header-search-icon-btn');
  if (headerSearchIconBtn && headerSearchInput) {
    headerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(headerSearchInput.value);
    });
  }

  var hamBtn = document.getElementById('hamburger-btn');
  var overlay = document.getElementById('nav-overlay');
  if (hamBtn && overlay) {
    hamBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.toggle('open');
    });
  }
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target.closest('a')) overlay.classList.remove('open');
    });
    document.addEventListener('click', function(e) {
      if (overlay.classList.contains('open') && !overlay.contains(e.target)) {
        overlay.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') overlay.classList.remove('open');
    });
  }

  // Checks whether the person is logged in and updates the header's account
  // icon accordingly -- links to order history if logged in, to the
  // login/signup page otherwise. Runs on every page that shares this header.
  var loginIcon = document.querySelector('.login-icon');
  if (loginIcon) {
    fetch('/api/auth/me', { credentials: 'include' })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(customer) {
        if (customer) {
          loginIcon.href = '/orders.html';
          loginIcon.title = 'My Account (' + customer.email + ')';
          var navInner = document.querySelector('.nav-overlay-inner');
          if (navInner && !document.getElementById('nav-logout-link')) {
            var logoutLink = document.createElement('a');
            logoutLink.href = '#';
            logoutLink.id = 'nav-logout-link';
            logoutLink.textContent = 'Log Out';
            logoutLink.addEventListener('click', function(e) {
              e.preventDefault();
              fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
                .then(function() { window.location.href = '/shop.html'; });
            });
            navInner.appendChild(logoutLink);
          }
        }
      })
      .catch(function() { /* not logged in or request failed -- leave icon pointing to /login.html */ });
  }

  // Restores the header's cart count from localStorage now that the header
  // actually exists in the DOM (it didn't yet when updateCartIcon() first
  // ran further down this script).
  updateCartIcon();
}

Promise.all([
  fetch('/header.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('header-placeholder').innerHTML = html;
  }),
  fetch('/footer.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('footer-placeholder').innerHTML = html;
  })
]).then(wireHeaderFooter).catch(function(err) {
  console.error('Failed to load shared header/footer', err);
});

async function loadProducts() {
  try {
    const res = await fetch('/api/products');
    const products = await res.json();
    allProducts = products;
    document.querySelectorAll('.card').forEach(card => {
      const nameEl = card.querySelector('h3');
      if (!nameEl) return;
      const name = nameEl.textContent.trim();
      const product = products.find(p => p.name === name);
      if (!product) return;
      const lotEl = card.querySelector('.lot');
      const priceEl = card.querySelector('.price');
      if (lotEl) lotEl.textContent = product.dosage + ' · LOT #' + product.lot;
      if (priceEl) priceEl.textContent = product.price > 0 ? '$' + product.price.toFixed(2) : '$XX';
      card.dataset.productId = product.id;
    });
  } catch (err) {
    console.error('Failed to load products from backend:', err);
  }
}

function saveCart() {
  localStorage.setItem('forgewell_cart', JSON.stringify(cart));
  updateCartIcon();
}

function updateCartIcon() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById('cart-count');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }
}

function addToCart(productId) {
  const product = allProducts.find(p => p.id === productId);
  if (!product) return;
  const existing = cart.find(i => i.productId === productId);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ productId: product.id, name: product.name, price: product.price, qty: 1 });
  }
  saveCart();
}

document.addEventListener('click', (e) => {
  if (e.target.classList.contains('add-btn')) {
    const card = e.target.closest('.card');
    const productId = card?.dataset.productId;
    if (!productId) {
      alert('Product not loaded yet — try refreshing the page.');
      return;
    }
    addToCart(productId);
    return;
  }
  if (e.target.classList.contains('buy-btn')) {
    const card = e.target.closest('.card');
    const productId = card?.dataset.productId;
    if (!productId) {
      alert('Product not loaded yet — try refreshing the page.');
      return;
    }
    addToCart(productId);
    window.location.href = '/checkout.html';
    return;
  }

  // Clicking anywhere else on a card (image, name, lot, price) goes to
  // that product's detail page — the buttons above are handled first
  // and return early, so they're excluded from this navigation.
  const card = e.target.closest('.card');
  if (card) {
    const productId = card.dataset.productId;
    if (productId) {
      window.location.href = '/product.html?id=' + encodeURIComponent(productId);
    }
  }
});

let productsReady = loadProducts().then(populateMostPopular);

function populateMostPopular() {
  const featured = ['Semaglutide', 'Tesamorelin', 'BPC-157', 'GHK-Cu'];
  const grid = document.getElementById('most-popular-grid');
  if (!grid) return;
  featured.forEach(name => {
    const card = Array.from(document.querySelectorAll('.card')).find(c => {
      const h3 = c.querySelector('h3');
      return h3 && h3.textContent.trim() === name;
    });
    if (card) {
      grid.appendChild(card.cloneNode(true));
    }
  });
}
updateCartIcon();



</script>
