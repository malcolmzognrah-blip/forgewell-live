<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Confirmation — Forgewell</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.png">
<style>
@font-face { font-family:'Quicksand'; src:url('/fonts/quicksand-variable.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
:root{
  --navy:#1B4B8C; --navy-dark:#123056; --green:#3FA34D;
  --gray:#6b6b6b; --panel:#F7F8F6; --line:#E4E4E0;
}
*{box-sizing:border-box;}
body{
  margin:0; background:#fff; color:#222;
  font-family:'Quicksand',-apple-system,sans-serif;
}
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 24px; border-bottom:1px solid var(--line);
}
.logo-mark{ display:flex; align-items:center; gap:8px; text-decoration:none; }
.logo-word .forge{ color:var(--navy); font-weight:800; }
.logo-word .well{ color:var(--green); font-weight:800; }

main{ max-width:640px; margin:0 auto; padding:40px 20px 60px; }

.status-icon{ display:flex; justify-content:center; margin-bottom:20px; }
.status-icon svg{ width:64px; height:64px; }

h1{ text-align:center; color:var(--navy-dark); font-size:1.6rem; margin:0 0 8px; }
.status-sub{ text-align:center; color:var(--gray); font-size:0.95rem; margin:0 0 32px; }

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:20px; margin-bottom:20px;
}
.card h2{ font-size:0.95rem; color:var(--navy-dark); margin:0 0 14px; }

.order-id{
  font-family:monospace; font-size:0.8rem; color:var(--gray);
  background:#fff; border:1px solid var(--line); border-radius:6px;
  padding:8px 10px; word-break:break-all;
}

.line-item{
  display:flex; justify-content:space-between; padding:8px 0;
  border-bottom:1px solid var(--line); font-size:0.9rem;
}
.line-item:last-child{ border-bottom:none; }
.line-item .name{ color:#333; }
.line-item .qty{ color:var(--gray); font-size:0.8rem; }
.line-item .price{ font-weight:700; color:var(--navy-dark); }

.totals-row{
  display:flex; justify-content:space-between; padding:6px 0; font-size:0.88rem; color:var(--gray);
}
.totals-row.final{
  border-top:1px solid var(--line); margin-top:8px; padding-top:12px;
  font-size:1.05rem; font-weight:800; color:var(--navy-dark);
}

.address-block{ font-size:0.88rem; color:#333; line-height:1.6; }

.spinner{
  width:32px; height:32px; border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--navy);
  animation:spin 0.8s linear infinite; margin:0 auto 20px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.shop-link{
  display:block; text-align:center; margin-top:28px;
  color:var(--navy); font-weight:700; text-decoration:none; font-size:0.9rem;
}
.shop-link:hover{ text-decoration:underline; }

.error-box{
  text-align:center; padding:20px; color:var(--gray); font-size:0.9rem;
}

/* Lightweight stand-in for the shared header/footer this page
   deliberately doesn't load (see CLAUDE.md) -- just enough to show a
   signed-in customer they're still logged in, plus a way back to the
   site that isn't otherwise present while an order is still actively
   polling (ctaHtml() below has no link at all in that state). */
.session-bar{
  max-width:640px; margin:14px auto 0; padding:0 20px 12px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:0.8rem; color:var(--gray);
}
.session-bar a{ color:var(--navy); font-weight:700; text-decoration:none; white-space:nowrap; }
.session-bar a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<header>
  <a href="/shop.html" class="logo-mark">
    <img src="/images/forgewell-logo-mark.png" alt="Forgewell" style="height:29px; width:auto; display:block;">
    <span class="logo-word"><span class="forge">FORGE</span><span class="well">WELL</span></span>
  </a>
</header>

<div class="session-bar">
  <span id="session-indicator-text"></span>
  <a href="/shop.html" class="continue-shopping-link">Continue Shopping &rarr;</a>
</div>

<main id="main-content">
  <div class="spinner"></div>
  <h1 style="text-align:center;">Confirming your order…</h1>
  <p class="status-sub" style="text-align:center;">If a payment tab just opened, complete your payment there — this page will update on its own once it's confirmed.</p>
</main>

<script>
function getOrderId() {
  const params = new URLSearchParams(window.location.search);
  // Different possible param names PayRam or our own redirect might use —
  // check all of them rather than assuming one specific name.
  const fromQuery = params.get('orderId') || params.get('order_id') || params.get('reference_id') || params.get('ref');
  if (fromQuery) return fromQuery;
  // Fall back to what shop.html saved right before redirecting to PayRam.
  return localStorage.getItem('forgewell_last_order_id');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function renderNotFound() {
  document.getElementById('main-content').innerHTML = `
    <h1>Thank you for your order!</h1>
    <p class="status-sub">We couldn't automatically look up your order details, but if your payment completed, you'll receive a confirmation email shortly.</p>
    <div class="error-box">
      If you have questions about your order, please contact support and reference the email address you checked out with.
    </div>
    <a href="/shop.html" class="shop-link continue-shopping-link">&larr; Back to shop</a>
  `;
  updateContinueShoppingLink();
}

function statusDisplay(status, timedOut) {
  if (status === 'paid') return { icon: 'check', title: 'Thank you for your order!', sub: 'Your payment is confirmed and your order is being processed.' };
  if (status === 'pending_payment' && timedOut) return { icon: 'clock', title: 'Still confirming your payment', sub: "This is taking longer than expected. If your payment goes through, you'll still get a confirmation email — your cart is safely saved either way if you'd rather return to checkout." };
  if (status === 'pending_payment') return { icon: 'clock', title: 'Confirming your payment…', sub: 'Finish payment in the tab that opened, then just leave this page open — it will update automatically once your payment is confirmed.' };
  if (status === 'partially_paid') return { icon: 'clock', title: 'Partial payment received', sub: 'We received only part of the expected payment. Please contact support with your order ID below before trying again — a new checkout would create a separate order rather than complete this one.' };
  if (status === 'cancelled') return { icon: 'x', title: 'Payment did not go through', sub: 'This order was cancelled or the payment was not completed. Your cart is still saved — you can return to checkout to try again.' };
  return { icon: 'clock', title: 'Order status: ' + escapeHtml(status), sub: '' };
}

// Only branch that decides the bottom-of-page link/action. Kept separate
// from statusDisplay() since the two vary somewhat independently (e.g.
// pending_payment has two different sub-messages above but only gets a
// link in the timedOut case).
function ctaHtml(order, timedOut) {
  if (order.status === 'paid') return '<a href="/shop.html" class="shop-link continue-shopping-link">Continue shopping &rarr;</a>';
  if (order.status === 'cancelled') return '<a href="/checkout.html" class="shop-link">Return to checkout &rarr;</a>';
  if (order.status === 'pending_payment' && timedOut) return '<a href="/checkout.html" class="shop-link">Return to checkout &rarr;</a>';
  if (order.status === 'pending_payment') return ''; // still actively polling -- no link yet
  return '<a href="/shop.html" class="shop-link continue-shopping-link">&larr; Back to shop</a>'; // partially_paid / unknown status: neutral fallback
}

function iconSvg(kind) {
  if (kind === 'check') {
    return '<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#3FA34D"/><path d="M20 33l8 8 16-16" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  if (kind === 'x') {
    return '<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#c0392b"/><path d="M22 22l20 20M42 22L22 42" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>';
  }
  return '<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#1B4B8C"/><path d="M32 18v16l10 6" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function renderOrder(order, timedOut) {
  const s = statusDisplay(order.status, timedOut);
  firstLineItemProductId = (order.line_items && order.line_items[0] && order.line_items[0].productId) || null;
  // The cart survives checkout.html's redirect to PayRam unpaid (see
  // checkout.html) specifically so backing out leaves it intact -- this is
  // the one place it actually gets cleared, once payment is confirmed.
  if (order.status === 'paid') {
    localStorage.setItem('forgewell_cart', JSON.stringify([]));
    // Also clears the server-side cart mirror (routes/cart.js, backend
    // repo) that lib/jobs.js's abandoned-cart reminder job polls --
    // otherwise a customer who already completed checkout could still
    // get a "you left something in your cart" email later. Fire-and-
    // forget: a guest checkout has no session (401, silently ignored)
    // and never had a server-side cart mirror to clear anyway.
    fetch('/api/cart/mine', { method: 'DELETE', credentials: 'include' }).catch(() => {});
  }
  const items = (order.line_items || []).map(li => `
    <div class="line-item">
      <div>
        <div class="name">${escapeHtml(li.name)}</div>
        <div class="qty">Qty ${escapeHtml(li.qty)}</div>
      </div>
      <div class="price">$${Number(li.lineTotal).toFixed(2)}</div>
    </div>
  `).join('');

  const addr = order.shipping_address || {};
  const addressHtml = addr.name ? `
    <div class="address-block">
      ${escapeHtml(addr.name)}<br>
      ${escapeHtml(addr.line1)}${addr.line2 ? '<br>' + escapeHtml(addr.line2) : ''}<br>
      ${escapeHtml(addr.city)}, ${escapeHtml(addr.state)} ${escapeHtml(addr.zip)}<br>
      ${escapeHtml(addr.country)}
    </div>
  ` : '<div class="address-block">No shipping address on file for this order.</div>';

  const shippingCost = Number(order.shipping_cost || 0);
  const shippingLine = shippingCost === 0 ? 'Free' : '$' + shippingCost.toFixed(2);

  document.getElementById('main-content').innerHTML = `
    <div class="status-icon">${iconSvg(s.icon)}</div>
    <h1>${escapeHtml(s.title)}</h1>
    <p class="status-sub">${escapeHtml(s.sub)}</p>

    <div class="card">
      <h2>Order details</h2>
      <div class="order-id">Order Number: ${escapeHtml(order.order_number || order.id)}</div>
    </div>

    <div class="card">
      <h2>Items</h2>
      ${items || '<p style="color:var(--gray);font-size:0.85rem;">No item details available.</p>'}
      <div class="totals-row"><span>Subtotal</span><span>$${Number(order.subtotal).toFixed(2)}</span></div>
      ${order.discount_applied ? '<div class="totals-row"><span>Bulk discount</span><span>Applied</span></div>' : ''}
      <div class="totals-row"><span>Shipping</span><span>${shippingLine}</span></div>
      <div class="totals-row final"><span>Total</span><span>$${Number(order.total).toFixed(2)}</span></div>
    </div>

    <div class="card">
      <h2>Shipping to</h2>
      ${addressHtml}
    </div>

    ${ctaHtml(order, timedOut)}
  `;
  updateContinueShoppingLink();
}

// shop.html/home.html's mandatory login gate (see CLAUDE.md) means a
// guest who clicks "Continue Shopping" there is deterministically
// bounced to the sign-in page -- guest checkout never establishes a
// session, so that gate's own GET /api/auth/me check always fails for
// them. Signed-in customers are unaffected and keep going to
// /shop.html as before. product.html carries no such gate, so guests
// get sent there instead -- linked to the first item from the order
// they just placed (plausibly still relevant to them) rather than a
// bare product.html with no id, which renders a dead-end "No product
// specified" error whose own "Return to shop" link points right back
// at the same gated /shop.html.
let isSignedInCustomer = null; // null = not yet known
let firstLineItemProductId = null;

// Targets every .continue-shopping-link currently in the DOM, not just
// one fixed element -- the session-bar's copy is always present from
// page load, but ctaHtml()'s and renderNotFound()'s copies are built
// fresh (or not at all) each time innerHTML is replaced, and only one
// of the three is ever a given status's actual link anyway. Safe to
// call before any of the order/session data has arrived (falls back to
// /shop.html, the pre-existing default) and safe to call repeatedly as
// each independent piece of state resolves -- whichever call runs last
// simply re-applies the currently-known-best destination to whatever
// links exist at that moment.
function updateContinueShoppingLink() {
  const destination = (isSignedInCustomer === false && firstLineItemProductId)
    ? '/product.html?id=' + encodeURIComponent(firstLineItemProductId)
    : '/shop.html';
  document.querySelectorAll('.continue-shopping-link').forEach(function(link) {
    link.href = destination;
  });
}

// Same fetch/credentials shape shop.html's login-icon check already
// uses elsewhere -- this page doesn't load header.html at all (see
// CLAUDE.md), so it needs its own copy rather than wireHeaderFooter().
// Silently shows nothing extra on a non-ok response or a network error,
// same as a guest -- this indicator is purely informational and must
// never block or redirect either way.
fetch('/api/auth/me', { credentials: 'include' })
  .then(function(res) { return res.ok ? res.json() : null; })
  .then(function(customer) {
    isSignedInCustomer = !!(customer && customer.email);
    if (isSignedInCustomer) {
      document.getElementById('session-indicator-text').textContent = 'Signed in as ' + customer.email;
    }
    updateContinueShoppingLink();
  })
  .catch(function() {});

let pollCount = 0;
let pollTimer = null;
// Tracks the last status/timedOut combination actually rendered, so a
// poll that comes back with nothing new skips renderOrder() entirely
// instead of tearing down and rebuilding the whole confirmation view
// every 5 seconds -- that repeated full-innerHTML replace, not a real
// redirect or duplicate webhook, was what made this page feel like it
// kept showing "multiple confirmation pages" while pending (see the
// investigation this fix comes from). Only ever SKIPS a redundant
// render of unchanged state; a real transition (pending -> paid, or
// pending -> timed-out) always has a different key and still renders
// immediately.
let lastRenderedKey = null;

async function pollOrder(orderId) {
  try {
    const res = await fetch('/api/checkout/' + encodeURIComponent(orderId));
    if (res.status === 404) {
      renderNotFound();
      return;
    }
    const order = await res.json();
    pollCount++;
    // Keep polling while payment is still pending, so the page updates
    // itself once the webhook confirms the payment — up to roughly
    // 5 minutes, then stop so we don't poll forever. willContinuePolling
    // doubles as the signal for whether this is the final pending_payment
    // render (timedOut) -- same 60-attempt cutoff as before, not changed.
    const willContinuePolling = order.status === 'pending_payment' && pollCount < 60;
    const timedOut = order.status === 'pending_payment' && !willContinuePolling;
    const renderKey = order.status + (timedOut ? ':timedout' : '');
    if (renderKey !== lastRenderedKey) {
      lastRenderedKey = renderKey;
      renderOrder(order, timedOut);
    }
    if (willContinuePolling) {
      pollTimer = setTimeout(() => pollOrder(orderId), 5000);
    }
  } catch (err) {
    console.error('Failed to fetch order status:', err);
    renderNotFound();
  }
}

const orderId = getOrderId();
if (orderId) {
  pollOrder(orderId);
} else {
  renderNotFound();
}
</script>

</body>
</html>
