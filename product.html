<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgewell — Product</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.png">
<style>
@font-face { font-family:'Quicksand'; src:url('/fonts/quicksand-variable.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
:root{ --navy:#1B4B8C; --navy-dark:#123056; --green:#3FA34D; --gray:#6b6b6b; --bg:#FFFFFF; --panel:#F7F8F6; --line:#E4E4E0; }
*{box-sizing:border-box;}
body{ background:var(--bg); color:#1a1a1a; font-family:'Quicksand',sans-serif; font-weight:500; margin:0; }
a{color:inherit;}

/* ---- header (single-row, matches header.html) ---- */
header{
  display:flex; align-items:center; flex-wrap:nowrap; gap:18px;
  padding:12px 20px; max-width:1200px; margin:0 auto;
  position:sticky; top:0; z-index:10;
  background:#fff; border-bottom:1px solid var(--line);
}
.logo-mark{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.logo-word{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.2rem; color:var(--navy); white-space:nowrap; }
.logo-word .well{ color:var(--green); }
.header-nav-links{ display:flex; align-items:center; gap:22px; flex-shrink:0; margin-left:16px; }
.header-nav-link{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; color:var(--navy); text-decoration:none; white-space:nowrap; }
.header-nav-link:hover{ color:var(--green); }
.header-search-row{ position:relative; flex:0 1 240px; min-width:0; max-width:240px; margin-left:auto; }
.header-search-row input{ width:100%; box-sizing:border-box; min-width:0; padding:11px 16px 11px 40px; border-radius:6px; border:1.5px solid var(--line); background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6b6b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center/16px 16px; color:#333; font-size:0.95rem; font-family:'Quicksand',sans-serif; }
.header-search-row input:focus{ outline:none; border-color:var(--navy); }
.search-icon-btn{ position:absolute; top:50%; transform:translateY(-50%); padding:0; margin:0; border:none; background:transparent; cursor:pointer; }
.header-search-row .search-icon-btn{ left:14px; width:16px; height:16px; }
.menu-toggle{ display:flex; align-items:center; gap:22px; flex-shrink:0; position:relative; }
.hamburger{ display:none; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
.hamburger span{ display:block; width:22px; height:2.5px; background:var(--navy); border-radius:2px; }
.nav-overlay{ display:none; position:absolute; top:calc(100% + 12px); right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(18,48,86,0.16); z-index:9999; min-width:170px; padding:6px 0; }
.nav-overlay.open{ display:block; }
.nav-overlay-inner{ display:flex; flex-direction:column; }
.nav-overlay-inner a{ color:var(--navy-dark); font-size:0.9rem; font-weight:700; text-decoration:none; font-family:'Quicksand',sans-serif; padding:11px 18px; }
.nav-overlay-inner a:hover{ background:var(--panel); }
.cart-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; text-decoration:none; }
.cart-icon:hover{ color:var(--green); }
.cart-icon-inner{ display:flex; align-items:center; position:relative; }
.cart-count{ position:absolute; top:-2px; right:-4px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--navy); color:#fff; font-size:0.6rem; font-weight:700; line-height:15px; text-align:center; display:none; font-family:'Quicksand',sans-serif; box-sizing:border-box; }
.cart-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }
.login-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; }
.login-icon:hover{ color:var(--green); }
.login-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }
.logout-icon-btn{ display:flex; align-items:center; color:var(--navy); cursor:pointer; padding:4px; }
.logout-icon-btn:hover{ color:var(--green); }

@media (max-width: 1150px){
  .header-nav-links{ display:none; }
  .hamburger{ display:flex; }
  header{ gap:10px; padding:10px 14px; }
  .header-search-row{ max-width:200px; }
  .logo-word{ font-size:0.95rem; }
}
@media (max-width: 420px){
  header{ gap:6px; padding:8px 10px; }
  .header-search-row{ max-width:160px; }
  .header-search-row input{ padding:10px 12px 10px 34px; font-size:0.8rem; }
  .header-search-row .search-icon-btn{ left:11px; width:14px; height:14px; }
  .menu-toggle{ gap:10px; }
  .cart-icon svg{ width:18px; height:18px; }
  .cart-count{ font-size:0.55rem; min-width:13px; height:13px; line-height:13px; }
  .cart-icon-label{ display:none; }
  .logo-word{ font-size:0.85rem; }
  .login-icon svg{ width:18px; height:18px; }
  .login-icon-label{ display:none; }
}

/* ---- footer (matches shop.html) ---- */
footer.footer-main{margin-top:60px; padding:40px 20px 24px; background:var(--navy-dark); border-top:1px solid var(--line); font-family:'Quicksand',sans-serif;}
.footer-grid{max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:28px; margin-bottom:28px;}
.footer-col{ text-align:left; }
.footer-col h4{color:rgba(255,255,255,0.45); font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin:0 0 14px;}
.footer-col a{display:block; color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.85rem; margin-bottom:8px; overflow-wrap:break-word;}
.footer-col a:hover{ color:var(--green); }
.footer-col p{ color:rgba(255,255,255,0.6); font-size:0.82rem; line-height:1.6; margin:0 0 6px; overflow-wrap:break-word; }
.footer-social{display:flex; gap:10px;}
.footer-social a{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; margin:0;}
.footer-signup-input{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-family:'Quicksand',sans-serif;font-size:0.78rem;margin-bottom:8px;box-sizing:border-box;background:rgba(255,255,255,0.08);color:#fff;}
.footer-signup-input::placeholder{ color:rgba(255,255,255,0.4); }
.footer-signup-btn{width:100%;padding:9px;background:var(--green);color:#fff;border:none;border-radius:6px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:0.78rem;cursor:pointer;}
.footer-signup-btn:hover{ background:#358f41; }
.footer-signup-msg{font-size:0.75rem; margin-top:6px; color:var(--green);}
.footer-legal{max-width:1200px; margin:24px auto 0; font-size:0.7rem; color:rgba(255,255,255,0.5); line-height:1.5; border-top:1px solid rgba(255,255,255,0.15); padding-top:16px;}
.footer-legal a{ color:rgba(255,255,255,0.75); text-decoration:underline; }
.footer-legal a:hover{ color:#fff; }
.footer-info-row{ position:relative; display:flex; align-items:center; min-height:34px; max-width:1200px; margin:0 auto 20px; }
.footer-info-brand{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.footer-logo-mark{ flex-shrink:0; }
.footer-flag-icon{ flex-shrink:0; border-radius:2px; overflow:hidden; margin-left:16px; }
.footer-brand-name{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.8rem; white-space:nowrap; }
.footer-brand-name .forge{ color:#fff; }
.footer-brand-name .well{ color:var(--green); }
.footer-country-label{ font-size:0.72rem; color:rgba(255,255,255,0.6); white-space:nowrap; }
.footer-info-row .footer-catalog-search{ margin-left:auto; }
.footer-catalog-search{ max-width:220px; width:100%; position:relative; }
.footer-catalog-search .search-icon-btn{ left:10px; width:14px; height:14px; }
.footer-catalog-search input{ width:100%; box-sizing:border-box; padding:9px 10px 9px 32px; border-radius:6px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.05) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='0.6'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 10px center/14px 14px; color:#fff; font-size:0.8rem; }
.footer-catalog-search input::placeholder{ color:rgba(255,255,255,0.45); }
.footer-bottom{max-width:1200px; margin:16px auto 0; text-align:center;}
.footer-copyright{font-size:0.75rem; color:rgba(255,255,255,0.5); margin:0 0 12px;}
.footer-legal-links{display:flex; flex-wrap:wrap; justify-content:center; gap:14px;}
.footer-legal-links a{color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.75rem;}
.footer-legal-links a:hover{ color:#fff; text-decoration:underline; }
@media (max-width: 600px) {
  .footer-info-row{ flex-direction:column; align-items:center; gap:14px; min-height:0; }
  .footer-info-brand{ position:static; transform:none; }
  .footer-info-row .footer-catalog-search{ margin-left:0; }
}

/* ---- product page layout ---- */
.product-wrap{max-width:1200px; margin:24px auto 0; padding:0 24px;}
@media (max-width:600px){ .product-wrap{ padding-left:16px; padding-right:16px; } }
.breadcrumb{font-size:0.78rem; color:var(--gray); margin-bottom:18px;}
.breadcrumb a{color:var(--navy); text-decoration:none;}
.product-main{display:grid; grid-template-columns:1fr 1fr; gap:40px;}
@media (max-width:800px){ .product-main{grid-template-columns:1fr;} }

/* gallery-col sized to its own content (the aspect-ratio photo box), not
   stretched to match buy-col -- buy-col's max-height is set to that natural
   height by syncColumnHeights() in the script below, with overflow-y:auto
   here so longer content scrolls internally instead of growing the page
   past the photo. Both are unset/no-op below the 800px breakpoint where
   .product-main above stacks the columns. */
.gallery-col{ align-self:start; }
.buy-col{ overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none; }
.buy-col::-webkit-scrollbar{ display:none; }

.buy-col-kits{ margin-top:20px; }
.buy-col-kits h2{ font-size:1.1rem; color:var(--navy-dark); border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:14px; }
#kits-available-grid{ display:flex; overflow-x:auto; gap:16px; padding:4px 4px 8px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
#kits-available-grid::-webkit-scrollbar{ display:none; }

/* ---- horizontal-scroll indicator (same "faux scrollbar" pattern used on
   home.html's Most Popular row -- shared visual, no max-width/padding here
   since both grids already sit inside a constrained parent) ---- */
.scroll-indicator{ display:none; margin-top:8px; }
.scroll-indicator.visible{ display:block; }
.scroll-indicator-bar{ height:4px; background:var(--line); border-radius:2px; position:relative; overflow:hidden; }
.scroll-indicator-thumb{ position:absolute; top:0; left:0; height:100%; background:var(--navy); border-radius:2px; }

.gallery-main{width:100%; aspect-ratio:1/1; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.gallery-main img{width:100%; height:100%; object-fit:contain;}
.gallery-thumbs{display:flex; gap:10px; margin-top:10px;}
.gallery-thumbs img{width:64px; height:64px; object-fit:cover; border-radius:6px; border:1.5px solid var(--line); cursor:pointer;}
.gallery-thumbs img.active{border-color:var(--navy);}
.gallery-thumb-doc{width:64px; height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:6px; border:1.5px solid var(--line); background:var(--panel); color:var(--navy); text-decoration:none; cursor:pointer;}
.gallery-thumb-doc:hover{border-color:var(--navy);}
.gallery-thumb-doc span{font-size:0.55rem; font-weight:700;}

.purity-badge{display:inline-block; background:var(--green); color:#fff; font-size:0.7rem; font-weight:700; padding:4px 10px; border-radius:20px; margin-bottom:10px;}
.product-title{font-size:1.7rem; color:var(--navy-dark); margin:0 0 10px; font-weight:700;}
.short-description{margin-bottom:16px;}
.short-description-line{font-size:0.88rem; line-height:1.3; color:#333; margin:0 0 2px;}
.short-description-line:last-child{margin-bottom:0;}
.product-price{font-size:1.9rem; color:var(--navy); font-weight:700; margin-bottom:16px;}
.product-price .was{font-size:1rem; color:var(--gray); text-decoration:line-through; font-weight:500; margin-left:8px;}

.size-selector{margin-bottom:18px;}
.size-selector label{display:block; font-size:0.7rem; font-weight:500; color:var(--gray); margin-bottom:8px;}
.size-options{display:flex; flex-wrap:wrap; gap:8px;}
.size-option{padding:9px 16px; border:1.5px solid var(--line); border-radius:6px; cursor:pointer; font-size:0.85rem; font-family:'Quicksand',sans-serif; background:#fff;}
.size-option.active{border-color:var(--navy); background:var(--navy); color:#fff;}
.size-option.disabled{opacity:0.45; cursor:not-allowed; pointer-events:none;}

.qty-row{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.qty-stepper{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:6px; overflow:hidden;}
.qty-stepper button{width:36px; height:36px; background:#fff; border:none; cursor:pointer; font-size:1.1rem; color:var(--navy);}
.qty-stepper input{width:44px; text-align:center; border:none; font-family:'Quicksand',sans-serif; font-weight:700;}

.buy-buttons{display:flex; gap:10px; margin-bottom:20px;}
.btn-add{flex:1; padding:14px; background:#fff; color:var(--navy); border:1.5px solid var(--navy); border-radius:8px; font-weight:700; cursor:pointer; font-family:'Quicksand',sans-serif;}
.btn-buy{flex:1; padding:14px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-family:'Quicksand',sans-serif;}
.btn-add:disabled{opacity:0.5; cursor:not-allowed; pointer-events:none;}

#notify-modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;}
#notify-modal-overlay.active{display:flex;}
#notify-modal{background:#fff; border-radius:12px; max-width:380px; width:90%; padding:28px 24px; position:relative; text-align:center;}
#notify-modal-close{position:absolute; top:10px; right:14px; background:none; border:none; font-size:22px; color:var(--gray); cursor:pointer; line-height:1;}
#notify-modal h3{color:var(--navy); margin:0 0 8px; font-size:1.15rem;}
#notify-modal p{color:var(--gray); font-size:0.85rem; margin:0 0 16px;}
#notify-modal-input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-family:'Quicksand',sans-serif; font-size:0.9rem; margin-bottom:8px; box-sizing:border-box;}
#notify-modal-error{color:#c0392b; font-size:0.78rem; min-height:16px; margin-bottom:6px;}
#notify-modal-submit{width:100%; padding:12px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-family:'Quicksand',sans-serif;}

.trust-note{font-size:0.75rem; color:var(--gray); margin-top:20px; padding-top:16px; border-top:1px solid var(--line); margin-bottom:10px;}
.trust-badges{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:6px;}
.trust-badge{display:flex; align-items:center; gap:8px; font-size:0.75rem; color:var(--gray);}
.trust-badge svg{flex-shrink:0; width:16px; height:16px; color:var(--navy);}

.coa-list{margin-top:20px; padding-top:16px; border-top:1px solid var(--line);}
.coa-list h3{font-size:0.85rem; color:var(--navy-dark); margin:0 0 10px; font-weight:700;}
.coa-list-item{display:flex; flex-direction:column; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px;}
.coa-list-item:last-child{margin-bottom:0;}
.coa-list-item-info{display:flex; flex-direction:column; gap:2px; min-width:0;}
.coa-list-item-lot{font-weight:700; color:var(--navy-dark); font-size:0.82rem;}
.coa-list-item-date{color:var(--gray); font-size:0.75rem;}
.coa-list-item .btn-buy{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;}
.coa-list-item .btn-buy svg{flex-shrink:0; width:15px; height:15px;}

#coa-viewer-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;}
#coa-viewer-overlay.active{display:flex;}
#coa-viewer-modal{background:#fff; border-radius:12px; width:90%; max-width:900px; height:85vh; position:relative; overflow:hidden; display:flex; flex-direction:column;}
#coa-viewer-toolbar{display:flex; align-items:center; justify-content:center; gap:12px; padding:10px 50px 10px 14px; border-bottom:1px solid var(--line); flex-shrink:0;}
#coa-viewer-toolbar button{width:32px; height:32px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--navy); font-size:1.1rem; font-weight:700; cursor:pointer; line-height:1; font-family:'Quicksand',sans-serif;}
#coa-viewer-toolbar button:hover{background:var(--panel);}
#coa-viewer-zoom-level{font-size:0.82rem; color:var(--gray); min-width:44px; text-align:center;}
#coa-viewer-close{position:absolute; top:10px; right:14px; background:#fff; border:none; font-size:22px; color:var(--gray); cursor:pointer; line-height:1; z-index:1; width:32px; height:32px; border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,0.2);}
#coa-viewer-frame-wrap{flex:1; overflow:auto; background:var(--panel);}
#coa-viewer-frame{width:100%; height:100%; border:none; display:block; transform-origin:top center; transition:transform 0.15s ease;}

.product-section{max-width:1200px; margin:36px auto 0; padding:0 24px;}
@media (max-width:600px){ .product-section{ padding-left:16px; padding-right:16px; } }
.product-section h2{font-size:1.1rem; color:var(--navy-dark); border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:14px;}
.product-section h3{font-size:0.95rem; color:var(--navy-dark); margin:22px 0 10px;}
.product-section h3:first-of-type{margin-top:0;}
.research-text{font-size:0.88rem; line-height:1.7; color:#333;}

table.tech-table{width:100%; border-collapse:collapse; font-size:0.85rem; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
table.tech-table th, table.tech-table td{text-align:left; padding:10px 12px; border:1px solid var(--line);}
table.tech-table th{width:220px; color:var(--gray); font-weight:700;}
table.tech-table tr:nth-child(even){background:var(--panel);}

.ruo-note{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-top:20px;}
.ruo-note p{ font-size:0.8rem; line-height:1.6; color:var(--gray); margin:0 0 10px; }
.ruo-note p:last-child{ margin-bottom:0; }

/* ---- Suggested Essentials (styled to match home/shop's Most Popular cards) ---- */
#suggested-essentials-grid{ display:flex; overflow-x:auto; gap:16px; padding:4px 4px 8px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
#suggested-essentials-grid::-webkit-scrollbar{ display:none; }
.essential-card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 12px 12px; flex:0 0 150px; min-width:150px; scroll-snap-align:start; cursor:pointer; display:flex; flex-direction:column; }
.essential-card .vial{ width:100%; aspect-ratio:1/1; border-radius:4px; background:#fff; margin-bottom:10px; display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid var(--line); }
.essential-card .vial img{ width:100%; height:100%; object-fit:contain; }
.essential-card h3{ font-weight:700; font-size:0.85rem; margin:0 0 4px; color:#141414; text-align:center; }
.essential-card .price-row{ display:flex; flex-direction:column; gap:8px; margin-top:auto; padding-top:8px; }
.essential-card .price{ font-weight:700; font-size:0.82rem; color:var(--navy-dark); text-align:center; }
.essential-card .price .was{ font-weight:500; font-size:0.72rem; color:var(--gray); text-decoration:line-through; margin-left:5px; }
.essential-card .add-btn{ display:block; width:100%; text-align:center; font-size:0.7rem; font-weight:700; padding:8px; border-radius:6px; border:1.5px solid #6B4FA0; color:#6B4FA0; background:#fff; cursor:pointer; font-family:'Quicksand',sans-serif; }

.loading-state, .error-state{max-width:1200px; margin:60px auto; padding:0 24px; text-align:center; color:var(--gray);}

</style>
</head>
<body>

<div id="header-placeholder"></div>



<div id="product-root">
  <div class="loading-state" id="product-loading">Loading product...</div>
</div>

<div id="footer-placeholder"></div>

<script>
let allProducts = [];
// Fetched in parallel with the product catalog in initProductPage() below;
// shared canonical text also editable via the admin Content tab and shown
// verbatim on about-us.html, contact.html, terms.html, and
// ruo-agreement.html.
let disclaimerBody = '';
function buildDisclaimerParagraphsHtml(text) {
  return (text || '').split('\n\n').filter(function(p) { return p.trim(); })
    .map(function(p) { return '<p>' + p + '</p>'; }).join('');
}
let cart = JSON.parse(localStorage.getItem('forgewell_cart') || '[]');

async function catalogSearchJump(query) {
  query = query.trim().toLowerCase();
  if (!query) return;
  await productsReady;
  const match = allProducts.find(p => {
    const base = (p.name || '').replace(/\s*\(?\d+(\.\d+)?\s?(mg|mcg|iu|ml)\)?\s*$/i, '').trim().toLowerCase();
    return base === query || base.indexOf(query) !== -1;
  });
  if (match) {
    window.location.href = '/product.html?id=' + encodeURIComponent(match.id);
  } else {
    window.location.href = '/shop.html#tabs';
  }
}

// Wires up all header/footer interactivity. Runs only after header.html and
// footer.html have been fetched and injected below -- their elements don't
// exist in the DOM before then.
function wireHeaderFooter() {
  var footerSearchInput = document.getElementById('footer-catalog-search-input');
  if (footerSearchInput) {
    footerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var footerSearchIconBtn = document.getElementById('footer-search-icon-btn');
  if (footerSearchIconBtn && footerSearchInput) {
    footerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var headerSearchInput = document.getElementById('header-catalog-search-input');
  if (headerSearchInput) {
    headerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(headerSearchInput.value);
    });
  }
  var headerSearchIconBtn = document.getElementById('header-search-icon-btn');
  if (headerSearchIconBtn && headerSearchInput) {
    headerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(headerSearchInput.value);
    });
  }

  var hamBtn = document.getElementById('hamburger-btn');
  var overlay = document.getElementById('nav-overlay');
  if (hamBtn && overlay) {
    hamBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.toggle('open');
    });
  }
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target.closest('a')) overlay.classList.remove('open');
    });
    document.addEventListener('click', function(e) {
      if (overlay.classList.contains('open') && !overlay.contains(e.target)) {
        overlay.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') overlay.classList.remove('open');
    });
  }

  // Checks whether the person is logged in and updates the header's account
  // icon accordingly -- shows "Hi, [name]" linking to order history if
  // logged in, "Sign In" linking to the login/signup page otherwise. Runs
  // on every page that shares this header.
  var loginIcon = document.getElementById('account-icon');
  if (loginIcon) {
    fetch('/api/auth/me', { credentials: 'include' })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(customer) {
        if (customer) {
          loginIcon.href = '/orders.html';
          loginIcon.title = 'My Account (' + customer.email + ')';
          // Name wasn't always required at signup -- older accounts can
          // still have a null name, so fall back to the email's local-part
          // rather than showing a blank/broken greeting.
          var displayName = customer.name || customer.email.split('@')[0];
          var labelEl = loginIcon.querySelector('.login-icon-label');
          if (labelEl) labelEl.textContent = 'Hi, ' + displayName;

          function doLogout() {
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
              .then(function() { window.location.href = '/shop.html'; });
          }

          // Icon-only sign-out control next to the account icon -- only
          // created/shown once logged in, so it adds no width to the
          // header's tightly-tuned breakpoint math for the (far more
          // common) logged-out state. Gives desktop-width visitors a
          // direct sign-out path: today the hamburger dropdown below
          // (the only other place "Log Out" lives) is hidden above 1150px.
          var logoutIconBtn = document.getElementById('logout-icon-btn');
          if (logoutIconBtn) {
            logoutIconBtn.style.display = 'flex';
            logoutIconBtn.addEventListener('click', function(e) {
              e.preventDefault();
              doLogout();
            });
          }

          var navInner = document.querySelector('.nav-overlay-inner');
          if (navInner && !document.getElementById('nav-logout-link')) {
            var logoutLink = document.createElement('a');
            logoutLink.href = '#';
            logoutLink.id = 'nav-logout-link';
            logoutLink.textContent = 'Log Out';
            logoutLink.addEventListener('click', function(e) {
              e.preventDefault();
              doLogout();
            });
            navInner.appendChild(logoutLink);
          }
        }
      })
      .catch(function() { /* not logged in or request failed -- leave icon pointing to /login.html */ });
  }

  var signupBtn = document.getElementById('footer-signup-btn');
  if (signupBtn) {
    signupBtn.addEventListener('click', async () => {
      const input = document.getElementById('footer-email-input');
      const msg = document.getElementById('footer-signup-msg');
      const email = input.value.trim();
      if (!email || email.indexOf('@') === -1) {
        msg.style.color = '#c0392b';
        msg.textContent = 'Please enter a valid email.';
        return;
      }
      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email: email})
        });
        const data = await res.json();
        msg.style.color = '#3FA34D';
        msg.textContent = data.alreadySubscribed
          ? 'Already signed up — code: ' + data.discountCode
          : 'Success! Your code: ' + data.discountCode;
        input.value = '';
      } catch (err) {
        msg.style.color = '#c0392b';
        msg.textContent = 'Something went wrong. Please try again.';
      }
    });
  }

  // Restores the header's cart count from localStorage now that the header
  // actually exists in the DOM (it didn't yet when updateCartIcon() first
  // ran further down this script).
  updateCartIcon();
}

Promise.all([
  fetch('/header.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('header-placeholder').innerHTML = html;
  }),
  fetch('/footer.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('footer-placeholder').innerHTML = html;
  })
]).then(wireHeaderFooter).catch(function(err) {
  console.error('Failed to load shared header/footer', err);
});

function saveCart() {
  localStorage.setItem('forgewell_cart', JSON.stringify(cart));
  updateCartIcon();
}

function updateCartIcon() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById('cart-count');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }
}

function addToCart(productId) {
  const product = allProducts.find(p => p.id === productId);
  if (!product) return;
  const existing = cart.find(i => i.productId === productId);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ productId: product.id, name: product.name, price: (product.effectivePrice != null ? product.effectivePrice : product.price), qty: 1 });
  }
  saveCart();
}

// Visual confirmation that an Add to Cart click landed, shown directly on
// the clicked element itself rather than a toast -- entry points range from
// tiny in-grid buttons to the large dedicated product-page button, and an
// in-place swap works the same way regardless of where/how big the button
// is. Styles via direct inline JS (not a CSS class) because some of these
// buttons already carry their own inline style (category-colored outline on
// shop/home cards) that a stylesheet class couldn't override without
// !important -- capturing/restoring the original style attribute string
// works uniformly whether or not one was already present. Returns false
// (caller should skip the actual addToCart call) while a previous flash on
// the same element is still cooling down, so a rapid double-click can't
// silently add twice.
function flashAddedFeedback(el) {
  if (el.dataset.adding === 'true') return false;
  el.dataset.adding = 'true';
  var originalText = el.textContent;
  var originalStyle = el.getAttribute('style');
  el.textContent = '✓ Added!';
  el.style.background = 'var(--green)';
  el.style.borderColor = 'var(--green)';
  el.style.color = '#fff';
  setTimeout(function() {
    el.textContent = originalText;
    if (originalStyle) {
      el.setAttribute('style', originalStyle);
    } else {
      el.removeAttribute('style');
    }
    el.dataset.adding = 'false';
  }, 1200);
  return true;
}

updateCartIcon();

</script>

<script>
// ---- Product page logic ----
// Depends on the cart script above for: allProducts, cart, addToCart(),
// saveCart(), updateCartIcon().

function getQueryParam(name) {
  var params = new URLSearchParams(window.location.search);
  return params.get(name);
}

// Strips a trailing size/dose token like "5mg", "(5mg)", "10 mcg", "500iu"
// to get the base product label used to group sibling size-tier rows.
// This is a string match against `name`, not a real foreign key (base_product_id
// is empty for simple tiered products) -- confirmed in the DB this session.
function baseLabel(name) {
  if (!name) return '';
  return name.replace(/\s*\(?\d+(\.\d+)?\s?(mg|mcg|iu|ml)(?:\s*\/\s*\d+(\.\d+)?\s?(mg|mcg|iu|ml))*\)?\s*$/i, '').trim();
}

// Kit names are formatted "<Family> Kit (<dosage>, <N>-Pack)" -- the
// ", N-Pack" text before the closing paren means baseLabel()'s regex never
// matches, so a kit's sibling variants (other dosage/pack-size combos)
// never grouped and this page's "SELECT MG" selector never appeared for
// kits. Strip the whole trailing parenthetical instead, but only for
// kits -- broadening baseLabel() itself would also wrongly merge unrelated
// non-kit products that happen to end in parens.
function groupKeyFor(p) {
  return p.category === 'kit'
    ? p.name.replace(/\s*\([^)]*\)\s*$/, '').trim()
    : baseLabel(p.name);
}

// A kit's base_product_id is a stem (e.g. 'bpc-157'), not a literal row id
// -- the same matching rule findRelatedKits() already uses in the other
// direction (vial -> its kits) applies here too: a vial backs this kit if
// its id is the stem exactly or starts with "<stem>-", AND its dosage
// matches. Verified against the live catalog: 65 of 68 kits resolve to
// exactly one backing vial this way, 0 resolve to more than one. The 3
// that resolve to none are expected, not bugs -- klow-kit has no
// base_product_id at all (multi-bioregulator blend, no single base), and
// mt-2-kit/pt-141-kit point at mt-2/pt-141, which are 2 of the 5
// EXCLUDED_COMPONENT_IDS ($0, never sold standalone) -- MT-2 and PT-141
// are only ever sold via their kits, so there's genuinely no vial to check.
function findBackingVial(product) {
  if (product.category !== 'kit' || !product.base_product_id) return null;
  var base = product.base_product_id;
  return allProducts.filter(function(p) {
    return p.category !== 'kit' &&
      (p.id === base || p.id.indexOf(base + '-') === 0) &&
      p.dosage === product.dosage;
  })[0] || null;
}

// stock_status stays a simple, directly-set manual flag on every row
// (including kits) -- this doesn't write or sync anything, it just also
// checks the kit's backing vial (if any) at read time, so a kit never
// shows as buyable when the thing it's actually built from isn't
// available, without needing a trigger or any risk of stale propagated
// state.
function isEffectivelyOutOfStock(product) {
  if (product.stock_status === 'out_of_stock') return true;
  var vial = findBackingVial(product);
  return !!vial && vial.stock_status === 'out_of_stock';
}

// Extracts the leading number from a dosage/pack-size string for sorting
// (e.g. "10mg" -> 10, "5-Pack" -> 5). Unparsable values sort last instead
// of throwing.
function parseLeadingNumber(text) {
  var m = String(text || '').match(/(\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : Infinity;
}

// Siblings are already grouped by baseLabel(), so they always share one unit
// (mg/mcg/iu/ml) -- comparing the leading number alone is enough to order
// them correctly.
function parseDosageValue(product) {
  return parseLeadingNumber(product.dosage || product.name);
}

function resolveImagePath(path) {
  if (!path) return null;
  if (path.indexOf('http') === 0) return path;
  // DB stores paths like "images/glutathione.png" -- relative to site root.
  // Actual files are served as WebP (much smaller); the DB only ever knows
  // about the .png name, so the swap happens here rather than at the source.
  path = path.replace(/\.png$/i, '.webp');
  if (path.indexOf('/') === 0) return path;
  return '/' + path;
}

// Same site-root-relative convention as resolveImagePath(), minus the
// image-specific .png->.webp swap -- product_coas.coa_path is a PDF path,
// not an image.
function resolveCoaPath(path) {
  if (!path) return null;
  if (path.indexOf('http') === 0) return path;
  if (path.indexOf('/') === 0) return path;
  return '/' + path;
}

// ---- Breadcrumb trail ----
// Tracked via a `trail` query param (comma-separated product ids of every
// product hopped through via Suggested Essentials/Kits Available to reach
// this one) rather than sessionStorage -- the URL already fully determines
// page state everywhere else on this page (?id=...), so back/forward and
// reload work for free without a popstate listener, and separate tabs
// can't cross-contaminate each other's trail the way a shared
// sessionStorage key could. Ids are always plain slugs (no commas), so no
// extra encoding is needed.
var TRAIL_MAX_LENGTH = 6;

function getTrailIds() {
  var params = new URLSearchParams(window.location.search);
  var raw = params.get('trail');
  if (!raw) return [];
  return raw.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
}

function buildProductUrl(id, trailIds) {
  var url = '/product.html?id=' + encodeURIComponent(id);
  if (trailIds && trailIds.length) {
    url += '&trail=' + trailIds.map(encodeURIComponent).join(',');
  }
  return url;
}

// Appends the current product to its own trail to produce the trail for a
// product being navigated *to*. If that target id is already somewhere in
// the trail (or is the current product), truncates back to before that
// point instead of appending -- so bouncing back and forth between two
// products' suggestion sections can't grow the trail (or the URL) without
// bound. Also hard-capped at TRAIL_MAX_LENGTH as a defensive backstop.
function nextTrailFor(targetId, currentTrail, currentProductId) {
  var extended = currentTrail.concat([currentProductId]);
  var loopIndex = extended.indexOf(targetId);
  if (loopIndex !== -1) return extended.slice(0, loopIndex);
  if (extended.length > TRAIL_MAX_LENGTH) {
    extended = extended.slice(extended.length - TRAIL_MAX_LENGTH);
  }
  return extended;
}

// Resolves each trail id to its product, skipping any that no longer exist
// (deleted/renamed since the link was generated) rather than breaking the
// whole breadcrumb.
function buildBreadcrumbHtml(product, trailIds, products) {
  var crumbs = ['<a href="/shop.html">Shop</a>'];
  var precedingIds = [];
  trailIds.forEach(function(id) {
    var p = products.find(function(x) { return x.id === id; });
    if (p) {
      crumbs.push('<a href="' + buildProductUrl(id, precedingIds) + '">' + p.name + '</a>');
    }
    precedingIds.push(id);
  });
  crumbs.push(product.name);
  // "/" (not "›") would collide with product names that legitimately
  // contain a slash of their own (e.g. "CJC-1295/Ipamorelin (High)"),
  // making a 2-level trail read as a 3-level one. No catalog name uses
  // this glyph, so it can't collide the same way.
  return '<div class="breadcrumb">' + crumbs.join(' › ') + '</div>';
}

// ---- Suggested Essentials ----
// Only shown under peptide/amino/kit products -- essentials themselves (and
// anything uncategorized) don't get an essentials upsell.
var ESSENTIAL_TRIGGER_CATEGORIES = ['peptide', 'amino', 'kit'];
var SUGGESTED_ESSENTIAL_NAMES = ['Acetic Acid Water', 'Bacteriostatic Water', 'Insulin Needles', 'Peptide Carrier'];

// baseLabel() above only strips *numeric* dosage/size tokens (mg/mcg/iu/ml) --
// confirmed it leaves non-numeric variant suffixes like "(Large Pack)" /
// "(Small Pack)" untouched. Essentials like Insulin Needles use pack-size
// suffixes, not mg/mL, so matching them needs a broader strip: any trailing
// "(...)" annotation, numeric or not. Kept separate from baseLabel() rather
// than broadening it, since baseLabel() is also used for strict dosage-sibling
// grouping elsewhere and that shouldn't start swallowing arbitrary parens.
function stripTrailingAnnotation(name) {
  if (!name) return '';
  return name.replace(/\s*\([^)]*\)\s*$/, '').trim();
}

// Both Insulin Needles pack sizes (and any other multi-variant essential
// here) are shown, not just one -- so this returns every matching product,
// not a single pick. Multiple variants of the same essential are sorted
// cheapest-first since pack-size suffixes have no numeric token to sort by
// (unlike parseDosageValue()'s mg/mcg/iu/ml sizes).
function findSuggestedEssentials(product, products) {
  if (ESSENTIAL_TRIGGER_CATEGORIES.indexOf(product.category) === -1) return [];
  var namesLower = SUGGESTED_ESSENTIAL_NAMES.map(function(n) { return n.toLowerCase(); });
  var matches = products.filter(function(p) {
    if (p.id === product.id) return false;
    if (!resolveImagePath(p.image_path)) return false; // no image, no listing
    return namesLower.indexOf(stripTrailingAnnotation(p.name).toLowerCase()) !== -1;
  });
  matches.sort(function(a, b) {
    var groupA = namesLower.indexOf(stripTrailingAnnotation(a.name).toLowerCase());
    var groupB = namesLower.indexOf(stripTrailingAnnotation(b.name).toLowerCase());
    if (groupA !== groupB) return groupA - groupB;
    return (a.price || 0) - (b.price || 0); // cheapest/smallest pack first within the same essential
  });
  return matches;
}

// Shared by both upsell-card builders below (Suggested Essentials, Kits
// Available) -- same onSaleNow/effectivePrice fields the main product-page
// price (priceHtml, above) reads, just formatted for the smaller card.
function buildCompactPriceLabel(p) {
  if (!(p.price > 0)) return '$XX';
  if (p.onSaleNow) {
    return '$' + Number(p.effectivePrice).toFixed(2) + '<span class="was">$' + Number(p.price).toFixed(2) + '</span>';
  }
  return '$' + Number(p.price).toFixed(2);
}

function buildEssentialCardHtml(p) {
  var imgUrl = resolveImagePath(p.image_path);
  var priceLabel = buildCompactPriceLabel(p);
  return '<div class="essential-card" data-product-id="' + p.id + '">' +
    '<div class="vial"><img src="' + imgUrl + '" alt="' + p.name + '" loading="lazy" onerror="this.closest(\'.essential-card\').remove()"></div>' +
    '<h3>' + p.name + '</h3>' +
    '<div class="price-row">' +
      '<div class="price">' + priceLabel + '</div>' +
      '<button type="button" class="add-btn" data-add-essential-id="' + p.id + '">Add to Cart</button>' +
    '</div>' +
  '</div>';
}

function buildSuggestedEssentialsSection(product, products) {
  var matches = findSuggestedEssentials(product, products);
  if (matches.length === 0) return '';
  return '<div class="product-section">' +
    '<h2>Suggested Essentials</h2>' +
    '<div id="suggested-essentials-grid">' + matches.map(buildEssentialCardHtml).join('') + '</div>' +
    '<div class="scroll-indicator" id="suggested-essentials-scroll-indicator">' +
      '<div class="scroll-indicator-bar"><div class="scroll-indicator-thumb" id="suggested-essentials-scroll-thumb"></div></div>' +
    '</div>' +
  '</div>';
}

// ---- Kits Available ----
// Kit products carry a base_product_id pointing at the non-kit product they
// bundle (e.g. "bpc-157-kit-10-pack" -> base_product_id "bpc-157"). That
// base isn't always a real product id on its own -- dosage/tier-variant
// products suffix it ("bpc-157-5mg", "cjc-1295-ipamorelin-high"), so a kit
// applies to every sibling sharing that base, not just an exact id match.
// Confirmed against the live catalog: base_product_id is always either an
// exact product id (single-variant products like "cagrilintide") or that
// same string plus a "-<suffix>" a sibling's id starts with -- covers every
// suffix style in use (mg/mcg, high/low, bare) without needing to know
// which one a given base uses.
//
// Also filtered by dosage, matching the currently-viewed variant exactly
// (e.g. BPC-157 10mg only surfaces the two 10mg kit rows, not the 5mg
// ones) -- confirmed against the live catalog that a kit's dosage is
// always stored in the exact same string format as its base product's
// (including combo strings like "20mg/20mg" for blends), so plain
// equality is enough; no normalization needed. Switching the "SELECT MG"
// selector navigates to a whole new product.html?id=... page (see the
// size-option click handler), so `product` here is always already the
// specific dosage variant being viewed -- no separate selection state to
// track beyond product.dosage itself.
function findRelatedKits(product, products) {
  if (product.category === 'kit') return []; // kits don't suggest other kits for themselves
  return products.filter(function(p) {
    if (p.category !== 'kit') return false;
    if (!resolveImagePath(p.image_path)) return false; // no image, no listing
    if (p.dosage !== product.dosage) return false;
    var base = p.base_product_id;
    if (!base) return false;
    return product.id === base || product.id.indexOf(base + '-') === 0;
  }).sort(function(a, b) { return (a.price || 0) - (b.price || 0); });
}

function buildKitCardHtml(p) {
  var imgUrl = resolveImagePath(p.image_path);
  var priceLabel = buildCompactPriceLabel(p);
  return '<div class="essential-card" data-product-id="' + p.id + '">' +
    '<div class="vial"><img src="' + imgUrl + '" alt="' + p.name + '" loading="lazy" onerror="this.closest(\'.essential-card\').remove()"></div>' +
    '<h3>' + p.name + '</h3>' +
    '<div class="price-row">' +
      '<div class="price">' + priceLabel + '</div>' +
      '<button type="button" class="add-btn" data-add-kit-id="' + p.id + '">Add to Cart</button>' +
    '</div>' +
  '</div>';
}

function buildKitsAvailableSection(product, products) {
  var matches = findRelatedKits(product, products);
  if (matches.length === 0) return '';
  return '<div class="buy-col-kits">' +
    '<h2>Kits Available</h2>' +
    '<div id="kits-available-grid">' + matches.map(buildKitCardHtml).join('') + '</div>' +
    '<div class="scroll-indicator" id="kits-available-scroll-indicator">' +
      '<div class="scroll-indicator-bar"><div class="scroll-indicator-thumb" id="kits-available-scroll-thumb"></div></div>' +
    '</div>' +
  '</div>';
}

function renderError(message) {
  document.getElementById('product-root').innerHTML =
    '<div class="error-state"><h2>' + message + '</h2>' +
    '<p><a href="/shop.html">Return to shop</a></p></div>';
}

function renderProduct(product, siblings) {
  var root = document.getElementById('product-root');
  var imgUrl = resolveImagePath(product.image_path);
  var trailIds = getTrailIds();

  if (!imgUrl) {
    // Per the site's image-matching rule: no image file, no listing.
    renderError('This product page is not yet available.');
    return;
  }

  // Short description, shown between the title and price -- plain paragraph
  // text now, not a bulleted list. product.bullets is normally a single
  // \n-separated string of short discrete facts (e.g. "Research use only\n
  // Packaged in a 3mL vial"), not one flowing sentence, so each line still
  // gets its own <p> rather than joining them into one run-on paragraph.
  var shortDescriptionLines = [];
  if (Array.isArray(product.bullets)) {
    shortDescriptionLines = product.bullets;
  } else if (typeof product.bullets === 'string' && product.bullets.trim()) {
    shortDescriptionLines = product.bullets.split('\n');
  }
  shortDescriptionLines = shortDescriptionLines.map(function(line) { return line.trim(); }).filter(Boolean);
  // "Research use only" is dropped here -- it's redundant with the
  // highlighted disclaimer box above, which already covers it -- and
  // "Not for human use" always closes the list instead, whenever there
  // was other short-description content to begin with.
  if (shortDescriptionLines.length) {
    shortDescriptionLines = shortDescriptionLines.filter(function(line) {
      return line.toLowerCase() !== 'research use only';
    });
    shortDescriptionLines.push('Not for human use');
  }
  var shortDescriptionHtml = shortDescriptionLines
    .map(function(line) { return '<p class="short-description-line">' + line + '</p>'; })
    .join('');
  if (shortDescriptionHtml) {
    shortDescriptionHtml = '<div class="short-description">' + shortDescriptionHtml + '</div>';
  }

  // Two independent axes, not one pill per sibling row -- a kit family
  // varies along both dosage AND pack size (e.g. Tesamorelin Kit is
  // 5/10/20mg x 5-Pack/10-Pack, 6 rows), so a naive one-pill-per-row model
  // shows duplicate dosage labels with no way to pick a pack size. For
  // non-kit products pack_size is always null on every sibling, so the
  // Pack Size axis below simply never has a real value and that selector
  // never renders -- this is one shared model for both cases, not a
  // kit-specific branch.
  //
  // A generic, non-measurement placeholder ('vial' for dosage, 'pack' for
  // pack_size on single-variant kits) has nothing real to show under a
  // "SELECT MG"/"SELECT PACK SIZE" label -- every real value on either
  // axis starts with a digit ('10mg', '5mg/5mg', '75iu', '5-Pack'), every
  // placeholder doesn't, so that's the check both axes use. Matches the
  // same "vial/pack isn't real" convention already used by
  // scripts/generate-dosage-images.js, which omits the dosage box on the
  // product image itself for the same reason.
  function isRealAxisValue(v) {
    return !!v && /^\d/.test(v);
  }
  function dedupedSorted(values) {
    var seen = [];
    values.forEach(function(v) {
      if (isRealAxisValue(v) && seen.indexOf(v) === -1) seen.push(v);
    });
    return seen.sort(function(a, b) { return parseLeadingNumber(a) - parseLeadingNumber(b); });
  }
  var dosageValues = dedupedSorted(siblings.map(function(s) { return s.dosage; }));
  var packSizeValues = dedupedSorted(siblings.map(function(s) { return s.pack_size; }));

  // Shared by both selectors, and deliberately symmetric -- either axis's
  // current selection can disable options in the other, not just
  // pack-size-given-dosage, so neither selector can ever lead to a
  // nonexistent row no matter which one a visitor touches first. For a
  // single-axis family (packSize always null on every sibling) this
  // reduces to a plain dosage match and never disables anything. Also
  // disables a combo whose row exists but is a kit that's effectively out
  // of stock (its own flag, or its backing vial's) -- scoped to kits only,
  // so a plain peptide's sibling pills don't grey out based on another
  // tier's stock (only that tier's own buy buttons react to its own flag).
  function comboAvailable(dosage, packSize) {
    var match = siblings.filter(function(s) { return s.dosage === dosage && s.pack_size === packSize; })[0];
    if (!match) return false;
    if (match.category === 'kit' && isEffectivelyOutOfStock(match)) return false;
    return true;
  }

  function buildSelectorHtml(label, id, values, activeValue, otherActiveValue, isPackAxis) {
    return '<div class="size-selector"><label>' + label + '</label><div class="size-options" id="' + id + '">' +
      values.map(function(v) {
        var active = v === activeValue;
        var available = isPackAxis ? comboAvailable(otherActiveValue, v) : comboAvailable(v, otherActiveValue);
        var cls = 'size-option' + (active ? ' active' : '') + (available ? '' : ' disabled');
        return '<div class="' + cls + '" data-value="' + v + '">' + v + '</div>';
      }).join('') + '</div></div>';
  }

  var sizeOptionsHtml = '';
  if (dosageValues.length >= 1) {
    sizeOptionsHtml += buildSelectorHtml('SELECT MG', 'mg-options', dosageValues, product.dosage, product.pack_size, false);
  }
  if (packSizeValues.length >= 1) {
    sizeOptionsHtml += buildSelectorHtml('SELECT PACK SIZE', 'pack-options', packSizeValues, product.pack_size, product.dosage, true);
  }

  // A kit never gets its own COA upload -- it's just a discounted bundle of
  // a real vial product (see admin.html's product picker, which excludes
  // kits entirely for this reason) -- so its own spec_* fields are always
  // empty. Reuse findBackingVial() (the same "kit inherits X from its
  // vial" resolution already used for stock status below) so a kit's page
  // shows its backing vial's actual COA data instead of nothing. Falls
  // back to the kit's own record (which will correctly show nothing) for
  // the few kits with no resolvable vial.
  var coaSourceProduct = (product.category === 'kit' ? findBackingVial(product) : null) || product;

  // Current-Batch Specifications + Analytical Results together make up the
  // Quality & Testing section (see render below) -- both are sourced from
  // product_specs, a denormalized snapshot of whichever product_coas row is
  // latest by batch_date (kept in sync by the backend on every COA
  // upload/edit/delete). Product and Application are always present, and
  // spec_purity always has a '99%' fallback baked into the API's join even
  // before any real COA exists, so both tables always render at least one
  // row; every other field follows the same "only show it if present" rule
  // techFields used, so a product with no COA yet just omits those rows.
  var batchSpecRows = '';
  var batchSpecFields = [
    ['Product', product.name],
    ['Appearance', coaSourceProduct.spec_appearance],
    ['Current lot', coaSourceProduct.spec_current_lot],
    ['Net Content Average', coaSourceProduct.spec_net_content_average],
  ];
  batchSpecFields.forEach(function(f) {
    if (f[1]) batchSpecRows += '<tr><th>' + f[0] + '</th><td>' + f[1] + '</td></tr>';
  });

  var analyticalRows = '';
  var analyticalFields = [
    ['Purity (HPLC-UV)', coaSourceProduct.spec_purity],
    ['Endotoxin Threshold', coaSourceProduct.spec_endotoxin_threshold],
    ['Microbial Analysis (PCR)', coaSourceProduct.spec_microbial_analysis],
    ['Fentanyl Screen', coaSourceProduct.spec_fentanyl_screen],
    ['Application', 'Laboratory research use only'],
  ];
  analyticalFields.forEach(function(f) {
    if (f[1]) analyticalRows += '<tr><th>' + f[0] + '</th><td>' + f[1] + '</td></tr>';
  });

  var verificationNote = '';
  if (product.data_status && product.data_status !== 'researched') {
    verificationNote = '<p style="font-size:0.75rem;color:var(--gray);margin-top:8px;">Technical data for this product is pending final verification.</p>';
  }

  // .was is pre-existing CSS (a struck-through secondary price, styled
  // smaller/gray with margin-left so it reads as "was $X" after the
  // current price) that had never been wired up to any JS before -- this
  // is the only place it's populated.
  var priceHtml;
  if (product.price > 0) {
    priceHtml = product.onSaleNow
      ? '$' + Number(product.effectivePrice).toFixed(2) + '<span class="was">$' + Number(product.price).toFixed(2) + '</span>'
      : '$' + Number(product.price).toFixed(2);
  } else {
    priceHtml = 'Price coming soon';
  }
  var suggestedEssentialsHtml = buildSuggestedEssentialsSection(product, allProducts);
  var kitsAvailableHtml = buildKitsAvailableSection(product, allProducts);

  // stock_status is a manually-set flag (see products.stock_status), not a
  // count -- anything other than the literal string 'out_of_stock' (including
  // it being missing entirely) is treated as in-stock, so a data gap never
  // blocks a sale. For a kit, also effectively out of stock if the vial
  // it's built from is (isEffectivelyOutOfStock reduces to the plain flag
  // check for non-kits, so this is a strict superset of the old check).
  var isOutOfStock = isEffectivelyOutOfStock(product);
  // "Notify When In Stock" takes over the Buy Now button's slot (see
  // buy-buttons markup below) rather than being a separate button, so this
  // only needs to build the modal itself.
  var notifyModalHtml = '';
  if (isOutOfStock) {
    notifyModalHtml =
      '<div id="notify-modal-overlay">' +
        '<div id="notify-modal">' +
          '<button type="button" id="notify-modal-close" aria-label="Close">&times;</button>' +
          '<div id="notify-modal-step-form">' +
            '<h3>Notify Me</h3>' +
            '<p>We&rsquo;ll email you when this item is back in stock.</p>' +
            '<input type="email" id="notify-modal-input" placeholder="you@example.com">' +
            '<div id="notify-modal-error"></div>' +
            '<button type="button" id="notify-modal-submit">Notify Me</button>' +
          '</div>' +
          '<div id="notify-modal-step-success" style="display:none;">' +
            '<h3>You&rsquo;re All Set</h3>' +
            '<p>We&rsquo;ll email you when this item is back in stock.</p>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  // Full-width section below product-main, placed after Suggested Essentials
  // (not inside buy-col) -- uses .product-section like Suggested Essentials
  // and Technical Data below it.
  var descriptionHtml =
    '<div class="product-section">' +
      '<h2>Description</h2>' +
      '<div class="research-text">' + (product.research_use || '') + '</div>' +
      verificationNote +
    '</div>';

  root.innerHTML =
    '<div class="product-wrap">' +
      buildBreadcrumbHtml(product, trailIds, allProducts) +
      '<div class="product-main">' +
        '<div class="gallery-col">' +
          '<div class="gallery-main"><img id="gallery-main-img" src="' + imgUrl + '" alt="' + product.name + '" onerror="this.closest(\'.product-wrap\').innerHTML=\'<div class=&quot;error-state&quot;><h2>Product image not available.</h2></div>\'"></div>' +
          '<div class="gallery-thumbs" id="gallery-thumbs" style="display:none;"></div>' +
        '</div>' +
        '<div class="buy-col">' +
          '<span class="purity-badge">Research Use Only</span>' +
          '<h1 class="product-title">' + baseLabel(product.name) + '</h1>' +
          shortDescriptionHtml +
          '<div class="product-price">' + priceHtml + '</div>' +
          sizeOptionsHtml +
          '<div class="qty-row"' + (isOutOfStock ? ' style="display:none;"' : '') + '>' +
            '<div class="qty-stepper">' +
              '<button id="qty-minus" type="button">-</button>' +
              '<input type="text" id="qty-input" value="1" readonly>' +
              '<button id="qty-plus" type="button">+</button>' +
            '</div>' +
          '</div>' +
          '<div class="buy-buttons">' +
            '<button class="btn-add" id="add-to-cart-btn"' + (isOutOfStock ? ' disabled' : '') + '>' + (isOutOfStock ? 'Out of Stock' : 'Add to Cart') + '</button>' +
            '<button class="btn-buy" id="buy-now-btn">' + (isOutOfStock ? 'Notify When In Stock' : 'Buy Now') + '</button>' +
          '</div>' +
          notifyModalHtml +
          kitsAvailableHtml +
          '<div class="coa-list" id="coa-list" style="display:none;"></div>' +
          '<div id="coa-viewer-overlay">' +
            '<div id="coa-viewer-modal">' +
              '<div id="coa-viewer-toolbar">' +
                '<button type="button" id="coa-viewer-zoom-out" aria-label="Zoom out">&minus;</button>' +
                '<span id="coa-viewer-zoom-level">100%</span>' +
                '<button type="button" id="coa-viewer-zoom-in" aria-label="Zoom in">+</button>' +
              '</div>' +
              '<button type="button" id="coa-viewer-close" aria-label="Close">&times;</button>' +
              '<div id="coa-viewer-frame-wrap">' +
                '<iframe id="coa-viewer-frame" src="" title="Certificate of Analysis"></iframe>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<p class="trust-note">For laboratory research use only.</p>' +
          '<div class="trust-badges">' +
            '<div class="trust-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg><span>Third-Party Tested</span></div>' +
            '<div class="trust-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg><span>Free Shipping Over $250</span></div>' +
            '<div class="trust-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span>14-Day Returns</span></div>' +
            '<div class="trust-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>Batch &amp; Lot Tracking</span></div>' +
            '<div class="trust-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Secure Ordering</span></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    suggestedEssentialsHtml +

    '<div class="product-section">' +
      '<div class="ruo-note">' + buildDisclaimerParagraphsHtml(disclaimerBody) + '</div>' +
    '</div>' +

    descriptionHtml +

    // spec_has_coa reflects whether product_specs.source_coa_id is actually
    // set -- i.e. a real COA upload produced this row -- rather than
    // inferring "no real data" from which spec_* fields happen to be
    // non-null (spec_purity always defaults to '99%' even with zero COAs,
    // so that alone can't be the signal). A product with no COA ever
    // uploaded gets no Quality & Testing section at all, not one full of
    // placeholder values.
    (coaSourceProduct.spec_has_coa ?
      '<div class="product-section"><h2>Quality & Testing</h2>' +
        '<h3>Current-Batch Specifications</h3><table class="tech-table">' + batchSpecRows + '</table>' +
        '<h3>Analytical Results</h3><table class="tech-table">' + analyticalRows + '</table>' +
      '</div>' : '');

  wireProductInteractions(product, trailIds, siblings);
  // Fetches coaSourceProduct's COAs, not necessarily product's own -- see
  // coaSourceProduct's resolution above (a kit shows its backing vial's
  // certificates, since kits never get their own COA upload).
  loadProductCoas(coaSourceProduct);
  syncColumnHeights();
  window.addEventListener('resize', syncColumnHeights);
  wireScrollIndicator('suggested-essentials-grid', 'suggested-essentials-scroll-indicator', 'suggested-essentials-scroll-thumb');
  wireScrollIndicator('kits-available-grid', 'kits-available-scroll-indicator', 'kits-available-scroll-thumb');
}

// Drives the thin "faux scrollbar" under a horizontally-scrolling row so
// customers can tell it scrolls side-to-side (the real scrollbar is hidden
// via ::-webkit-scrollbar{display:none} above). Hides itself entirely when
// the row's content already fits without overflow, rather than showing a
// full-width dead bar. No-ops if the grid/indicator don't exist in the DOM
// (e.g. buildKitsAvailableSection() returned '' because there were no
// matching kits), so it's safe to call unconditionally.
function wireScrollIndicator(gridId, indicatorId, thumbId) {
  var grid = document.getElementById(gridId);
  var indicator = document.getElementById(indicatorId);
  var thumb = document.getElementById(thumbId);
  if (!grid || !indicator || !thumb) return;
  function update() {
    var scrollable = grid.scrollWidth > grid.clientWidth + 1;
    indicator.classList.toggle('visible', scrollable);
    if (!scrollable) return;
    var thumbWidthPct = Math.max((grid.clientWidth / grid.scrollWidth) * 100, 8);
    thumb.style.width = thumbWidthPct + '%';
    var maxScroll = grid.scrollWidth - grid.clientWidth;
    var scrollPct = maxScroll > 0 ? grid.scrollLeft / maxScroll : 0;
    thumb.style.left = (scrollPct * (100 - thumbWidthPct)) + '%';
  }
  grid.addEventListener('scroll', update);
  window.addEventListener('resize', update);
  update();
}

// Keeps buy-col from growing taller than gallery-col -- CSS grid's default
// stretch would otherwise let buy-col's content height (Kits Available,
// trust badges, COA list can all add up) determine the row height, leaving
// gallery-col stretched with empty space below the photo instead of the
// two columns actually matching. gallery-col has align-self:start (see its
// CSS) so it always sizes to its own natural content regardless of row
// height; this just measures that and caps buy-col to match, with
// .buy-col's overflow-y:auto (also in CSS) scrolling anything that doesn't fit.
// Recomputed on resize since the photo's height is width-driven
// (aspect-ratio), and skipped below 800px to match .product-main's own
// media query, which stacks the columns into one at that width -- no
// side-by-side height to match once they're no longer side by side.
function syncColumnHeights() {
  var galleryCol = document.querySelector('.gallery-col');
  var buyCol = document.querySelector('.buy-col');
  if (!galleryCol || !buyCol) return;
  if (window.innerWidth <= 800) {
    buyCol.style.maxHeight = '';
    return;
  }
  buyCol.style.maxHeight = galleryCol.offsetHeight + 'px';
}

// A product can now have multiple batch-specific COAs (product_coas table,
// one row per batch/lot), so there's no single "the COA" to link to a
// gallery thumbnail the way the old one-PDF-per-product version did --
// that thumbnail slot is left unused for now. Any fetch failure (including
// this endpoint not existing yet on a given deploy) is treated the same as
// "no COAs" and the section just stays hidden, same fail-quiet convention
// the old HEAD-check approach used.
function formatCoaDate(dateStr) {
  // batch_date is a plain calendar date with no time-of-day or timezone
  // meaning, but Postgres's `date` type serializes through pg/Express as a
  // full ISO timestamp ("2026-07-01T00:00:00.000Z"), not a bare "2026-07-01"
  // -- split off everything from 'T' onward first so both shapes work.
  // new Date(dateStr) parses that as UTC midnight, and toLocaleDateString()
  // then renders it in the viewer's LOCAL timezone -- in any zone behind
  // UTC, that silently displays the day before. Building the Date from the
  // local-time constructor instead sidesteps any UTC conversion entirely,
  // so the calendar date shown always matches what's in the data,
  // regardless of the viewer's timezone.
  var datePart = String(dateStr).split('T')[0];
  var parts = datePart.split('-');
  if (parts.length !== 3) return dateStr;
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

async function loadProductCoas(product) {
  var container = document.getElementById('coa-list');
  if (!container) return;
  var coas;
  try {
    var res = await fetch('/api/products/' + encodeURIComponent(product.id) + '/coas');
    if (!res.ok) return;
    coas = await res.json();
  } catch (err) {
    return;
  }
  if (!Array.isArray(coas) || coas.length === 0) return;

  var docIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>';

  container.innerHTML =
    '<h3>Certificates of Analysis</h3>' +
    coas.map(function(coa) {
      var pdfUrl = resolveCoaPath(coa.coa_path);
      if (!pdfUrl) return '';
      return '<div class="coa-list-item">' +
        '<div class="coa-list-item-info">' +
          '<span class="coa-list-item-lot">LOT #' + coa.batch_lot + '</span>' +
          '<span class="coa-list-item-date">' + formatCoaDate(coa.batch_date) + '</span>' +
        '</div>' +
        '<button type="button" class="btn-buy" data-coa-pdf-url="' + pdfUrl + '">' + docIcon + '<span>Click Here to View Certificate of Analysis</span></button>' +
      '</div>';
    }).join('');
  container.style.display = '';

  // Growing this section can grow buy-col -- resync so buy-col's max-height
  // (set once already in renderProduct) matches gallery-col's height again.
  syncColumnHeights();
}

function wireProductInteractions(product, trailIds, siblings) {
  var qtyInput = document.getElementById('qty-input');
  var minusBtn = document.getElementById('qty-minus');
  var plusBtn = document.getElementById('qty-plus');

  minusBtn.addEventListener('click', function() {
    var v = parseInt(qtyInput.value, 10) || 1;
    if (v > 1) qtyInput.value = v - 1;
  });
  plusBtn.addEventListener('click', function() {
    var v = parseInt(qtyInput.value, 10) || 1;
    qtyInput.value = v + 1;
  });

  document.getElementById('add-to-cart-btn').addEventListener('click', function() {
    if (!flashAddedFeedback(this)) return;
    var qty = parseInt(qtyInput.value, 10) || 1;
    for (var i = 0; i < qty; i++) addToCart(product.id);
  });

  document.getElementById('buy-now-btn').addEventListener('click', function() {
    // Out of stock: this button's slot/label is repurposed as "Notify When
    // In Stock" (see renderProduct) -- open the modal instead of checking out.
    if (product.stock_status === 'out_of_stock') {
      var overlay = document.getElementById('notify-modal-overlay');
      if (overlay) overlay.classList.add('active');
      return;
    }
    var qty = parseInt(qtyInput.value, 10) || 1;
    for (var i = 0; i < qty; i++) addToCart(product.id);
    window.location.href = '/checkout.html';
  });

  // MG and Pack Size pills carry the axis *value* (data-value), not a
  // product id directly -- a pill can represent multiple rows (e.g. "10mg"
  // spans every pack size at that dosage), so the target row is looked up
  // by combining the clicked value with whichever axis wasn't clicked,
  // using the currently-loaded product's own value for that other axis
  // (the same source of truth the disabled state was computed from in
  // renderProduct, so a click can never target a nonexistent row).
  function findSiblingByCombo(dosage, packSize) {
    return siblings.filter(function(s) { return s.dosage === dosage && s.pack_size === packSize; })[0];
  }
  function wireAxisSelector(containerId, otherAxisValue, buildCombo) {
    var container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll('.size-option').forEach(function(opt) {
      opt.addEventListener('click', function() {
        // Belt-and-suspenders: CSS (pointer-events:none) already blocks
        // this, same convention as .btn-add:disabled elsewhere on this page.
        if (opt.classList.contains('disabled')) return;
        var target = findSiblingByCombo.apply(null, buildCombo(opt.getAttribute('data-value'), otherAxisValue));
        if (target && target.id !== product.id) {
          // Switching dosage/pack size is the same product conceptually,
          // not a new hop -- trail carries through unchanged.
          window.location.href = buildProductUrl(target.id, trailIds);
        }
      });
    });
  }
  wireAxisSelector('mg-options', product.pack_size, function(clickedDosage, currentPackSize) {
    return [clickedDosage, currentPackSize];
  });
  wireAxisSelector('pack-options', product.dosage, function(clickedPackSize, currentDosage) {
    return [currentDosage, clickedPackSize];
  });

  // Delegated since #coa-list starts empty and is populated later by
  // loadProductCoas() -- same reasoning as gallery-thumbs/suggested-essentials
  // /kits-available below.
  //
  // #toolbar=0 hides the native PDF viewer's whole toolbar (print/download
  // included -- there's no way to cherry-pick individual buttons in a plain
  // iframe embed, it's all-or-nothing) in favor of the custom zoom-only
  // controls below, which CSS-scale the iframe itself rather than reaching
  // into the native viewer (which page JS has no access to).
  var COA_VIEWER_ZOOM_MIN = 0.5;
  var COA_VIEWER_ZOOM_MAX = 2.5;
  var COA_VIEWER_ZOOM_STEP = 0.25;
  var coaViewerZoom = 1;

  function applyCoaViewerZoom() {
    document.getElementById('coa-viewer-frame').style.transform = 'scale(' + coaViewerZoom + ')';
    document.getElementById('coa-viewer-zoom-level').textContent = Math.round(coaViewerZoom * 100) + '%';
  }

  document.getElementById('coa-list').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-coa-pdf-url]');
    if (!btn) return;
    coaViewerZoom = 1;
    applyCoaViewerZoom();
    document.getElementById('coa-viewer-frame').src = btn.getAttribute('data-coa-pdf-url') + '#toolbar=0';
    document.getElementById('coa-viewer-overlay').classList.add('active');
  });

  document.getElementById('coa-viewer-zoom-in').addEventListener('click', function() {
    coaViewerZoom = Math.min(COA_VIEWER_ZOOM_MAX, coaViewerZoom + COA_VIEWER_ZOOM_STEP);
    applyCoaViewerZoom();
  });
  document.getElementById('coa-viewer-zoom-out').addEventListener('click', function() {
    coaViewerZoom = Math.max(COA_VIEWER_ZOOM_MIN, coaViewerZoom - COA_VIEWER_ZOOM_STEP);
    applyCoaViewerZoom();
  });

  function closeCoaViewer() {
    document.getElementById('coa-viewer-overlay').classList.remove('active');
    // Stop the PDF rendering/loading in the background and avoid a stale
    // flash of the previous COA the next time a (possibly different) one
    // is opened.
    document.getElementById('coa-viewer-frame').src = '';
  }
  document.getElementById('coa-viewer-close').addEventListener('click', closeCoaViewer);
  document.getElementById('coa-viewer-overlay').addEventListener('click', function(e) {
    if (e.target === document.getElementById('coa-viewer-overlay')) closeCoaViewer();
  });

  // Delegated since gallery-thumbs starts empty. Nothing currently populates
  // it (the old single-COA doc thumbnail was removed along with wireCoaLink()
  // in favor of the multi-batch COA list -- see loadProductCoas()); this stays
  // dormant, ready for whenever a product actually gets more than one photo.
  document.getElementById('gallery-thumbs').addEventListener('click', function(e) {
    var thumb = e.target.closest('[data-role="image-thumb"]');
    if (!thumb) return;
    document.getElementById('gallery-main-img').src = thumb.src;
    document.querySelectorAll('#gallery-thumbs [data-role="image-thumb"]').forEach(function(t) {
      t.classList.remove('active');
    });
    thumb.classList.add('active');
  });

  // Delegated for the same reason as gallery-thumbs above: this grid only
  // exists in the DOM when buildSuggestedEssentialsSection() produced one.
  // Clicking Add to Cart adds that essential (qty 1) without navigating;
  // clicking anywhere else on a card goes to that essential's own product
  // page, matching how every other product card on the site behaves.
  var essentialsGrid = document.getElementById('suggested-essentials-grid');
  if (essentialsGrid) {
    essentialsGrid.addEventListener('click', function(e) {
      var addBtn = e.target.closest('[data-add-essential-id]');
      if (addBtn) {
        if (flashAddedFeedback(addBtn)) addToCart(addBtn.getAttribute('data-add-essential-id'));
        return;
      }
      var card = e.target.closest('.essential-card');
      if (card) {
        var targetId = card.getAttribute('data-product-id');
        window.location.href = buildProductUrl(targetId, nextTrailFor(targetId, trailIds, product.id));
      }
    });
  }

  // Same delegation pattern as suggested-essentials-grid above, for the
  // same reason: only exists in the DOM when buildKitsAvailableSection()
  // produced one.
  var kitsGrid = document.getElementById('kits-available-grid');
  if (kitsGrid) {
    kitsGrid.addEventListener('click', function(e) {
      var addBtn = e.target.closest('[data-add-kit-id]');
      if (addBtn) {
        if (flashAddedFeedback(addBtn)) addToCart(addBtn.getAttribute('data-add-kit-id'));
        return;
      }
      var card = e.target.closest('.essential-card');
      if (card) {
        var targetId = card.getAttribute('data-product-id');
        window.location.href = buildProductUrl(targetId, nextTrailFor(targetId, trailIds, product.id));
      }
    });
  }

  // Only exists in the DOM when the product is out_of_stock (see renderProduct).
  var notifyOverlay = document.getElementById('notify-modal-overlay');
  if (notifyOverlay) {
    var notifyInput = document.getElementById('notify-modal-input');
    var notifyError = document.getElementById('notify-modal-error');
    var notifyFormStep = document.getElementById('notify-modal-step-form');
    var notifySuccessStep = document.getElementById('notify-modal-step-success');

    document.getElementById('notify-modal-close').addEventListener('click', function() {
      notifyOverlay.classList.remove('active');
    });
    notifyOverlay.addEventListener('click', function(e) {
      if (e.target === notifyOverlay) notifyOverlay.classList.remove('active');
    });
    document.getElementById('notify-modal-submit').addEventListener('click', function() {
      var email = notifyInput.value.trim();
      if (!email || email.indexOf('@') === -1) {
        notifyError.textContent = 'Please enter a valid email address.';
        return;
      }
      notifyError.textContent = '';
      fetch('/api/stock-notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productId: product.id, email: email }),
      })
        .then(function(res) {
          return res.json().then(function(data) { return { ok: res.ok, data: data }; });
        })
        .then(function(result) {
          if (!result.ok) {
            notifyError.textContent = result.data.error || 'Something went wrong, please try again.';
            return;
          }
          notifyFormStep.style.display = 'none';
          notifySuccessStep.style.display = '';
        })
        .catch(function() {
          notifyError.textContent = 'Something went wrong, please try again.';
        });
    });
  }
}

// Base reference records for blend/kit products -- intentionally $0, never
// meant to be sold standalone. Confirmed intentional, not a pending-Apex
// gap. Same handling as missing-image products: not reachable as their own
// page, not shown in the shop grid. mt-2/pt-141 were removed from this
// list -- both are now real, priced, sellable products (see
// klow-mt2-pt141-and-8-kit-splits.sql), unlike cjc-1295/semax/selank,
// which stay excluded since they have real combo-product alternatives
// (CJC-1295/Ipamorelin, Semax/Selank) instead of a standalone listing.
var EXCLUDED_COMPONENT_IDS = ['cjc-1295', 'semax', 'selank'];

async function initProductPage() {
  var id = getQueryParam('id');
  if (!id) {
    renderError('No product specified.');
    return;
  }
  if (EXCLUDED_COMPONENT_IDS.indexOf(id) !== -1) {
    renderError('This product page is not available.');
    return;
  }
  try {
    var results = await Promise.all([
      fetch('/api/products'),
      fetch('/api/content/disclaimer').catch(function() { return null; }),
    ]);
    var res = results[0];
    var disclaimerRes = results[1];
    var products = await res.json();
    allProducts = products; // shared with cart script
    // Falls back to '' (ruo-note renders no paragraphs) rather than
    // blocking the whole product page on this one fetch -- same
    // "best-effort, never blocks the primary content" pattern used
    // elsewhere in this codebase (e.g. appendToSent() on the backend).
    if (disclaimerRes && disclaimerRes.ok) {
      var disclaimerData = await disclaimerRes.json();
      disclaimerBody = disclaimerData.body || '';
    }

    var product = products.find(function(p) { return String(p.id) === id; });
    if (!product) {
      renderError('Product not found.');
      return;
    }

    var base = groupKeyFor(product);
    var siblings = products.filter(function(p) {
      return groupKeyFor(p) === base && EXCLUDED_COMPONENT_IDS.indexOf(p.id) === -1;
    });

    renderProduct(product, siblings);
  } catch (err) {
    console.error('Failed to load product:', err);
    renderError('Could not load this product right now.');
  }
}

let productsReady = initProductPage();

</script>
