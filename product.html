<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgewell — Product</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.png">
<style>
@font-face { font-family:'Quicksand'; src:url('/fonts/quicksand-variable.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
:root{ --navy:#1B4B8C; --navy-dark:#123056; --green:#3FA34D; --gray:#6b6b6b; --bg:#FFFFFF; --panel:#F7F8F6; --line:#E4E4E0; }
*{box-sizing:border-box;}
body{ background:var(--bg); color:#1a1a1a; font-family:'Quicksand',sans-serif; font-weight:500; margin:0; }
a{color:inherit;}

/* ---- header (single-row, matches header.html) ---- */
header{
  display:flex; align-items:center; flex-wrap:nowrap; gap:18px;
  padding:12px 20px; max-width:1200px; margin:0 auto;
  position:sticky; top:0; z-index:10;
  background:#fff; border-bottom:1px solid var(--line);
}
.logo-mark{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.logo-word{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.2rem; color:var(--navy); white-space:nowrap; }
.logo-word .well{ color:var(--green); }
.header-nav-links{ display:flex; align-items:center; gap:22px; flex-shrink:0; margin-left:16px; }
.header-nav-link{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; color:var(--navy); text-decoration:none; white-space:nowrap; }
.header-nav-link:hover{ color:var(--green); }
.header-search-row{ position:relative; flex:0 1 240px; min-width:0; max-width:240px; margin-left:auto; }
.header-search-row input{ width:100%; box-sizing:border-box; min-width:0; padding:11px 16px 11px 40px; border-radius:6px; border:1.5px solid var(--line); background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6b6b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center/16px 16px; color:#333; font-size:0.95rem; font-family:'Quicksand',sans-serif; }
.header-search-row input:focus{ outline:none; border-color:var(--navy); }
.search-icon-btn{ position:absolute; top:50%; transform:translateY(-50%); padding:0; margin:0; border:none; background:transparent; cursor:pointer; }
.header-search-row .search-icon-btn{ left:14px; width:16px; height:16px; }
.menu-toggle{ display:flex; align-items:center; gap:22px; flex-shrink:0; position:relative; }
.hamburger{ display:none; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
.hamburger span{ display:block; width:22px; height:2.5px; background:var(--navy); border-radius:2px; }
.nav-overlay{ display:none; position:absolute; top:calc(100% + 12px); right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(18,48,86,0.16); z-index:9999; min-width:170px; padding:6px 0; }
.nav-overlay.open{ display:block; }
.nav-overlay-inner{ display:flex; flex-direction:column; }
.nav-overlay-inner a{ color:var(--navy-dark); font-size:0.9rem; font-weight:700; text-decoration:none; font-family:'Quicksand',sans-serif; padding:11px 18px; }
.nav-overlay-inner a:hover{ background:var(--panel); }
.cart-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; text-decoration:none; }
.cart-icon:hover{ color:var(--green); }
.cart-icon-inner{ display:flex; align-items:center; position:relative; }
.cart-count{ position:absolute; top:-2px; right:-4px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--navy); color:#fff; font-size:0.6rem; font-weight:700; line-height:15px; text-align:center; display:none; font-family:'Quicksand',sans-serif; box-sizing:border-box; }
.cart-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }
.login-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; }
.login-icon:hover{ color:var(--green); }
.login-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }

@media (max-width: 1150px){
  .header-nav-links{ display:none; }
  .hamburger{ display:flex; }
  header{ gap:10px; padding:10px 14px; }
  .header-search-row{ max-width:200px; }
  .logo-word{ font-size:0.95rem; }
}
@media (max-width: 420px){
  header{ gap:6px; padding:8px 10px; }
  .header-search-row{ max-width:160px; }
  .header-search-row input{ padding:10px 12px 10px 34px; font-size:0.8rem; }
  .header-search-row .search-icon-btn{ left:11px; width:14px; height:14px; }
  .menu-toggle{ gap:10px; }
  .cart-icon svg{ width:18px; height:18px; }
  .cart-count{ font-size:0.55rem; min-width:13px; height:13px; line-height:13px; }
  .cart-icon-label{ display:none; }
  .logo-word{ font-size:0.85rem; }
  .login-icon svg{ width:18px; height:18px; }
  .login-icon-label{ display:none; }
}

/* ---- footer (matches shop.html) ---- */
footer.footer-main{margin-top:60px; padding:40px 20px 24px; background:var(--navy-dark); border-top:1px solid var(--line); font-family:'Quicksand',sans-serif;}
.footer-grid{max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:28px; margin-bottom:28px;}
.footer-col{ text-align:left; }
.footer-col h4{color:rgba(255,255,255,0.45); font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin:0 0 14px;}
.footer-col a{display:block; color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.85rem; margin-bottom:8px; overflow-wrap:break-word;}
.footer-col a:hover{ color:var(--green); }
.footer-col p{ color:rgba(255,255,255,0.6); font-size:0.82rem; line-height:1.6; margin:0 0 6px; overflow-wrap:break-word; }
.footer-social{display:flex; gap:10px;}
.footer-social a{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; margin:0;}
.footer-signup-input{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-family:'Quicksand',sans-serif;font-size:0.78rem;margin-bottom:8px;box-sizing:border-box;background:rgba(255,255,255,0.08);color:#fff;}
.footer-signup-input::placeholder{ color:rgba(255,255,255,0.4); }
.footer-signup-btn{width:100%;padding:9px;background:var(--green);color:#fff;border:none;border-radius:6px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:0.78rem;cursor:pointer;}
.footer-signup-btn:hover{ background:#358f41; }
.footer-signup-msg{font-size:0.75rem; margin-top:6px; color:var(--green);}
.footer-legal{max-width:1200px; margin:24px auto 0; font-size:0.7rem; color:rgba(255,255,255,0.5); line-height:1.5; border-top:1px solid rgba(255,255,255,0.15); padding-top:16px;}
.footer-legal a{ color:rgba(255,255,255,0.75); text-decoration:underline; }
.footer-legal a:hover{ color:#fff; }
.footer-info-row{ position:relative; display:flex; align-items:center; min-height:34px; max-width:1200px; margin:0 auto 20px; }
.footer-info-brand{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.footer-logo-mark{ flex-shrink:0; }
.footer-flag-icon{ flex-shrink:0; border-radius:2px; overflow:hidden; margin-left:16px; }
.footer-brand-name{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.8rem; white-space:nowrap; }
.footer-brand-name .forge{ color:#fff; }
.footer-brand-name .well{ color:var(--green); }
.footer-country-label{ font-size:0.72rem; color:rgba(255,255,255,0.6); white-space:nowrap; }
.footer-info-row .footer-catalog-search{ margin-left:auto; }
.footer-catalog-search{ max-width:220px; width:100%; position:relative; }
.footer-catalog-search .search-icon-btn{ left:10px; width:14px; height:14px; }
.footer-catalog-search input{ width:100%; box-sizing:border-box; padding:9px 10px 9px 32px; border-radius:6px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.05) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='0.6'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 10px center/14px 14px; color:#fff; font-size:0.8rem; }
.footer-catalog-search input::placeholder{ color:rgba(255,255,255,0.45); }
.footer-bottom{max-width:1200px; margin:16px auto 0; text-align:center;}
.footer-copyright{font-size:0.75rem; color:rgba(255,255,255,0.5); margin:0 0 12px;}
.footer-legal-links{display:flex; flex-wrap:wrap; justify-content:center; gap:14px;}
.footer-legal-links a{color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.75rem;}
.footer-legal-links a:hover{ color:#fff; text-decoration:underline; }
@media (max-width: 600px) {
  .footer-info-row{ flex-direction:column; align-items:center; gap:14px; min-height:0; }
  .footer-info-brand{ position:static; transform:none; }
  .footer-info-row .footer-catalog-search{ margin-left:0; }
}

/* ---- product page layout ---- */
.product-wrap{max-width:1200px; margin:24px auto 0; padding:0 24px;}
@media (max-width:600px){ .product-wrap{ padding-left:16px; padding-right:16px; } }
.breadcrumb{font-size:0.78rem; color:var(--gray); margin-bottom:18px;}
.breadcrumb a{color:var(--navy); text-decoration:none;}
.back-link{font-size:0.78rem; margin-bottom:6px;}
.back-link a{color:var(--navy); text-decoration:none;}
.back-link a:hover{text-decoration:underline;}
.product-main{display:grid; grid-template-columns:1fr 1fr; gap:40px;}
@media (max-width:800px){ .product-main{grid-template-columns:1fr;} }

/* gallery-col sized to its own content (the aspect-ratio photo box), not
   stretched to match buy-col -- buy-col's max-height is set to that natural
   height by syncColumnHeights() in the script below, with overflow-y:auto
   here so longer content scrolls internally instead of growing the page
   past the photo. Both are unset/no-op below the 800px breakpoint where
   .product-main above stacks the columns. */
.gallery-col{ align-self:start; }
.buy-col{ overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none; }
.buy-col::-webkit-scrollbar{ display:none; }

.buy-col-kits{ margin-top:20px; }
.buy-col-kits h2{ font-size:1.1rem; color:var(--navy-dark); border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:14px; }
#kits-available-grid{ display:flex; overflow-x:auto; gap:16px; padding:4px 4px 8px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
#kits-available-grid::-webkit-scrollbar{ display:none; }

.gallery-main{width:100%; aspect-ratio:1/1; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.gallery-main img{width:100%; height:100%; object-fit:contain;}
.gallery-thumbs{display:flex; gap:10px; margin-top:10px;}
.gallery-thumbs img{width:64px; height:64px; object-fit:cover; border-radius:6px; border:1.5px solid var(--line); cursor:pointer;}
.gallery-thumbs img.active{border-color:var(--navy);}
.gallery-thumb-doc{width:64px; height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:6px; border:1.5px solid var(--line); background:var(--panel); color:var(--navy); text-decoration:none; cursor:pointer;}
.gallery-thumb-doc:hover{border-color:var(--navy);}
.gallery-thumb-doc span{font-size:0.55rem; font-weight:700;}

.purity-badge{display:inline-block; background:var(--green); color:#fff; font-size:0.7rem; font-weight:700; padding:4px 10px; border-radius:20px; margin-bottom:10px;}
.product-title{font-size:1.7rem; color:var(--navy-dark); margin:0 0 10px; font-weight:700;}
.short-description{margin-bottom:16px;}
.short-description-line{font-size:0.88rem; line-height:1.3; color:#333; margin:0 0 2px;}
.short-description-line:last-child{margin-bottom:0;}
.product-price{font-size:1.9rem; color:var(--navy); font-weight:700; margin-bottom:16px;}
.product-price .was{font-size:1rem; color:var(--gray); text-decoration:line-through; font-weight:500; margin-left:8px;}

.size-selector{margin-bottom:18px;}
.size-selector label{display:block; font-size:0.7rem; font-weight:500; color:var(--gray); margin-bottom:8px;}
.size-options{display:flex; flex-wrap:wrap; gap:8px;}
.size-option{padding:9px 16px; border:1.5px solid var(--line); border-radius:6px; cursor:pointer; font-size:0.85rem; font-family:'Quicksand',sans-serif; background:#fff;}
.size-option.active{border-color:var(--navy); background:var(--navy); color:#fff;}

.qty-row{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.qty-stepper{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:6px; overflow:hidden;}
.qty-stepper button{width:36px; height:36px; background:#fff; border:none; cursor:pointer; font-size:1.1rem; color:var(--navy);}
.qty-stepper input{width:44px; text-align:center; border:none; font-family:'Quicksand',sans-serif; font-weight:700;}

.buy-buttons{display:flex; gap:10px; margin-bottom:20px;}
.btn-add{flex:1; padding:14px; background:#fff; color:var(--navy); border:1.5px solid var(--navy); border-radius:8px; font-weight:700; cursor:pointer; font-family:'Quicksand',sans-serif;}
.btn-buy{flex:1; padding:14px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-family:'Quicksand',sans-serif;}

.trust-note{font-size:0.75rem; color:var(--gray); margin-top:20px; padding-top:16px; border-top:1px solid var(--line); margin-bottom:10px;}
.trust-badges{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:6px;}
.trust-badge{display:flex; align-items:center; gap:8px; font-size:0.75rem; color:var(--gray);}
.trust-badge svg{flex-shrink:0; width:16px; height:16px; color:var(--navy);}

.coa-list{margin-top:20px; padding-top:16px; border-top:1px solid var(--line);}
.coa-list h3{font-size:0.85rem; color:var(--navy-dark); margin:0 0 10px; font-weight:700;}
.coa-list-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px;}
.coa-list-item:last-child{margin-bottom:0;}
.coa-list-item-info{display:flex; flex-direction:column; gap:2px; min-width:0;}
.coa-list-item-lot{font-weight:700; color:var(--navy-dark); font-size:0.82rem;}
.coa-list-item-date{color:var(--gray); font-size:0.75rem;}
.coa-list-item-link{display:flex; align-items:center; gap:6px; color:var(--navy); text-decoration:none; font-weight:700; font-size:0.78rem; white-space:nowrap; flex-shrink:0;}
.coa-list-item-link svg{flex-shrink:0; width:15px; height:15px;}
.coa-list-item-link:hover{text-decoration:underline;}

.product-section{max-width:1200px; margin:36px auto 0; padding:0 24px;}
@media (max-width:600px){ .product-section{ padding-left:16px; padding-right:16px; } }
.product-section h2{font-size:1.1rem; color:var(--navy-dark); border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:14px;}
.research-text{font-size:0.88rem; line-height:1.7; color:#333;}

table.tech-table{width:100%; border-collapse:collapse; font-size:0.85rem;}
table.tech-table th, table.tech-table td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line);}
table.tech-table th{width:220px; color:var(--gray); font-weight:700;}

.ruo-note{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-top:20px;}
.ruo-note p{ font-size:0.8rem; line-height:1.6; color:var(--gray); margin:0 0 10px; }
.ruo-note p:last-child{ margin-bottom:0; }

/* ---- Suggested Essentials (styled to match home/shop's Most Popular cards) ---- */
#suggested-essentials-grid{ display:flex; overflow-x:auto; gap:16px; padding:4px 4px 8px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
#suggested-essentials-grid::-webkit-scrollbar{ display:none; }
.essential-card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 12px 12px; flex:0 0 150px; min-width:150px; scroll-snap-align:start; cursor:pointer; display:flex; flex-direction:column; }
.essential-card .vial{ width:100%; aspect-ratio:1/1; border-radius:4px; background:#fff; margin-bottom:10px; display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid var(--line); }
.essential-card .vial img{ width:100%; height:100%; object-fit:contain; }
.essential-card h3{ font-weight:700; font-size:0.85rem; margin:0 0 4px; color:#141414; text-align:center; }
.essential-card .price-row{ display:flex; flex-direction:column; gap:8px; margin-top:auto; padding-top:8px; }
.essential-card .price{ font-weight:700; font-size:0.82rem; color:var(--navy-dark); text-align:center; }
.essential-card .add-btn{ display:block; width:100%; text-align:center; font-size:0.7rem; font-weight:700; padding:8px; border-radius:6px; border:1.5px solid #6B4FA0; color:#6B4FA0; background:#fff; cursor:pointer; font-family:'Quicksand',sans-serif; }

.loading-state, .error-state{max-width:1200px; margin:60px auto; padding:0 24px; text-align:center; color:var(--gray);}

</style>
</head>
<body>

<div id="header-placeholder"></div>



<div id="product-root">
  <div class="loading-state" id="product-loading">Loading product...</div>
</div>

<div id="footer-placeholder"></div>

<script>
let allProducts = [];
let cart = JSON.parse(localStorage.getItem('forgewell_cart') || '[]');

async function catalogSearchJump(query) {
  query = query.trim().toLowerCase();
  if (!query) return;
  await productsReady;
  const match = allProducts.find(p => {
    const base = (p.name || '').replace(/\s*\(?\d+(\.\d+)?\s?(mg|mcg|iu|ml)\)?\s*$/i, '').trim().toLowerCase();
    return base === query || base.indexOf(query) !== -1;
  });
  if (match) {
    window.location.href = '/product.html?id=' + encodeURIComponent(match.id);
  } else {
    window.location.href = '/shop.html#tabs';
  }
}

// Wires up all header/footer interactivity. Runs only after header.html and
// footer.html have been fetched and injected below -- their elements don't
// exist in the DOM before then.
function wireHeaderFooter() {
  var footerSearchInput = document.getElementById('footer-catalog-search-input');
  if (footerSearchInput) {
    footerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var footerSearchIconBtn = document.getElementById('footer-search-icon-btn');
  if (footerSearchIconBtn && footerSearchInput) {
    footerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var headerSearchInput = document.getElementById('header-catalog-search-input');
  if (headerSearchInput) {
    headerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(headerSearchInput.value);
    });
  }
  var headerSearchIconBtn = document.getElementById('header-search-icon-btn');
  if (headerSearchIconBtn && headerSearchInput) {
    headerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(headerSearchInput.value);
    });
  }

  var hamBtn = document.getElementById('hamburger-btn');
  var overlay = document.getElementById('nav-overlay');
  if (hamBtn && overlay) {
    hamBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.toggle('open');
    });
  }
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target.closest('a')) overlay.classList.remove('open');
    });
    document.addEventListener('click', function(e) {
      if (overlay.classList.contains('open') && !overlay.contains(e.target)) {
        overlay.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') overlay.classList.remove('open');
    });
  }

  // Checks whether the person is logged in and updates the header's account
  // icon accordingly -- links to order history if logged in, to the
  // login/signup page otherwise. Runs on every page that shares this header.
  var loginIcon = document.querySelector('.login-icon');
  if (loginIcon) {
    fetch('/api/auth/me', { credentials: 'include' })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(customer) {
        if (customer) {
          loginIcon.href = '/orders.html';
          loginIcon.title = 'My Account (' + customer.email + ')';
          var navInner = document.querySelector('.nav-overlay-inner');
          if (navInner && !document.getElementById('nav-logout-link')) {
            var logoutLink = document.createElement('a');
            logoutLink.href = '#';
            logoutLink.id = 'nav-logout-link';
            logoutLink.textContent = 'Log Out';
            logoutLink.addEventListener('click', function(e) {
              e.preventDefault();
              fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
                .then(function() { window.location.href = '/shop.html'; });
            });
            navInner.appendChild(logoutLink);
          }
        }
      })
      .catch(function() { /* not logged in or request failed -- leave icon pointing to /login.html */ });
  }

  // Restores the header's cart count from localStorage now that the header
  // actually exists in the DOM (it didn't yet when updateCartIcon() first
  // ran further down this script).
  updateCartIcon();
}

Promise.all([
  fetch('/header.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('header-placeholder').innerHTML = html;
  }),
  fetch('/footer.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('footer-placeholder').innerHTML = html;
  })
]).then(wireHeaderFooter).catch(function(err) {
  console.error('Failed to load shared header/footer', err);
});

function saveCart() {
  localStorage.setItem('forgewell_cart', JSON.stringify(cart));
  updateCartIcon();
}

function updateCartIcon() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById('cart-count');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }
}

function addToCart(productId) {
  const product = allProducts.find(p => p.id === productId);
  if (!product) return;
  const existing = cart.find(i => i.productId === productId);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ productId: product.id, name: product.name, price: product.price, qty: 1 });
  }
  saveCart();
}

updateCartIcon();

</script>

<script>
// ---- Product page logic ----
// Depends on the cart script above for: allProducts, cart, addToCart(),
// saveCart(), updateCartIcon().

function getQueryParam(name) {
  var params = new URLSearchParams(window.location.search);
  return params.get(name);
}

// Strips a trailing size/dose token like "5mg", "(5mg)", "10 mcg", "500iu"
// to get the base product label used to group sibling size-tier rows.
// This is a string match against `name`, not a real foreign key (base_product_id
// is empty for simple tiered products) -- confirmed in the DB this session.
function baseLabel(name) {
  if (!name) return '';
  return name.replace(/\s*\(?\d+(\.\d+)?\s?(mg|mcg|iu|ml)\)?\s*$/i, '').trim();
}

// Siblings are already grouped by baseLabel(), so they always share one unit
// (mg/mcg/iu/ml) -- comparing the leading number alone is enough to order
// them correctly. Unparsable values sort last instead of throwing.
function parseDosageValue(product) {
  var text = product.dosage || product.name || '';
  var m = text.match(/(\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : Infinity;
}

function resolveImagePath(path) {
  if (!path) return null;
  if (path.indexOf('http') === 0) return path;
  // DB stores paths like "images/glutathione.png" -- relative to site root.
  // Actual files are served as WebP (much smaller); the DB only ever knows
  // about the .png name, so the swap happens here rather than at the source.
  path = path.replace(/\.png$/i, '.webp');
  if (path.indexOf('/') === 0) return path;
  return '/' + path;
}

// Same site-root-relative convention as resolveImagePath(), minus the
// image-specific .png->.webp swap -- product_coas.coa_path is a PDF path,
// not an image.
function resolveCoaPath(path) {
  if (!path) return null;
  if (path.indexOf('http') === 0) return path;
  if (path.indexOf('/') === 0) return path;
  return '/' + path;
}

// ---- Back link ----
// Separate from the "Shop" breadcrumb link below: this tracks wherever the
// customer actually came from (a search jump, another product's Suggested
// Essentials row, a Most Popular card, a sibling size, etc.) using
// document.referrer rather than sessionStorage, since every navigation into
// this page already happens via a real `window.location.href` assignment
// (search jump, card clicks, Buy Now, size selector) -- the browser sets
// document.referrer on those exactly like a clicked link, so there's no need
// to have every other page manually record "last page visited" itself.
// Returns null (render nothing extra) when there's no usable referrer: empty
// (fresh tab/bookmark/refresh), cross-origin (don't link off-site), pointing
// at this exact page (avoids a self-link on refresh), or pointing at
// /shop.html specifically (the "Shop" breadcrumb link already covers that,
// showing both would be redundant).
function getBackLink(product, products) {
  var ref = document.referrer;
  if (!ref) return null;

  var refUrl;
  try {
    refUrl = new URL(ref);
  } catch (e) {
    return null;
  }
  if (refUrl.origin !== window.location.origin) return null;

  var refPath = refUrl.pathname + refUrl.search;
  var currentPath = window.location.pathname + window.location.search;
  if (refPath === currentPath) return null;
  if (refUrl.pathname === '/shop.html') return null;

  var label = 'Back';
  if (refUrl.pathname === '/home.html' || refUrl.pathname === '/') {
    label = 'Back to Home';
  } else if (refUrl.pathname === '/product.html') {
    var refId = refUrl.searchParams.get('id');
    var refProduct = products.find(function(p) { return p.id === refId; });
    if (refProduct) label = 'Back to ' + refProduct.name;
  }
  return { href: refPath, label: label };
}

function buildBackLinkHtml(product, products) {
  var backLink = getBackLink(product, products);
  if (!backLink) return '';
  return '<div class="back-link"><a href="' + backLink.href + '" id="back-link-anchor">&lsaquo; ' + backLink.label + '</a></div>';
}

// ---- Suggested Essentials ----
// Only shown under peptide/amino/kit products -- essentials themselves (and
// anything uncategorized) don't get an essentials upsell.
var ESSENTIAL_TRIGGER_CATEGORIES = ['peptide', 'amino', 'kit'];
var SUGGESTED_ESSENTIAL_NAMES = ['Acetic Acid Water', 'Bacteriostatic Water', 'Insulin Needles', 'Peptide Carrier'];

// baseLabel() above only strips *numeric* dosage/size tokens (mg/mcg/iu/ml) --
// confirmed it leaves non-numeric variant suffixes like "(Large Pack)" /
// "(Small Pack)" untouched. Essentials like Insulin Needles use pack-size
// suffixes, not mg/mL, so matching them needs a broader strip: any trailing
// "(...)" annotation, numeric or not. Kept separate from baseLabel() rather
// than broadening it, since baseLabel() is also used for strict dosage-sibling
// grouping elsewhere and that shouldn't start swallowing arbitrary parens.
function stripTrailingAnnotation(name) {
  if (!name) return '';
  return name.replace(/\s*\([^)]*\)\s*$/, '').trim();
}

// Both Insulin Needles pack sizes (and any other multi-variant essential
// here) are shown, not just one -- so this returns every matching product,
// not a single pick. Multiple variants of the same essential are sorted
// cheapest-first since pack-size suffixes have no numeric token to sort by
// (unlike parseDosageValue()'s mg/mcg/iu/ml sizes).
function findSuggestedEssentials(product, products) {
  if (ESSENTIAL_TRIGGER_CATEGORIES.indexOf(product.category) === -1) return [];
  var namesLower = SUGGESTED_ESSENTIAL_NAMES.map(function(n) { return n.toLowerCase(); });
  var matches = products.filter(function(p) {
    if (p.id === product.id) return false;
    if (!resolveImagePath(p.image_path)) return false; // no image, no listing
    return namesLower.indexOf(stripTrailingAnnotation(p.name).toLowerCase()) !== -1;
  });
  matches.sort(function(a, b) {
    var groupA = namesLower.indexOf(stripTrailingAnnotation(a.name).toLowerCase());
    var groupB = namesLower.indexOf(stripTrailingAnnotation(b.name).toLowerCase());
    if (groupA !== groupB) return groupA - groupB;
    return (a.price || 0) - (b.price || 0); // cheapest/smallest pack first within the same essential
  });
  return matches;
}

function buildEssentialCardHtml(p) {
  var imgUrl = resolveImagePath(p.image_path);
  var priceLabel = p.price > 0 ? '$' + Number(p.price).toFixed(2) : '$XX';
  return '<div class="essential-card" data-product-id="' + p.id + '">' +
    '<div class="vial"><img src="' + imgUrl + '" alt="' + p.name + '" loading="lazy" onerror="this.closest(\'.essential-card\').remove()"></div>' +
    '<h3>' + p.name + '</h3>' +
    '<div class="price-row">' +
      '<div class="price">' + priceLabel + '</div>' +
      '<button type="button" class="add-btn" data-add-essential-id="' + p.id + '">Add to Cart</button>' +
    '</div>' +
  '</div>';
}

function buildSuggestedEssentialsSection(product, products) {
  var matches = findSuggestedEssentials(product, products);
  if (matches.length === 0) return '';
  return '<div class="product-section">' +
    '<h2>Suggested Essentials</h2>' +
    '<div id="suggested-essentials-grid">' + matches.map(buildEssentialCardHtml).join('') + '</div>' +
  '</div>';
}

// ---- Kits Available ----
// Kit products carry a base_product_id pointing at the non-kit product they
// bundle (e.g. "bpc-157-kit-10-pack" -> base_product_id "bpc-157"). That
// base isn't always a real product id on its own -- dosage/tier-variant
// products suffix it ("bpc-157-5mg", "cjc-1295-ipamorelin-high"), so a kit
// applies to every sibling sharing that base, not just an exact id match.
// Confirmed against the live catalog: base_product_id is always either an
// exact product id (single-variant products like "cagrilintide") or that
// same string plus a "-<suffix>" a sibling's id starts with -- covers every
// suffix style in use (mg/mcg, high/low, bare) without needing to know
// which one a given base uses.
function findRelatedKits(product, products) {
  return products.filter(function(p) {
    if (p.category !== 'kit') return false;
    if (!resolveImagePath(p.image_path)) return false; // no image, no listing
    var base = p.base_product_id;
    if (!base) return false;
    return product.id === base || product.id.indexOf(base + '-') === 0;
  }).sort(function(a, b) { return (a.price || 0) - (b.price || 0); });
}

function buildKitCardHtml(p) {
  var imgUrl = resolveImagePath(p.image_path);
  var priceLabel = p.price > 0 ? '$' + Number(p.price).toFixed(2) : '$XX';
  return '<div class="essential-card" data-product-id="' + p.id + '">' +
    '<div class="vial"><img src="' + imgUrl + '" alt="' + p.name + '" loading="lazy" onerror="this.closest(\'.essential-card\').remove()"></div>' +
    '<h3>' + p.name + '</h3>' +
    '<div class="price-row">' +
      '<div class="price">' + priceLabel + '</div>' +
      '<button type="button" class="add-btn" data-add-kit-id="' + p.id + '">Add to Cart</button>' +
    '</div>' +
  '</div>';
}

function buildKitsAvailableSection(product, products) {
  var matches = findRelatedKits(product, products);
  if (matches.length === 0) return '';
  return '<div class="buy-col-kits">' +
    '<h2>Kits Available</h2>' +
    '<div id="kits-available-grid">' + matches.map(buildKitCardHtml).join('') + '</div>' +
  '</div>';
}

function renderError(message) {
  document.getElementById('product-root').innerHTML =
    '<div class="error-state"><h2>' + message + '</h2>' +
    '<p><a href="/shop.html">Return to shop</a></p></div>';
}

function renderProduct(product, siblings) {
  var root = document.getElementById('product-root');

  if (!imgUrl) {
    // Per the site's image-matching rule: no image file, no listing.

    return;
  }

  // Short description, shown between the title and price -- plain paragraph
  // text now, not a bulleted list. product.bullets is normally a single
  // \n-separated string of short discrete facts (e.g. "Research use only\n
  // Packaged in a 3mL vial"), not one flowing sentence, so each line still
  // gets its own <p> rather than joining them into one run-on paragraph.
  var shortDescriptionLines = [];
  if (Array.isArray(product.bullets)) {
    shortDescriptionLines = product.bullets;
  } else if (typeof product.bullets === 'string' && product.bullets.trim()) {
    shortDescriptionLines = product.bullets.split('\n');
  }
  shortDescriptionLines = shortDescriptionLines.map(function(line) { return line.trim(); }).filter(Boolean);
  // "Research use only" is dropped here -- it's redundant with the
  // highlighted disclaimer box above, which already covers it -- and
  // "Not for human use" always closes the list instead, whenever there
  // was other short-description content to begin with.
  if (shortDescriptionLines.length) {
    shortDescriptionLines = shortDescriptionLines.filter(function(line) {
      return line.toLowerCase() !== 'research use only';
    });
    shortDescriptionLines.push('Not for human use');
  }
  var shortDescriptionHtml = shortDescriptionLines
    .map(function(line) { return '<p class="short-description-line">' + line + '</p>'; })
    .join('');
  if (shortDescriptionHtml) {
    shortDescriptionHtml = '<div class="short-description">' + shortDescriptionHtml + '</div>';
  }

  var sizeOptionsHtml = '';

    // returns them (not necessarily dosage order), so sort smallest-to-largest
    // by the leading number in dosage (falling back to name) before rendering.
    var sortedSiblings = siblings.slice().sort(function(a, b) {
      return parseDosageValue(a) - parseDosageValue(b);
    });
    sizeOptionsHtml = '<div class="size-selector"><label>SELECT MG</label><div class="size-options" id="size-options">' +
      sortedSiblings.map(function(s) {
        var activeClass = s.id === product.id ? ' active' : '';
        return '<div class="size-option' + activeClass + '" data-id="' + s.id + '">' + (s.dosage || s.name) + '</div>';
      }).join('') + '</div></div>';
  }

  var techRows = '';
  var techFields = [
    ['CAS Number', product.cas_number],
    ['Molecular Formula', product.molecular_formula],
    ['Molecular Weight', product.molecular_weight],
    ['Sequence', product.sequence],
    ['PubChem CID', product.pubchem_cid],
    ['Lot Number', product.lot],
  ];
  techFields.forEach(function(f) {
    if (f[1]) techRows += '<tr><th>' + f[0] + '</th><td>' + f[1] + '</td></tr>';
  });

  var verificationNote = '';

    verificationNote = '<p style="font-size:0.75rem;color:var(--gray);margin-top:8px;">Technical data for this product is pending final verification.</p>';
  }

  var priceHtml = product.price > 0 ? '$' + Number(product.price).toFixed(2) : 'Price coming soon';
  var suggestedEssentialsHtml = buildSuggestedEssentialsSection(product, allProducts);
  var kitsAvailableHtml = buildKitsAvailableSection(product, allProducts);
  var backLinkHtml = buildBackLinkHtml(product, allProducts);

  // Full-width section below product-main, placed after Suggested Essentials
  // (not inside buy-col) -- uses .product-section like Suggested Essentials
  // and Technical Data below it.
  var descriptionHtml =
    '<div class="product-section">' +
      '<h2>Description</h2>' +
      '<div class="research-text">' + (product.research_use || '') + '</div>' +
      verificationNote +
    '</div>';

  root.innerHTML =
    '<div class="product-wrap">' +
      backLinkHtml +
      '<div class="breadcrumb"><a href="/shop.html">Shop</a> / ' + product.name + '</div>' +
      '<div class="product-main">' +
        '<div class="gallery-col">' +
          '<div class="gallery-main"><img id="gallery-main-img" src="' + imgUrl + '" alt="' + product.name + '" onerror="this.closest(\'.product-wrap\').innerHTML=\'<div class=&quot;error-state&quot;><h2>Product image not available.</h2></div>\'"></div>' +
          '<div class="gallery-thumbs" id="gallery-thumbs" style="display:none;"></div>' +
        '</div>' +
        '<div class="buy-col">' +
          '<span class="purity-badge">Research Use Only</span>' +
          '<h1 class="product-title">' + product.name + '</h1>' +
          shortDescriptionHtml +
          '<div class="product-price">' + priceHtml + '</div>' +
          sizeOptionsHtml +
          '<div class="qty-row">' +
            '<div class="qty-stepper">' +
              '<button id="qty-minus" type="button">-</button>' +
              '<input type="text" id="qty-input" value="1" readonly>' +
              '<button id="qty-plus" type="button">+</button>' +
            '</div>' +
          '</div>' +
          '<div class="buy-buttons">' +
            '<button class="btn-add" id="add-to-cart-btn">Add to Cart</button>' +
            '<button class="btn-buy" id="buy-now-btn">Buy Now</button>' +
          '</div>' +
          kitsAvailableHtml +
          '<div class="coa-list" id="coa-list" style="display:none;"></div>' +
          '<p class="trust-note">For laboratory research use only.</p>' +
          '<div class="trust-badges">' +
            '<div class="trust-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg><span>Third-Party Tested</span></div>' +
            '<div class="trust-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg><span>Free Shipping Over $250</span></div>' +

            '<div class="trust-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>Batch &amp; Lot Tracking</span></div>' +
            '<div class="trust-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Secure Ordering</span></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    suggestedEssentialsHtml +

    '<div class="product-section">' +
      '<div class="ruo-note">' +
        '<p>The statements on this website have not been evaluated by the U.S. Food and Drug Administration. The products and information provided by Forgewell LLC are not intended to diagnose, treat, cure, or prevent any disease.</p>' +
        '<p>Forgewell LLC is a research chemical supplier. We are not a compounding pharmacy or compounding facility as defined under Section 503A of the Federal Food, Drug, and Cosmetic Act, nor are we an outsourcing facility as defined under Section 503B.</p>' +
        '<p>All products are sold for research, laboratory, or analytical purposes only, and are NOT for human consumption. All sales are final. Customers are responsible for compliance with all applicable laws.</p>' +
      '</div>' +
    '</div>' +

    descriptionHtml +

    (techRows ? '<div class="product-section"><h2>Technical Data</h2><table class="tech-table">' + techRows + '</table></div>' : '');

  wireProductInteractions(product);
  loadProductCoas(product);
  syncColumnHeights();
  window.addEventListener('resize', syncColumnHeights);
}

// Keeps buy-col from growing taller than gallery-col -- CSS grid's default
// stretch would otherwise let buy-col's content height (Kits Available,
// trust badges, COA list can all add up) determine the row height, leaving
// gallery-col stretched with empty space below the photo instead of the
// two columns actually matching. gallery-col has align-self:start (see its
// CSS) so it always sizes to its own natural content regardless of row
// height; this just measures that and caps buy-col to match, with
// .buy-col's overflow-y:auto (also in CSS) scrolling anything that doesn't fit.
// Recomputed on resize since the photo's height is width-driven
// (aspect-ratio), and skipped below 800px to match .product-main's own
// media query, which stacks the columns into one at that width -- no
// side-by-side height to match once they're no longer side by side.
function syncColumnHeights() {
  var galleryCol = document.querySelector('.gallery-col');
  var buyCol = document.querySelector('.buy-col');
  if (!galleryCol || !buyCol) return;
  if (window.innerWidth <= 800) {
    buyCol.style.maxHeight = '';
    return;
  }
  buyCol.style.maxHeight = galleryCol.offsetHeight + 'px';
}

// A product can now have multiple batch-specific COAs (product_coas table,
// one row per batch/lot), so there's no single "the COA" to link to a
// gallery thumbnail the way the old one-PDF-per-product version did --
// that thumbnail slot is left unused for now. Any fetch failure (including
// this endpoint not existing yet on a given deploy) is treated the same as
// "no COAs" and the section just stays hidden, same fail-quiet convention
// the old HEAD-check approach used.
function formatCoaDate(dateStr) {
  // batch_date is a plain calendar date with no time-of-day or timezone
  // meaning, but Postgres's `date` type serializes through pg/Express as a
  // full ISO timestamp ("2026-07-01T00:00:00.000Z"), not a bare "2026-07-01"
  // -- split off everything from 'T' onward first so both shapes work.
  // new Date(dateStr) parses that as UTC midnight, and toLocaleDateString()
  // then renders it in the viewer's LOCAL timezone -- in any zone behind
  // UTC, that silently displays the day before. Building the Date from the
  // local-time constructor instead sidesteps any UTC conversion entirely,
  // so the calendar date shown always matches what's in the data,
  // regardless of the viewer's timezone.
  var datePart = String(dateStr).split('T')[0];
  var parts = datePart.split('-');
  if (parts.length !== 3) return dateStr;
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

async function loadProductCoas(product) {
  var container = document.getElementById('coa-list');
  if (!container) return;
  var coas;
  try {
    var res = await fetch('/api/products/' + encodeURIComponent(product.id) + '/coas');
    if (!res.ok) return;
    coas = await res.json();
  } catch (err) {
    return;
  }
  if (!Array.isArray(coas) || coas.length === 0) return;

  var docIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>';

  container.innerHTML =
    '<h3>Certificates of Analysis</h3>' +
    coas.map(function(coa) {
      var pdfUrl = resolveCoaPath(coa.coa_path);
      if (!pdfUrl) return '';
      return '<div class="coa-list-item">' +
        '<div class="coa-list-item-info">' +
          '<span class="coa-list-item-lot">LOT #' + coa.batch_lot + '</span>' +
          '<span class="coa-list-item-date">' + formatCoaDate(coa.batch_date) + '</span>' +
        '</div>' +
        '<a class="coa-list-item-link" href="' + pdfUrl + '" target="_blank" rel="noopener">' + docIcon + '<span>View PDF</span></a>' +
      '</div>';
    }).join('');
  container.style.display = '';

  // Growing this section can grow buy-col -- resync so buy-col's max-height
  // (set once already in renderProduct) matches gallery-col's height again.
  syncColumnHeights();
}

function wireProductInteractions(product) {
  // Uses history.back() instead of letting this be a normal link navigation.
  // A plain <a href> click sets document.referrer on the destination to this
  // page, same as any other link -- so returning to product A would make A's
  // own getBackLink() see this page as A's referrer and show a "Back to
  // <this page>" link, ping-ponging the two pages back and forth forever.
  // history.back() doesn't have that problem: it either restores the prior
  // page from bfcache with its *original* referrer untouched, or triggers a
  // reload that browsers don't attribute a Referer header to (history
  // traversal isn't treated as "leaving via a link" the way a normal
  // navigation is). The href stays in the markup so middle-click/ctrl-click/
  // right-click-open-in-new-tab still work normally -- those open a new tab
  // with its own independent history, so there's no loop risk to guard
  // there, hence only a plain unmodified left-click is intercepted.
  var backLinkAnchor = document.getElementById('back-link-anchor');
  if (backLinkAnchor) {
    backLinkAnchor.addEventListener('click', function(e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = backLinkAnchor.getAttribute('href');
      }
    });
  }

  var qtyInput = document.getElementById('qty-input');
  var minusBtn = document.getElementById('qty-minus');
  var plusBtn = document.getElementById('qty-plus');

  minusBtn.addEventListener('click', function() {
    var v = parseInt(qtyInput.value, 10) || 1;
    if (v > 1) qtyInput.value = v - 1;
  });
  plusBtn.addEventListener('click', function() {
    var v = parseInt(qtyInput.value, 10) || 1;
    qtyInput.value = v + 1;
  });

  document.getElementById('add-to-cart-btn').addEventListener('click', function() {
    var qty = parseInt(qtyInput.value, 10) || 1;
    for (var i = 0; i < qty; i++) addToCart(product.id);
  });

  document.getElementById('buy-now-btn').addEventListener('click', function() {
    var qty = parseInt(qtyInput.value, 10) || 1;
    for (var i = 0; i < qty; i++) addToCart(product.id);
    window.location.href = '/checkout.html';
  });

  var sizeOptions = document.querySelectorAll('.size-option');
  sizeOptions.forEach(function(opt) {
    opt.addEventListener('click', function() {
      var newId = opt.getAttribute('data-id');
      if (newId !== product.id) {
        window.location.href = '/product.html?id=' + encodeURIComponent(newId);
      }
    });
  });

  // Delegated since gallery-thumbs starts empty. Nothing currently populates
  // it (the old single-COA doc thumbnail was removed along with wireCoaLink()
  // in favor of the multi-batch COA list -- see loadProductCoas()); this stays
  // dormant, ready for whenever a product actually gets more than one photo.
  document.getElementById('gallery-thumbs').addEventListener('click', function(e) {
    var thumb = e.target.closest('[data-role="image-thumb"]');
    if (!thumb) return;
    document.getElementById('gallery-main-img').src = thumb.src;
    document.querySelectorAll('#gallery-thumbs [data-role="image-thumb"]').forEach(function(t) {
      t.classList.remove('active');
    });
    thumb.classList.add('active');
  });

  // Delegated for the same reason as gallery-thumbs above: this grid only
  // exists in the DOM when buildSuggestedEssentialsSection() produced one.
  // Clicking Add to Cart adds that essential (qty 1) without navigating;
  // clicking anywhere else on a card goes to that essential's own product
  // page, matching how every other product card on the site behaves.
  var essentialsGrid = document.getElementById('suggested-essentials-grid');
  if (essentialsGrid) {
    essentialsGrid.addEventListener('click', function(e) {
      var addBtn = e.target.closest('[data-add-essential-id]');
      if (addBtn) {
        addToCart(addBtn.getAttribute('data-add-essential-id'));
        return;
      }
      var card = e.target.closest('.essential-card');
      if (card) {
        window.location.href = '/product.html?id=' + encodeURIComponent(card.getAttribute('data-product-id'));
      }
    });
  }

  // Same delegation pattern as suggested-essentials-grid above, for the
  // same reason: only exists in the DOM when buildKitsAvailableSection()
  // produced one.
  var kitsGrid = document.getElementById('kits-available-grid');
  if (kitsGrid) {
    kitsGrid.addEventListener('click', function(e) {
      var addBtn = e.target.closest('[data-add-kit-id]');
      if (addBtn) {
        addToCart(addBtn.getAttribute('data-add-kit-id'));
        return;
      }
      var card = e.target.closest('.essential-card');
      if (card) {
        window.location.href = '/product.html?id=' + encodeURIComponent(card.getAttribute('data-product-id'));
      }
    });
  }
}

// Base reference records for blend/kit products -- intentionally $0, never
// meant to be sold standalone. Confirmed intentional, not a pending-Apex
// gap. Same handling as missing-image products: not reachable as their own
// page, not shown in the shop grid.
var EXCLUDED_COMPONENT_IDS = ['cjc-1295', 'semax', 'selank', 'mt-2', 'pt-141'];

async function initProductPage() {
  var id = getQueryParam('id');
  if (!id) {
    renderError('No product specified.');
    return;
  }
  if (EXCLUDED_COMPONENT_IDS.indexOf(id) !== -1) {
    renderError('This product page is not available.');
    return;
  }
  try {
    var res = await fetch('/api/products');
    var products = await res.json();
    allProducts = products; // shared with cart script

    var product = products.find(function(p) { return String(p.id) === id; });
    if (!product) {
      renderError('Product not found.');
      return;
    }

    var base = baseLabel(product.name);
    var siblings = products.filter(function(p) {
      return baseLabel(p.name) === base && EXCLUDED_COMPONENT_IDS.indexOf(p.id) === -1;
    });

    renderProduct(product, siblings);
  } catch (err) {
    console.error('Failed to load product:', err);
    renderError('Could not load this product right now.');
  }
}

let productsReady = initProductPage();

</script>

</body>
</html>
