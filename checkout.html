<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgewell — Checkout</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.png">
<style>
@font-face { font-family:'Quicksand'; src:url('/fonts/quicksand-variable.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
:root{ --navy:#1B4B8C; --navy-dark:#123056; --green:#3FA34D; --gray:#6b6b6b; --bg:#FFFFFF; --panel:#F7F8F6; --line:#E4E4E0; }
*{box-sizing:border-box;}
body{ background:var(--bg); color:#1a1a1a; font-family:'Quicksand',sans-serif; font-weight:500; margin:0; }
a{color:inherit;}

/* ---- header (single-row, matches header.html) ---- */
header{
  display:flex; align-items:center; flex-wrap:nowrap; gap:18px;
  padding:12px 20px; max-width:1200px; margin:0 auto;
  position:sticky; top:0; z-index:10;
  background:#fff; border-bottom:1px solid var(--line);
}
.logo-mark{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.logo-word{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.2rem; color:var(--navy); white-space:nowrap; }
.logo-word .well{ color:var(--green); }
.header-nav-links{ display:flex; align-items:center; gap:22px; flex-shrink:0; margin-left:16px; }
.header-nav-link{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; color:var(--navy); text-decoration:none; white-space:nowrap; }
.header-nav-link:hover{ color:var(--green); }
.header-search-row{ position:relative; flex:0 1 240px; min-width:0; max-width:240px; margin-left:auto; }
.header-search-row input{ width:100%; box-sizing:border-box; min-width:0; padding:11px 16px 11px 40px; border-radius:6px; border:1.5px solid var(--line); background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6b6b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center/16px 16px; color:#333; font-size:0.95rem; font-family:'Quicksand',sans-serif; }
.header-search-row input:focus{ outline:none; border-color:var(--navy); }
.search-icon-btn{ position:absolute; top:50%; transform:translateY(-50%); padding:0; margin:0; border:none; background:transparent; cursor:pointer; }
.header-search-row .search-icon-btn{ left:14px; width:16px; height:16px; }
.menu-toggle{ display:flex; align-items:center; gap:22px; flex-shrink:0; position:relative; }
.hamburger{ display:none; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
.hamburger span{ display:block; width:22px; height:2.5px; background:var(--navy); border-radius:2px; }
.nav-overlay{ display:none; position:absolute; top:calc(100% + 12px); right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(18,48,86,0.16); z-index:9999; min-width:170px; padding:6px 0; }
.nav-overlay.open{ display:block; }
.nav-overlay-inner{ display:flex; flex-direction:column; }
.nav-overlay-inner a{ color:var(--navy-dark); font-size:0.9rem; font-weight:700; text-decoration:none; font-family:'Quicksand',sans-serif; padding:11px 18px; }
.nav-overlay-inner a:hover{ background:var(--panel); }
.cart-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; text-decoration:none; }
.cart-icon:hover{ color:var(--green); }
.cart-icon-inner{ display:flex; align-items:center; position:relative; }
.cart-count{ position:absolute; top:-2px; right:-4px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--navy); color:#fff; font-size:0.6rem; font-weight:700; line-height:15px; text-align:center; display:none; font-family:'Quicksand',sans-serif; box-sizing:border-box; }
.cart-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }
.login-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; }
.login-icon:hover{ color:var(--green); }
.login-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }
.logout-icon-btn{ display:flex; align-items:center; color:var(--navy); cursor:pointer; padding:4px; }
.logout-icon-btn:hover{ color:var(--green); }

@media (max-width: 1150px){
  .header-nav-links{ display:none; }
  .hamburger{ display:flex; }
  header{ gap:10px; padding:10px 14px; }
  .header-search-row{ max-width:200px; }
  .logo-word{ font-size:0.95rem; }
}
@media (max-width: 420px){
  header{ gap:6px; padding:8px 10px; }
  .header-search-row{ max-width:160px; }
  .header-search-row input{ padding:10px 12px 10px 34px; font-size:0.8rem; }
  .header-search-row .search-icon-btn{ left:11px; width:14px; height:14px; }
  .menu-toggle{ gap:10px; }
  .cart-icon svg{ width:18px; height:18px; }
  .cart-count{ font-size:0.55rem; min-width:13px; height:13px; line-height:13px; }
  .cart-icon-label{ display:none; }
  .logo-word{ font-size:0.85rem; }
  .login-icon svg{ width:18px; height:18px; }
  .login-icon-label{ display:none; }
}

/* ---- footer (matches shop.html) ---- */
footer.footer-main{margin-top:60px; padding:40px 20px 24px; background:var(--navy-dark); border-top:1px solid var(--line); font-family:'Quicksand',sans-serif;}
.footer-grid{max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:28px; margin-bottom:28px;}
.footer-col{ text-align:left; }
.footer-col h4{color:rgba(255,255,255,0.45); font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin:0 0 14px;}
.footer-col a{display:block; color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.85rem; margin-bottom:8px; overflow-wrap:break-word;}
.footer-col a:hover{ color:var(--green); }
.footer-col p{ color:rgba(255,255,255,0.6); font-size:0.82rem; line-height:1.6; margin:0 0 6px; overflow-wrap:break-word; }
.footer-social{display:flex; gap:10px;}
.footer-social a{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; margin:0;}
.footer-signup-input{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-family:'Quicksand',sans-serif;font-size:0.78rem;margin-bottom:8px;box-sizing:border-box;background:rgba(255,255,255,0.08);color:#fff;}
.footer-signup-input::placeholder{ color:rgba(255,255,255,0.4); }
.footer-signup-btn{width:100%;padding:9px;background:var(--green);color:#fff;border:none;border-radius:6px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:0.78rem;cursor:pointer;}
.footer-signup-btn:hover{ background:#358f41; }
.footer-signup-msg{font-size:0.75rem; margin-top:6px; color:var(--green);}
.footer-legal{max-width:1200px; margin:24px auto 0; font-size:0.7rem; color:rgba(255,255,255,0.5); line-height:1.5; border-top:1px solid rgba(255,255,255,0.15); padding-top:16px;}
.footer-legal a{ color:rgba(255,255,255,0.75); text-decoration:underline; }
.footer-legal a:hover{ color:#fff; }
.footer-info-row{ position:relative; display:flex; align-items:center; min-height:34px; max-width:1200px; margin:0 auto 20px; }
.footer-info-brand{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.footer-logo-mark{ flex-shrink:0; }
.footer-flag-icon{ flex-shrink:0; border-radius:2px; overflow:hidden; margin-left:16px; }
.footer-brand-name{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.8rem; white-space:nowrap; }
.footer-brand-name .forge{ color:#fff; }
.footer-brand-name .well{ color:var(--green); }
.footer-country-label{ font-size:0.72rem; color:rgba(255,255,255,0.6); white-space:nowrap; }
.footer-info-row .footer-catalog-search{ margin-left:auto; }
.footer-catalog-search{ max-width:220px; width:100%; position:relative; }
.footer-catalog-search .search-icon-btn{ left:10px; width:14px; height:14px; }
.footer-catalog-search input{ width:100%; box-sizing:border-box; padding:9px 10px 9px 32px; border-radius:6px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.05) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='0.6'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 10px center/14px 14px; color:#fff; font-size:0.8rem; }
.footer-catalog-search input::placeholder{ color:rgba(255,255,255,0.45); }
.footer-bottom{max-width:1200px; margin:16px auto 0; text-align:center;}
.footer-copyright{font-size:0.75rem; color:rgba(255,255,255,0.5); margin:0 0 12px;}
.footer-legal-links{display:flex; flex-wrap:wrap; justify-content:center; gap:14px;}
.footer-legal-links a{color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.75rem;}
.footer-legal-links a:hover{ color:#fff; text-decoration:underline; }
@media (max-width: 600px) {
  .footer-info-row{ flex-direction:column; align-items:center; gap:14px; min-height:0; }
  .footer-info-brand{ position:static; transform:none; }
  .footer-info-row .footer-catalog-search{ margin-left:0; }
}

/* ---- Checkout page: contact/shipping form, shipping method, order summary ---- */
.checkout-page-wrap{ max-width:1200px; margin:32px auto 80px; padding:0 24px; }
.checkout-page-wrap h1{ color:var(--navy-dark); font-size:1.6rem; margin-bottom:24px; }
.checkout-page-grid{ display:grid; grid-template-columns:1fr 340px; gap:32px; align-items:start; }

.checkout-section{ border:1px solid var(--line); border-radius:10px; padding:20px 24px; margin-bottom:24px; }
.checkout-section h2{ color:var(--navy-dark); font-size:1.05rem; margin:0 0 16px; }

.checkout-field-label{
  display:block; font-size:0.72rem; font-weight:700; color:var(--navy-dark);
  text-transform:uppercase; letter-spacing:0.03em; margin:14px 0 4px;
}
.checkout-field-label:first-child{ margin-top:0; }
.checkout-section input[type="email"],
.checkout-section input[type="text"]{
  width:100%; box-sizing:border-box; padding:11px 12px;
  border:1.5px solid var(--line); border-radius:8px; font-size:0.88rem;
  font-family:'Quicksand',sans-serif; color:#333;
}
.checkout-section input:focus{ outline:none; border-color:var(--navy); }
.checkout-field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.checkout-field-error{
  color:#c0392b; font-size:0.75rem; margin:6px 0 0; display:none;
}
.checkout-field-error.show{ display:block; }

.shipping-method-option{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  border:1.5px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:10px;
  cursor:pointer;
}
.shipping-method-option:has(input:checked){ border-color:var(--navy); background:var(--panel); }
.shipping-method-option-left{ display:flex; align-items:center; gap:12px; }
.shipping-method-option input[type="radio"]{ width:16px; height:16px; accent-color:var(--navy); flex-shrink:0; }
.shipping-method-name{ font-weight:700; font-size:0.88rem; color:var(--navy-dark); }
.shipping-method-price{ font-weight:700; font-size:0.9rem; color:var(--navy-dark); white-space:nowrap; }

.checkout-summary-card{ border:1px solid var(--line); border-radius:10px; padding:20px; background:var(--panel); position:sticky; top:90px; }
.checkout-summary-line{ display:flex; justify-content:space-between; font-size:0.85rem; color:#444; margin-bottom:10px; }
.checkout-summary-discount{ color:var(--green); font-weight:700; }
.checkout-promo-row{ display:flex; gap:8px; margin:2px 0 6px; }
.checkout-promo-row input{ flex:1; min-width:0; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-family:'Quicksand',sans-serif; font-size:0.82rem; box-sizing:border-box; background:#fff; }
.checkout-promo-row button{ padding:9px 14px; background:#fff; border:1.5px solid var(--navy); color:var(--navy); border-radius:6px; font-weight:700; font-size:0.8rem; cursor:pointer; font-family:'Quicksand',sans-serif; }
.checkout-promo-row button:hover{ background:var(--navy); color:#fff; }
.checkout-promo-msg{ font-size:0.72rem; color:var(--gray); min-height:14px; margin-bottom:10px; }
.checkout-promo-msg.error{ color:#c0392b; }
.checkout-total-row{ display:flex; justify-content:space-between; font-weight:700; font-size:1.05rem; color:var(--navy-dark); padding-top:14px; border-top:1px solid var(--line); margin-top:4px; margin-bottom:16px; }
.checkout-place-order-btn{ width:100%; padding:14px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-weight:700; font-size:0.95rem; cursor:pointer; font-family:'Quicksand',sans-serif; }
.checkout-place-order-btn:hover{ background:var(--navy-dark); }
.checkout-back-link{ display:block; text-align:center; margin-top:14px; color:var(--navy); font-size:0.8rem; text-decoration:none; }
.checkout-back-link:hover{ text-decoration:underline; }

@media (max-width:800px){
  .checkout-page-grid{ grid-template-columns:1fr; }
  .checkout-summary-card{ position:static; }
}
@media (max-width:600px){
  .checkout-page-wrap{ margin:20px auto 60px; padding:0 16px; }
  .checkout-section{ padding:16px; }
}
</style>

</head>
<body>

<div id="header-placeholder"></div>



<div class="checkout-page-wrap">
  <h1>Checkout</h1>

  <div class="checkout-page-grid">
    <div class="checkout-form-col">
      <div class="checkout-section">
        <h2>Contact &amp; Shipping Info</h2>

        <label class="checkout-field-label" for="checkout-email-input">Email</label>
        <input type="email" id="checkout-email-input" placeholder="you@example.com" autocomplete="email">
        <p id="checkout-email-error" class="checkout-field-error">Please enter a valid email address.</p>

        <label class="checkout-field-label" for="checkout-ship-name">Full name</label>
        <input type="text" id="checkout-ship-name" placeholder="Jane Smith" autocomplete="name">

        <label class="checkout-field-label" for="checkout-ship-line1">Address</label>
        <input type="text" id="checkout-ship-line1" placeholder="123 Main St" autocomplete="address-line1">

        <label class="checkout-field-label" for="checkout-ship-line2">Apt / Suite (optional)</label>
        <input type="text" id="checkout-ship-line2" placeholder="Apt 4B" autocomplete="address-line2">

        <div class="checkout-field-row">
          <div>
            <label class="checkout-field-label" for="checkout-ship-city">City</label>
            <input type="text" id="checkout-ship-city" placeholder="Wichita" autocomplete="address-level2">
          </div>
          <div>
            <label class="checkout-field-label" for="checkout-ship-state">State</label>
            <input type="text" id="checkout-ship-state" placeholder="KS" autocomplete="address-level1">
          </div>
        </div>

        <div class="checkout-field-row">
          <div>
            <label class="checkout-field-label" for="checkout-ship-zip">ZIP code</label>
            <input type="text" id="checkout-ship-zip" placeholder="67202" autocomplete="postal-code">
          </div>
          <div>
            <label class="checkout-field-label" for="checkout-ship-country">Country</label>
            <input type="text" id="checkout-ship-country" placeholder="US" autocomplete="country" value="US">
          </div>
        </div>

        <p id="checkout-shipping-error" class="checkout-field-error">Please fill in all required shipping fields.</p>
      </div>

      <div class="checkout-section">
        <h2>Shipping Method</h2>
        <div id="shipping-method-list"></div>
      </div>
    </div>

    <div class="checkout-summary-col">
      <div class="checkout-summary-card">
        <div id="checkout-summary-lines"></div>
        <div class="checkout-promo-row">
          <input type="text" id="checkout-promo-input" placeholder="Promo code">
          <button type="button" id="checkout-promo-btn">Apply</button>
        </div>
        <div id="checkout-promo-msg" class="checkout-promo-msg"></div>
        <div class="checkout-total-row">
          <span>Order Total</span>
          <span id="checkout-total">$0.00</span>
        </div>
        <button type="button" id="checkout-place-order-btn" class="checkout-place-order-btn">Place Order</button>
        <a href="/cart.html" class="checkout-back-link">&larr; Back to Cart</a>
      </div>
    </div>
  </div>
</div>







<div id="footer-placeholder"></div>

<script>
let allProducts = [];
let cart = JSON.parse(localStorage.getItem('forgewell_cart') || '[]');

async function catalogSearchJump(query) {
  query = query.trim().toLowerCase();
  if (!query) return;
  await productsReady;
  const match = allProducts.find(p => {
    const base = (p.name || '').replace(/\s*\(?\d+(\.\d+)?\s?(mg|mcg|iu|ml)\)?\s*$/i, '').trim().toLowerCase();
    return base === query || base.indexOf(query) !== -1;
  });
  if (match) {
    window.location.href = '/product.html?id=' + encodeURIComponent(match.id);
  } else {
    window.location.href = '/shop.html#tabs';
  }
}

// Wires up all header/footer interactivity. Runs only after header.html and
// footer.html have been fetched and injected below -- their elements don't
// exist in the DOM before then.
function wireHeaderFooter() {
  var footerSearchInput = document.getElementById('footer-catalog-search-input');
  if (footerSearchInput) {
    footerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var footerSearchIconBtn = document.getElementById('footer-search-icon-btn');
  if (footerSearchIconBtn && footerSearchInput) {
    footerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var headerSearchInput = document.getElementById('header-catalog-search-input');
  if (headerSearchInput) {
    headerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(headerSearchInput.value);
    });
  }
  var headerSearchIconBtn = document.getElementById('header-search-icon-btn');
  if (headerSearchIconBtn && headerSearchInput) {
    headerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(headerSearchInput.value);
    });
  }

  var hamBtn = document.getElementById('hamburger-btn');
  var overlay = document.getElementById('nav-overlay');
  if (hamBtn && overlay) {
    hamBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.toggle('open');
    });
  }
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target.closest('a')) overlay.classList.remove('open');
    });
    document.addEventListener('click', function(e) {
      if (overlay.classList.contains('open') && !overlay.contains(e.target)) {
        overlay.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') overlay.classList.remove('open');
    });
  }

  // Checks whether the person is logged in and updates the header's account
  // icon accordingly -- shows "Hi, [name]" linking to order history if
  // logged in, "Sign In" linking to the login/signup page otherwise. Runs
  // on every page that shares this header.
  var loginIcon = document.getElementById('account-icon');
  if (loginIcon) {
    fetch('/api/auth/me', { credentials: 'include' })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(customer) {
        if (customer) {
          loginIcon.href = '/orders.html';
          loginIcon.title = 'My Account (' + customer.email + ')';
          // Name wasn't always required at signup -- older accounts can
          // still have a null name, so fall back to the email's local-part
          // rather than showing a blank/broken greeting.
          var displayName = customer.name || customer.email.split('@')[0];
          var labelEl = loginIcon.querySelector('.login-icon-label');
          if (labelEl) labelEl.textContent = 'Hi, ' + displayName;

          function doLogout() {
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
              .then(function() { window.location.href = '/shop.html'; });
          }

          // Icon-only sign-out control next to the account icon -- only
          // created/shown once logged in, so it adds no width to the
          // header's tightly-tuned breakpoint math for the (far more
          // common) logged-out state. Gives desktop-width visitors a
          // direct sign-out path: today the hamburger dropdown below
          // (the only other place "Log Out" lives) is hidden above 1150px.
          var logoutIconBtn = document.getElementById('logout-icon-btn');
          if (logoutIconBtn) {
            logoutIconBtn.style.display = 'flex';
            logoutIconBtn.addEventListener('click', function(e) {
              e.preventDefault();
              doLogout();
            });
          }

          var navInner = document.querySelector('.nav-overlay-inner');
          if (navInner && !document.getElementById('nav-logout-link')) {
            var logoutLink = document.createElement('a');
            logoutLink.href = '#';
            logoutLink.id = 'nav-logout-link';
            logoutLink.textContent = 'Log Out';
            logoutLink.addEventListener('click', function(e) {
              e.preventDefault();
              doLogout();
            });
            navInner.appendChild(logoutLink);
          }
        }
      })
      .catch(function() { /* not logged in or request failed -- leave icon pointing to /login.html */ });
  }

  var signupBtn = document.getElementById('footer-signup-btn');
  if (signupBtn) {
    signupBtn.addEventListener('click', async () => {
      const input = document.getElementById('footer-email-input');
      const msg = document.getElementById('footer-signup-msg');
      const email = input.value.trim();
      if (!email || email.indexOf('@') === -1) {
        msg.style.color = '#c0392b';
        msg.textContent = 'Please enter a valid email.';
        return;
      }
      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email: email})
        });
        const data = await res.json();
        msg.style.color = '#3FA34D';
        msg.textContent = data.alreadySubscribed
          ? 'Already signed up — code: ' + data.discountCode
          : 'Success! Your code: ' + data.discountCode;
        input.value = '';
      } catch (err) {
        msg.style.color = '#c0392b';
        msg.textContent = 'Something went wrong. Please try again.';
      }
    });
  }

  // Restores the header's cart count from localStorage now that the header
  // actually exists in the DOM (it didn't yet when updateCartIcon() first
  // ran further down this script).
  updateCartIcon();
}

Promise.all([
  fetch('/header.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('header-placeholder').innerHTML = html;
  }),
  fetch('/footer.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('footer-placeholder').innerHTML = html;
  })
]).then(wireHeaderFooter).catch(function(err) {
  console.error('Failed to load shared header/footer', err);
});

// Only used here to look up each cart item's image_path for display --
// cart.html has no product cards, so there's no card-population step
// like the other pages' loadProducts() has.
// Only used here to keep catalogSearchJump()/the header search box working
// the same way it does on every other page -- checkout.html doesn't render
// any product cards or images itself.
async function loadProducts() {
  try {
    const res = await fetch('/api/products');
    allProducts = await res.json();
  } catch (err) {
    console.error('Failed to load products from backend:', err);
  }
}

function saveCart() {
  localStorage.setItem('forgewell_cart', JSON.stringify(cart));
  updateCartIcon();
}

function updateCartIcon() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById('cart-count');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }
}

// Mirrors the exact same rule as the backend (routes/checkout.js):
// flat 10% off, either buy 3+ of one item OR spend $300+ total —
// whichever gives the bigger discount, never both stacked. This is
// just a live preview for the customer; the backend recalculates the
// real charge from scratch at checkout time, so this can't be gamed.
const BULK_QTY_THRESHOLD = 3;
const BULK_QTY_DISCOUNT = 0.10;
const CART_TOTAL_THRESHOLD = 300;
const CART_TOTAL_DISCOUNT = 0.10;

function calculateCartDiscount(cartItems) {
  let rawTotal = 0;
  let perItemTotal = 0;
  cartItems.forEach(item => {
    const lineTotal = item.price * item.qty;
    rawTotal += lineTotal;
    perItemTotal += item.qty >= BULK_QTY_THRESHOLD
      ? lineTotal * (1 - BULK_QTY_DISCOUNT)
      : lineTotal;
  });
  const cartWideTotal = rawTotal >= CART_TOTAL_THRESHOLD
    ? rawTotal * (1 - CART_TOTAL_DISCOUNT)
    : rawTotal;
  const finalTotal = Math.min(perItemTotal, cartWideTotal, rawTotal);
  return {
    subtotal: rawTotal,
    total: finalTotal,
    discountApplied: finalTotal < rawTotal,
    savings: rawTotal - finalTotal,
  };
}

const SHIPPING_METHODS = [
  { id: 'usps_flat', label: 'USPS Flat Rate', cost: 11.99 },
  { id: 'ups_fedex_ground', label: 'UPS/FedEx Ground (3-5 Days)', cost: 14.99 },
  { id: 'ups_fedex_2day', label: 'UPS/FedEx 2nd Day Air', cost: 21.99 },
];

function renderShippingMethods() {
  const list = document.getElementById('shipping-method-list');
  list.innerHTML = SHIPPING_METHODS.map(function(method, i) {
    return '<label class="shipping-method-option">' +
      '<span class="shipping-method-option-left">' +
        '<input type="radio" name="shipping-method" value="' + method.id + '"' + (i === 0 ? ' checked' : '') + '>' +
        '<span class="shipping-method-name">' + method.label + '</span>' +
      '</span>' +
      '<span class="shipping-method-price">$' + method.cost.toFixed(2) + '</span>' +
    '</label>';
  }).join('');
}

function getSelectedShippingMethod() {
  const checked = document.querySelector('input[name="shipping-method"]:checked');
  return SHIPPING_METHODS.find(function(m) { return m.id === (checked && checked.value); }) || SHIPPING_METHODS[0];
}

// NOTE: like the discount preview above, this total is a client-side
// preview only. Today's /api/checkout payload doesn't carry a shipping
// method at all (kept unchanged, per the "reuse the payment flow as-is"
// requirement), so there's no guarantee the amount shown here matches
// whatever the external backend actually charges.
function renderOrderSummary() {
  const { subtotal, total, discountApplied, savings } = calculateCartDiscount(cart);
  const shippingMethod = getSelectedShippingMethod();
  const grandTotal = total + shippingMethod.cost;

  const itemCount = cart.reduce((sum, i) => sum + i.qty, 0);
  let html = '<div class="checkout-summary-line"><span>Subtotal (' + itemCount + ' item' + (itemCount === 1 ? '' : 's') + ')</span><span>$' + subtotal.toFixed(2) + '</span></div>';
  if (discountApplied) {
    html += '<div class="checkout-summary-line checkout-summary-discount"><span>Discount</span><span>-$' + savings.toFixed(2) + '</span></div>';
  }
  html += '<div class="checkout-summary-line"><span>Shipping</span><span>$' + shippingMethod.cost.toFixed(2) + '</span></div>';
  document.getElementById('checkout-summary-lines').innerHTML = html;
  document.getElementById('checkout-total').textContent = '$' + grandTotal.toFixed(2);
}

if (cart.length === 0) {
  window.location.href = '/cart.html';
} else {
  const emailInput = document.getElementById('checkout-email-input');
  const emailError = document.getElementById('checkout-email-error');
  const shippingError = document.getElementById('checkout-shipping-error');
  const shipFields = {
    name: document.getElementById('checkout-ship-name'),
    line1: document.getElementById('checkout-ship-line1'),
    line2: document.getElementById('checkout-ship-line2'),
    city: document.getElementById('checkout-ship-city'),
    state: document.getElementById('checkout-ship-state'),
    zip: document.getElementById('checkout-ship-zip'),
    country: document.getElementById('checkout-ship-country'),
  };

  // Autofill from whatever was saved on a previous successful checkout
  const savedEmail = localStorage.getItem('forgewell_checkout_email');
  const savedShipping = JSON.parse(localStorage.getItem('forgewell_shipping_address') || 'null');
  emailInput.value = savedEmail || '';
  if (savedShipping) {
    Object.keys(shipFields).forEach(function(key) {
      if (shipFields[key] && savedShipping[key]) shipFields[key].value = savedShipping[key];
    });
  }
  if (!shipFields.country.value) shipFields.country.value = 'US';

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  // No live validation here (that requires the email + a server round trip
  // to check redemption history) -- same "preview only" role cart.html's
  // copy of this field plays. The real check happens in POST /api/checkout
  // when Place Order is actually clicked, below.
  const promoInput = document.getElementById('checkout-promo-input');
  const promoMsg = document.getElementById('checkout-promo-msg');
  const savedPromoCode = localStorage.getItem('forgewell_promo_code');
  if (savedPromoCode) promoInput.value = savedPromoCode;
  document.getElementById('checkout-promo-btn').addEventListener('click', function() {
    const code = promoInput.value.trim();
    promoMsg.classList.remove('error');
    if (!code) {
      localStorage.removeItem('forgewell_promo_code');
      promoMsg.textContent = '';
      return;
    }
    localStorage.setItem('forgewell_promo_code', code);
    promoMsg.textContent = "Code will be applied when you place your order.";
  });

  renderShippingMethods();
  renderOrderSummary();
  document.getElementById('shipping-method-list').addEventListener('change', renderOrderSummary);

  document.getElementById('checkout-place-order-btn').addEventListener('click', async function() {
    const email = emailInput.value.trim();
    if (!isValidEmail(email)) {
      emailError.classList.add('show');
      return;
    }
    emailError.classList.remove('show');

    const shippingAddress = {
      name: shipFields.name.value.trim(),
      line1: shipFields.line1.value.trim(),
      line2: shipFields.line2.value.trim(),
      city: shipFields.city.value.trim(),
      state: shipFields.state.value.trim(),
      zip: shipFields.zip.value.trim(),
      country: shipFields.country.value.trim(),
    };
    // line2 is optional — everything else required, matches checkout.js validation
    const requiredOk = shippingAddress.name && shippingAddress.line1 && shippingAddress.city
      && shippingAddress.state && shippingAddress.zip && shippingAddress.country;
    if (!requiredOk) {
      shippingError.classList.add('show');
      return;
    }
    shippingError.classList.remove('show');

    localStorage.setItem('forgewell_checkout_email', email);
    localStorage.setItem('forgewell_shipping_address', JSON.stringify(shippingAddress));

    const promoCode = promoInput.value.trim();
    promoMsg.classList.remove('error');

    try {
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items: cart.map(i => ({ productId: i.productId, qty: i.qty })),
          customerEmail: email,
          shippingAddress: shippingAddress,
          discountCode: promoCode || undefined
        })
      });
      const data = await res.json();

      // The backend rejects an invalid/already-used code with a 400 and no
      // order is created -- surface that inline on the promo field (that's
      // the field the problem actually belongs to) rather than the earlier
      // fallback below, which used to fire for this too with a misleading
      // "checkout succeeded" message. Any other 400/500 (bad shipping data,
      // unknown product, payment provider issue, etc.) isn't about the
      // promo code, so that still falls back to the generic alert below --
      // this only narrows the one case this change is actually about.
      if (!res.ok) {
        if (data.error && /promo code/i.test(data.error)) {
          promoMsg.classList.add('error');
          promoMsg.textContent = data.error;
          return;
        }
        alert(data.error || 'Checkout failed — please try again.');
        console.error('Checkout failed:', data);
        return;
      }

      if (data.payment && data.payment.paymentUrl) {
        localStorage.setItem('forgewell_last_order_id', data.orderId);
        localStorage.removeItem('forgewell_promo_code');
        // Cart is intentionally left alone here -- this order is still
        // pending_payment, not paid. It's cleared on order-confirmation.html
        // once polling actually observes status === 'paid', so backing out
        // of PayRam (or the payment failing) leaves the cart intact.
        window.location.href = data.payment.paymentUrl;
        return;
      }
      alert('Checkout succeeded but no payment link was returned — check the console and contact support.');
      console.error('Checkout response missing payment.paymentUrl:', data);
    } catch (err) {
      console.error('Checkout failed:', err);
      alert('Checkout failed — check the console.');
    }
  });
}

let productsReady = loadProducts();
updateCartIcon();



</script>
