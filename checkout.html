<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgewell — Checkout</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.png">
<style>
@font-face { font-family:'Quicksand'; src:url('/fonts/quicksand-variable.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
:root{ --navy:#1B4B8C; --navy-dark:#123056; --green:#3FA34D; --gray:#6b6b6b; --bg:#FFFFFF; --panel:#F7F8F6; --line:#E4E4E0; }
*{box-sizing:border-box;}
body{ background:var(--bg); color:#1a1a1a; font-family:'Quicksand',sans-serif; font-weight:500; margin:0; }
a{color:inherit;}

/* ---- header (single-row, matches header.html) ---- */
header{
  display:flex; align-items:center; flex-wrap:nowrap; gap:18px;
  padding:12px 20px; max-width:1200px; margin:0 auto;
  position:sticky; top:0; z-index:10;
  background:#fff; border-bottom:1px solid var(--line);
}
.logo-mark{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.logo-word{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.2rem; color:var(--navy); white-space:nowrap; }
.logo-word .well{ color:var(--green); }
.header-nav-links{ display:flex; align-items:center; gap:22px; flex-shrink:0; margin-left:16px; }
.header-nav-link{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; color:var(--navy); text-decoration:none; white-space:nowrap; }
.header-nav-link:hover{ color:var(--green); }
.header-search-row{ position:relative; flex:0 1 240px; min-width:0; max-width:240px; margin-left:auto; }
.header-search-row input{ width:100%; box-sizing:border-box; min-width:0; padding:11px 16px 11px 40px; border-radius:6px; border:1.5px solid var(--line); background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6b6b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center/16px 16px; color:#333; font-size:0.95rem; font-family:'Quicksand',sans-serif; }
.header-search-row input:focus{ outline:none; border-color:var(--navy); }
.search-icon-btn{ position:absolute; top:50%; transform:translateY(-50%); padding:0; margin:0; border:none; background:transparent; cursor:pointer; }
.header-search-row .search-icon-btn{ left:14px; width:16px; height:16px; }
.menu-toggle{ display:flex; align-items:center; gap:22px; flex-shrink:0; position:relative; }
.hamburger{ display:none; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
.hamburger span{ display:block; width:22px; height:2.5px; background:var(--navy); border-radius:2px; }
.nav-overlay{ display:none; position:absolute; top:calc(100% + 12px); right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(18,48,86,0.16); z-index:9999; min-width:170px; padding:6px 0; }
.nav-overlay.open{ display:block; }
.nav-overlay-inner{ display:flex; flex-direction:column; }
.nav-overlay-inner a{ color:var(--navy-dark); font-size:0.9rem; font-weight:700; text-decoration:none; font-family:'Quicksand',sans-serif; padding:11px 18px; }
.nav-overlay-inner a:hover{ background:var(--panel); }
.cart-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; text-decoration:none; }
.cart-icon:hover{ color:var(--green); }
.cart-icon-inner{ display:flex; align-items:center; position:relative; }
.cart-count{ position:absolute; top:-2px; right:-4px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--navy); color:#fff; font-size:0.6rem; font-weight:700; line-height:15px; text-align:center; display:none; font-family:'Quicksand',sans-serif; box-sizing:border-box; }
.cart-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }
.login-icon{ display:flex; align-items:center; gap:8px; color:var(--navy); cursor:pointer; padding:4px; }
.login-icon:hover{ color:var(--green); }
.login-icon-label{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.95rem; white-space:nowrap; }

@media (max-width: 1150px){
  .header-nav-links{ display:none; }
  .hamburger{ display:flex; }
  header{ gap:10px; padding:10px 14px; }
  .header-search-row{ max-width:200px; }
  .logo-word{ font-size:0.95rem; }
  /* Icon-only for the whole hamburger-mode range, not just below 420px --
     "Cart" plus the login label was tight enough to visibly overlap the
     search box's icon in the 421-455px window specifically (measured
     directly), so the fix needs to cover that window too, not just the
     narrower phones the 420px tier already handled. */
  .cart-icon-label{ display:none; }
}
@media (max-width: 420px){
  header{ gap:6px; padding:8px 10px; }
  .header-search-row{ max-width:160px; }
  .header-search-row input{ padding:10px 12px 10px 34px; font-size:0.8rem; }
  .header-search-row .search-icon-btn{ left:11px; width:14px; height:14px; }
  .menu-toggle{ gap:10px; }
  .cart-icon svg{ width:18px; height:18px; }
  .cart-count{ font-size:0.55rem; min-width:13px; height:13px; line-height:13px; }
  .logo-word{ font-size:0.85rem; }
  .login-icon svg{ width:18px; height:18px; }
  /* header.html's <=1150px rule for this label (header .login-icon-label,
     specificity 0,1,1) would otherwise beat a plain .login-icon-label
     rule (0,1,0) here regardless of which one loads later -- confirmed
     as a real, pre-existing bug (the label was never actually hidden
     below 420px despite this rule) while testing the two-line mobile
     greeting. header .menu-toggle .login-icon-label (0,2,1) reliably
     outranks it instead, same specificity-engineering approach as
     header.html's own comments describe for its rules. */
  header .menu-toggle .login-icon-label{ display:none; }
}

/* ---- footer (matches shop.html) ---- */
footer.footer-main{margin-top:60px; padding:40px 20px 24px; background:var(--navy-dark); border-top:1px solid var(--line); font-family:'Quicksand',sans-serif;}
.footer-grid{max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:28px; margin-bottom:28px;}
.footer-col{ text-align:left; }
.footer-col h4{color:rgba(255,255,255,0.45); font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin:0 0 14px;}
.footer-col a{display:block; color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.85rem; margin-bottom:8px; overflow-wrap:break-word;}
.footer-col a:hover{ color:var(--green); }
.footer-col p{ color:rgba(255,255,255,0.6); font-size:0.82rem; line-height:1.6; margin:0 0 6px; overflow-wrap:break-word; }
.footer-social{display:flex; gap:10px;}
.footer-social a{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; margin:0;}
.footer-signup-input{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-family:'Quicksand',sans-serif;font-size:0.78rem;margin-bottom:8px;box-sizing:border-box;background:rgba(255,255,255,0.08);color:#fff;}
.footer-signup-input::placeholder{ color:rgba(255,255,255,0.4); }
.footer-signup-btn{width:100%;padding:9px;background:var(--green);color:#fff;border:none;border-radius:6px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:0.78rem;cursor:pointer;}
.footer-signup-btn:hover{ background:#358f41; }
.footer-signup-msg{font-size:0.75rem; margin-top:6px; color:var(--green);}
.footer-legal{max-width:1200px; margin:24px auto 0; font-size:0.7rem; color:rgba(255,255,255,0.5); line-height:1.5; border-top:1px solid rgba(255,255,255,0.15); padding-top:16px;}
.footer-legal a{ color:rgba(255,255,255,0.75); text-decoration:underline; }
.footer-legal a:hover{ color:#fff; }
.footer-info-row{ position:relative; display:flex; align-items:center; min-height:34px; max-width:1200px; margin:0 auto 20px; }
.footer-info-brand{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.footer-logo-mark{ flex-shrink:0; }
.footer-flag-icon{ flex-shrink:0; border-radius:2px; overflow:hidden; margin-left:16px; }
.footer-brand-name{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:0.8rem; white-space:nowrap; }
.footer-brand-name .forge{ color:#fff; }
.footer-brand-name .well{ color:var(--green); }
.footer-country-label{ font-size:0.72rem; color:rgba(255,255,255,0.6); white-space:nowrap; }
.footer-info-row .footer-catalog-search{ margin-left:auto; }
.footer-catalog-search{ max-width:220px; width:100%; position:relative; }
.footer-catalog-search .search-icon-btn{ left:10px; width:14px; height:14px; }
.footer-catalog-search input{ width:100%; box-sizing:border-box; padding:9px 10px 9px 32px; border-radius:6px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.05) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='0.6'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 10px center/14px 14px; color:#fff; font-size:0.8rem; }
.footer-catalog-search input::placeholder{ color:rgba(255,255,255,0.45); }
.footer-bottom{max-width:1200px; margin:16px auto 0; text-align:center;}
.footer-copyright{font-size:0.75rem; color:rgba(255,255,255,0.5); margin:0 0 12px;}
.footer-legal-links{display:flex; flex-wrap:wrap; justify-content:center; gap:14px;}
.footer-legal-links a{color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.75rem;}
.footer-legal-links a:hover{ color:#fff; text-decoration:underline; }
@media (max-width: 600px) {
  .footer-info-row{ flex-direction:column; align-items:center; gap:14px; min-height:0; }
  .footer-info-brand{ position:static; transform:none; }
  .footer-info-row .footer-catalog-search{ margin-left:0; }
}

/* ---- Checkout page: contact/shipping form, shipping method, order summary ---- */
.checkout-page-wrap{ max-width:1200px; margin:32px auto 80px; padding:0 24px; }
.checkout-page-header{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; margin-bottom:24px; }
.checkout-page-wrap h1{ color:var(--navy-dark); font-size:1.6rem; margin:0; }
.checkout-continue-shopping-link{ color:var(--navy); font-weight:700; font-size:0.82rem; text-decoration:none; }
.checkout-continue-shopping-link:hover{ text-decoration:underline; }
.checkout-page-grid{ display:grid; grid-template-columns:1fr 340px; gap:32px; align-items:start; }

.checkout-section{ border:1px solid var(--line); border-radius:10px; padding:20px 24px; margin-bottom:24px; }
.checkout-section h2{ color:var(--navy-dark); font-size:1.05rem; margin:0 0 16px; }

.checkout-field-label{
  display:block; font-size:0.72rem; font-weight:700; color:var(--navy-dark);
  text-transform:uppercase; letter-spacing:0.03em; margin:14px 0 4px;
}
.checkout-field-label:first-child{ margin-top:0; }
.checkout-section input[type="email"],
.checkout-section input[type="text"]{
  width:100%; box-sizing:border-box; padding:11px 12px;
  border:1.5px solid var(--line); border-radius:8px; font-size:0.88rem;
  font-family:'Quicksand',sans-serif; color:#333;
}
.checkout-section input:focus{ outline:none; border-color:var(--navy); }
.checkout-field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.checkout-field-error{
  color:#c0392b; font-size:0.75rem; margin:6px 0 0; display:none;
}
.checkout-field-error.show{ display:block; }

.checkout-saved-address-block{ display:none; margin-bottom:16px; }
.checkout-saved-address-block.show{ display:block; }
.checkout-saved-address-row{ display:flex; gap:8px; align-items:center; }
.checkout-saved-address-row select{
  flex:1; min-width:0; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px;
  font-size:0.88rem; font-family:'Quicksand',sans-serif; color:#333; background:#fff;
}
.checkout-saved-address-row select:focus{ outline:none; border-color:var(--navy); }
.checkout-saved-address-delete{
  flex-shrink:0; width:38px; height:38px; border:1.5px solid var(--line); border-radius:8px;
  background:#fff; color:#c0392b; cursor:pointer; font-size:1rem; line-height:1;
}
.checkout-saved-address-delete:hover{ background:#fdecea; border-color:#c0392b; }
.checkout-save-address-block{ display:none; margin-top:16px; }
.checkout-save-address-block.show{ display:block; }
.checkout-save-address-row{ display:flex; align-items:center; gap:8px; font-size:0.85rem; color:#444; }
.checkout-save-address-row input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--navy); flex-shrink:0; }
.checkout-save-address-label-input{ display:none; margin-top:8px; }
.checkout-save-address-label-input.show{ display:block; }
.checkout-save-address-label-input input{
  width:100%; box-sizing:border-box; padding:9px 12px; border:1.5px solid var(--line); border-radius:8px;
  font-size:0.85rem; font-family:'Quicksand',sans-serif; color:#333;
}

.shipping-method-option{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  border:1.5px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:10px;
  cursor:pointer;
}
.shipping-method-option:has(input:checked){ border-color:var(--navy); background:var(--panel); }
.shipping-method-option-left{ display:flex; align-items:center; gap:12px; }
.shipping-method-option input[type="radio"]{ width:16px; height:16px; accent-color:var(--navy); flex-shrink:0; }
.shipping-method-name{ font-weight:700; font-size:0.88rem; color:var(--navy-dark); }
.shipping-method-price{ font-weight:700; font-size:0.9rem; color:var(--navy-dark); white-space:nowrap; }

.checkout-summary-card{ border:1px solid var(--line); border-radius:10px; padding:20px; background:var(--panel); position:sticky; top:90px; }
.checkout-summary-line{ display:flex; justify-content:space-between; font-size:0.85rem; color:#444; margin-bottom:10px; }
.checkout-summary-discount{ color:var(--green); font-weight:700; }
.checkout-coupon-note{ font-size:0.75rem; color:var(--gray); margin:2px 0 12px; }
.checkout-coupon-note.error{ color:#c0392b; }
.checkout-coupon-note a{ color:var(--navy); font-weight:700; text-decoration:none; }
.checkout-coupon-note a:hover{ text-decoration:underline; }
.free-shipping-message{ font-size:0.85rem; font-weight:700; color:var(--navy-dark); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:9px 12px; margin:0 0 12px; }
.free-shipping-message.qualified{ color:var(--green); }
.checkout-store-credit-block{ margin-bottom:14px; }
.checkout-store-credit-balance{ font-size:0.82rem; font-weight:700; color:var(--navy-dark); margin-bottom:8px; }
.checkout-store-credit-amount-row{ display:flex; align-items:center; border:1px solid var(--line); border-radius:6px; background:#fff; margin-bottom:8px; overflow:hidden; }
.checkout-store-credit-amount-row span{ padding:9px 0 9px 10px; font-size:0.82rem; color:#444; font-family:'Quicksand',sans-serif; }
.checkout-store-credit-amount-row input{ flex:1; min-width:0; border:none; padding:9px 10px 9px 2px; font-family:'Quicksand',sans-serif; font-size:0.82rem; color:#333; }
.checkout-store-credit-amount-row input:focus{ outline:none; }
.checkout-store-credit-amount-row:focus-within{ border-color:var(--navy); }
.checkout-store-credit-row{ display:flex; align-items:center; gap:8px; font-size:0.82rem; color:#444; cursor:pointer; margin-bottom:6px; }
.checkout-store-credit-row input{ width:16px; height:16px; accent-color:var(--navy); flex-shrink:0; }
.checkout-store-credit-msg{ font-size:0.72rem; color:var(--gray); min-height:14px; }
.checkout-store-credit-msg.error{ color:#c0392b; }
.checkout-total-row{ display:flex; justify-content:space-between; font-weight:700; font-size:1.05rem; color:var(--navy-dark); padding-top:14px; border-top:1px solid var(--line); margin-top:4px; margin-bottom:16px; }
.checkout-place-order-btn{ width:100%; padding:14px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-weight:700; font-size:0.95rem; cursor:pointer; font-family:'Quicksand',sans-serif; }
.checkout-place-order-btn:hover{ background:var(--navy-dark); }
.checkout-back-link{ display:block; text-align:center; margin-top:14px; color:var(--navy); font-size:0.8rem; text-decoration:none; }
.checkout-back-link:hover{ text-decoration:underline; }

@media (max-width:800px){
  .checkout-page-grid{ grid-template-columns:1fr; }
  .checkout-summary-card{ position:static; }
}
@media (max-width:600px){
  .checkout-page-wrap{ margin:20px auto 60px; padding:0 16px; }
  .checkout-section{ padding:16px; }
}
</style>

</head>
<body>

<div id="header-placeholder"></div>



<div class="checkout-page-wrap">
  <div class="checkout-page-header">
    <h1>Checkout</h1>
    <a href="/shop.html" class="checkout-continue-shopping-link">&larr; Continue Shopping</a>
  </div>

  <div class="checkout-page-grid">
    <div class="checkout-form-col">
      <div class="checkout-section">
        <h2>Contact &amp; Shipping Info</h2>

        <div class="checkout-saved-address-block" id="checkout-saved-address-block">
          <label class="checkout-field-label" for="checkout-saved-address-select">Saved Addresses</label>
          <div class="checkout-saved-address-row">
            <select id="checkout-saved-address-select">
              <option value="">Enter a new address</option>
            </select>
            <button type="button" class="checkout-saved-address-delete" id="checkout-saved-address-delete" title="Delete this saved address" style="display:none;">&times;</button>
          </div>
        </div>

        <label class="checkout-field-label" for="checkout-email-input">Email</label>
        <input type="email" id="checkout-email-input" placeholder="you@example.com" autocomplete="email">
        <p id="checkout-email-error" class="checkout-field-error">Please enter a valid email address.</p>

        <label class="checkout-field-label" for="checkout-ship-name">Full name</label>
        <input type="text" id="checkout-ship-name" placeholder="Jane Smith" autocomplete="name">

        <label class="checkout-field-label" for="checkout-ship-line1">Address</label>
        <input type="text" id="checkout-ship-line1" placeholder="123 Main St" autocomplete="address-line1">

        <label class="checkout-field-label" for="checkout-ship-line2">Apt / Suite (optional)</label>
        <input type="text" id="checkout-ship-line2" placeholder="Apt 4B" autocomplete="address-line2">

        <div class="checkout-field-row">
          <div>
            <label class="checkout-field-label" for="checkout-ship-city">City</label>
            <input type="text" id="checkout-ship-city" placeholder="Wichita" autocomplete="address-level2">
          </div>
          <div>
            <label class="checkout-field-label" for="checkout-ship-state">State</label>
            <input type="text" id="checkout-ship-state" placeholder="KS" autocomplete="address-level1">
          </div>
        </div>

        <div class="checkout-field-row">
          <div>
            <label class="checkout-field-label" for="checkout-ship-zip">ZIP code</label>
            <input type="text" id="checkout-ship-zip" placeholder="67202" autocomplete="postal-code">
          </div>
          <div>
            <label class="checkout-field-label" for="checkout-ship-country">Country</label>
            <input type="text" id="checkout-ship-country" placeholder="US" autocomplete="country" value="US">
          </div>
        </div>

        <p id="checkout-shipping-error" class="checkout-field-error">Please fill in all required shipping fields.</p>

        <div class="checkout-save-address-block" id="checkout-save-address-block">
          <label class="checkout-save-address-row">
            <input type="checkbox" id="checkout-save-address-checkbox">
            Save this address to my account
          </label>
          <div class="checkout-save-address-label-input" id="checkout-save-address-label-wrap">
            <input type="text" id="checkout-save-address-label" placeholder="Label (e.g. Home, Work) — optional">
          </div>
        </div>
      </div>

      <div class="checkout-section">
        <h2>Shipping Method</h2>
        <p class="free-shipping-message" id="free-shipping-message" style="display:none;"></p>
        <div id="shipping-method-list"></div>
      </div>
    </div>

    <div class="checkout-summary-col">
      <div class="checkout-summary-card">
        <div id="checkout-summary-lines"></div>
        <div id="checkout-coupon-note" class="checkout-coupon-note" style="display:none;"></div>
        <div class="checkout-store-credit-block" id="checkout-store-credit-block" style="display:none;">
          <div class="checkout-store-credit-balance" id="checkout-store-credit-balance">Store Credit Available: $0.00</div>
          <div class="checkout-store-credit-amount-row">
            <span>$</span>
            <input type="number" id="checkout-store-credit-amount" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
          </div>
          <label class="checkout-store-credit-row">
            <input type="checkbox" id="checkout-store-credit-all-checkbox">
            <span>Apply all available credit</span>
          </label>
          <div id="checkout-store-credit-msg" class="checkout-store-credit-msg"></div>
        </div>
        <div class="checkout-total-row">
          <span>Order Total</span>
          <span id="checkout-total">$0.00</span>
        </div>
        <button type="button" id="checkout-place-order-btn" class="checkout-place-order-btn">Place Order</button>
        <a href="/cart.html" class="checkout-back-link">&larr; Back to Cart</a>
      </div>
    </div>
  </div>
</div>







<div id="footer-placeholder"></div>

<script>
let allProducts = [];
let cart = JSON.parse(localStorage.getItem('forgewell_cart') || '[]');

async function catalogSearchJump(query) {
  query = query.trim().toLowerCase();
  if (!query) return;
  await productsReady;
  const match = allProducts.find(p => {
    const base = (p.name || '').replace(/\s*\(?\d+(\.\d+)?\s?(mg|mcg|iu|ml)\)?\s*$/i, '').trim().toLowerCase();
    return base === query || base.indexOf(query) !== -1;
  });
  if (match) {
    window.location.href = '/product.html?id=' + encodeURIComponent(match.id);
  } else {
    window.location.href = '/shop.html#tabs';
  }
}

// Wires up all header/footer interactivity. Runs only after header.html and
// footer.html have been fetched and injected below -- their elements don't
// exist in the DOM before then.
function wireHeaderFooter() {
  var footerSearchInput = document.getElementById('footer-catalog-search-input');
  if (footerSearchInput) {
    footerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var footerSearchIconBtn = document.getElementById('footer-search-icon-btn');
  if (footerSearchIconBtn && footerSearchInput) {
    footerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(footerSearchInput.value);
    });
  }
  var headerSearchInput = document.getElementById('header-catalog-search-input');
  if (headerSearchInput) {
    headerSearchInput.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      catalogSearchJump(headerSearchInput.value);
    });
  }
  var headerSearchIconBtn = document.getElementById('header-search-icon-btn');
  if (headerSearchIconBtn && headerSearchInput) {
    headerSearchIconBtn.addEventListener('click', function() {
      catalogSearchJump(headerSearchInput.value);
    });
  }

  var hamBtn = document.getElementById('hamburger-btn');
  var overlay = document.getElementById('nav-overlay');
  if (hamBtn && overlay) {
    hamBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.toggle('open');
    });
  }
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target.closest('a')) overlay.classList.remove('open');
    });
    document.addEventListener('click', function(e) {
      if (overlay.classList.contains('open') && !overlay.contains(e.target)) {
        overlay.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') overlay.classList.remove('open');
    });
  }

  // Amazon-style Account/Sign Out dropdown under the account name (see
  // #account-menu-wrap's CSS in header.html -- hover alone already shows it
  // via pure CSS there; this wires click-to-toggle plus close-on-outside-
  // click/Escape, same pattern as the hamburger/#nav-overlay above). Wired
  // unconditionally (not inside the signed-in check below) so the listener
  // exists regardless of session state, but it only intercepts the click
  // once #account-menu-wrap carries .signed-in -- a guest's click still
  // falls through to the plain /login.html link exactly as before.
  var accountMenuWrap = document.getElementById('account-menu-wrap');
  if (accountMenuWrap) {
    document.getElementById('account-icon').addEventListener('click', function(e) {
      if (!accountMenuWrap.classList.contains('signed-in')) return;
      e.preventDefault();
      accountMenuWrap.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (accountMenuWrap.classList.contains('open') && !accountMenuWrap.contains(e.target)) {
        accountMenuWrap.classList.remove('open');
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') accountMenuWrap.classList.remove('open');
    });
  }

  // Checks whether the person is logged in and updates the header's account
  // icon accordingly -- shows "Hi, [name]" linking to order history if
  // logged in, "Sign In" linking to the login/signup page otherwise. Runs
  // on every page that shares this header.
  var loginIcon = document.getElementById('account-icon');
  if (loginIcon) {
    fetch('/api/auth/me', { credentials: 'include' })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(customer) {
        if (customer) {
          loginIcon.href = '/account.html#orders';
          loginIcon.title = 'My Account (' + customer.email + ')';
          // Name wasn't always required at signup -- older accounts can
          // still have a null name, so fall back to the email's local-part
          // rather than showing a blank/broken greeting.
          var displayName = customer.name || customer.email.split('@')[0];
          var labelEl = loginIcon.querySelector('.login-icon-label');
          // Literal newline (not just a leading space) -- on mobile,
          // header.html's white-space:pre-line rule for this label breaks
          // on it to show "Hi," and the name on two lines; on desktop the
          // plain white-space:nowrap rule collapses it back to a single
          // space, so "Hi, <name>" still reads as one line there.
          if (labelEl) labelEl.textContent = 'Hi,\n' + displayName;

          function doLogout() {
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
              .then(function() { window.location.href = '/shop.html'; });
          }

          // Reveals the arrow and enables the Account/Sign Out dropdown
          // (see #account-menu-wrap's CSS in header.html) -- replaces the
          // old standalone icon-only sign-out button.
          if (accountMenuWrap) accountMenuWrap.classList.add('signed-in');
          var signOutItem = document.getElementById('account-dropdown-signout');
          if (signOutItem) {
            signOutItem.addEventListener('click', function(e) {
              e.preventDefault();
              doLogout();
            });
          }

          var navInner = document.querySelector('.nav-overlay-inner');
          if (navInner && !document.getElementById('nav-logout-link')) {
            var logoutLink = document.createElement('a');
            logoutLink.href = '#';
            logoutLink.id = 'nav-logout-link';
            logoutLink.textContent = 'Log Out';
            logoutLink.addEventListener('click', function(e) {
              e.preventDefault();
              doLogout();
            });
            navInner.appendChild(logoutLink);
          }
        }
      })
      .catch(function() { /* not logged in or request failed -- leave icon pointing to /login.html */ });
  }

  var signupBtn = document.getElementById('footer-signup-btn');
  if (signupBtn) {
    signupBtn.addEventListener('click', async () => {
      const input = document.getElementById('footer-email-input');
      const msg = document.getElementById('footer-signup-msg');
      const email = input.value.trim();
      if (!email || email.indexOf('@') === -1) {
        msg.style.color = '#c0392b';
        msg.textContent = 'Please enter a valid email.';
        return;
      }
      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email: email})
        });
        const data = await res.json();
        msg.style.color = '#3FA34D';
        msg.textContent = data.alreadySubscribed
          ? 'Already signed up — code: ' + data.discountCode
          : 'Success! Your code: ' + data.discountCode;
        input.value = '';
      } catch (err) {
        msg.style.color = '#c0392b';
        msg.textContent = 'Something went wrong. Please try again.';
      }
    });
  }

  // Restores the header's cart count from localStorage now that the header
  // actually exists in the DOM (it didn't yet when updateCartIcon() first
  // ran further down this script).
  updateCartIcon();
}

Promise.all([
  fetch('/header.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('header-placeholder').innerHTML = html;
  }),
  fetch('/footer.html').then(function(r) { return r.text(); }).then(function(html) {
    document.getElementById('footer-placeholder').innerHTML = html;
  })
]).then(wireHeaderFooter).catch(function(err) {
  console.error('Failed to load shared header/footer', err);
});

// Only used here to look up each cart item's image_path for display --
// cart.html has no product cards, so there's no card-population step
// like the other pages' loadProducts() has.
// Only used here to keep catalogSearchJump()/the header search box working
// the same way it does on every other page -- checkout.html doesn't render
// any product cards or images itself.
async function loadProducts() {
  try {
    const res = await fetch('/api/products');
    allProducts = await res.json();
  } catch (err) {
    console.error('Failed to load products from backend:', err);
  }
}

function saveCart() {
  localStorage.setItem('forgewell_cart', JSON.stringify(cart));
  updateCartIcon();
}

function updateCartIcon() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  const badge = document.getElementById('cart-count');
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }
}

// Mirrors the exact same rule as the backend (routes/checkout.js):
// flat 10% off, either buy 3+ of one item OR spend $300+ total —
// whichever gives the bigger discount, never both stacked. This is
// just a live preview for the customer; the backend recalculates the
// real charge from scratch at checkout time, so this can't be gamed.
const BULK_QTY_THRESHOLD = 3;
const BULK_QTY_DISCOUNT = 0.10;
const CART_TOTAL_THRESHOLD = 300;
const CART_TOTAL_DISCOUNT = 0.10;

function calculateCartDiscount(cartItems) {
  let rawTotal = 0;
  let perItemTotal = 0;
  cartItems.forEach(item => {
    const lineTotal = item.price * item.qty;
    rawTotal += lineTotal;
    perItemTotal += item.qty >= BULK_QTY_THRESHOLD
      ? lineTotal * (1 - BULK_QTY_DISCOUNT)
      : lineTotal;
  });
  const cartWideTotal = rawTotal >= CART_TOTAL_THRESHOLD
    ? rawTotal * (1 - CART_TOTAL_DISCOUNT)
    : rawTotal;
  const finalTotal = Math.min(perItemTotal, cartWideTotal, rawTotal);
  return {
    subtotal: rawTotal,
    total: finalTotal,
    discountApplied: finalTotal < rawTotal,
    savings: rawTotal - finalTotal,
  };
}

function couponDiscountedTotal(rawTotal, coupon) {
  if (coupon.discountType === 'fixed') {
    return Math.max(0, rawTotal - Number(coupon.discountValue));
  }
  return rawTotal * (1 - Number(coupon.discountValue) / 100);
}

// Mirrors routes/checkout.js's applyBulkDiscount() -- the coupon only
// "wins" (and is only ever shown/actually charged as the applied
// discount) if it beats the bulk discount above; the two never stack.
// The coupon itself isn't editable here -- it's carried over from
// cart.html via forgewell_promo_code, see loadCoupons()/renderOrderSummary()
// below -- but the savings this produces still needs to be computed the
// same way cart.html does, so the total shown here matches what the
// customer already saw there.
function calculateCartTotals(cartItems, coupon) {
  const { subtotal, total: bulkTotal, discountApplied: bulkDiscountApplied, savings: bulkSavings } = calculateCartDiscount(cartItems);
  let finalTotal = bulkTotal;
  let couponWon = false;
  let couponSavings = 0;
  if (coupon) {
    const couponTotal = couponDiscountedTotal(subtotal, coupon);
    if (couponTotal < finalTotal) {
      finalTotal = couponTotal;
      couponWon = true;
      couponSavings = subtotal - couponTotal;
    }
  }
  finalTotal = Math.round(finalTotal * 100) / 100;
  return {
    subtotal,
    total: finalTotal,
    discountApplied: finalTotal < subtotal,
    couponWon,
    couponSavings: Math.round(couponSavings * 100) / 100,
    bulkDiscountApplied,
    bulkSavings,
  };
}

// Populated by loadCoupons() below (signed-in customers only) -- used to
// resolve forgewell_promo_code (set on cart.html) to a real discountType/
// discountValue so its savings can be shown here too.
let availableCoupons = [];

const SHIPPING_METHODS = [
  { id: 'usps_flat', label: 'USPS Flat Rate', cost: 11.99 },
  { id: 'ups_fedex_ground', label: 'UPS/FedEx Ground (3-5 Days)', cost: 14.99 },
  { id: 'ups_fedex_2day', label: 'UPS/FedEx 2nd Day Air', cost: 21.99 },
];

function renderShippingMethods() {
  const list = document.getElementById('shipping-method-list');
  list.innerHTML = SHIPPING_METHODS.map(function(method, i) {
    return '<label class="shipping-method-option">' +
      '<span class="shipping-method-option-left">' +
        '<input type="radio" name="shipping-method" value="' + method.id + '"' + (i === 0 ? ' checked' : '') + '>' +
        '<span class="shipping-method-name">' + method.label + '</span>' +
      '</span>' +
      '<span class="shipping-method-price">$' + method.cost.toFixed(2) + '</span>' +
    '</label>';
  }).join('');
}

function getSelectedShippingMethod() {
  const checked = document.querySelector('input[name="shipping-method"]:checked');
  return SHIPPING_METHODS.find(function(m) { return m.id === (checked && checked.value); }) || SHIPPING_METHODS[0];
}

// storeCreditBalanceCents is populated by loadStoreCreditBalance() below
// (signed-in customers only) -- 0 until then, so this is a no-op for guests
// and before that fetch resolves.
let storeCreditBalanceCents = 0;

// null until loadFreeShippingThreshold() below resolves (or forever, if
// it fails) -- renderOrderSummary()'s free-shipping message stays hidden
// in that case rather than showing a wrong/guessed dollar figure.
let freeShippingThreshold = null;

// Recomputes the subtotal-after-coupon + shipping total, independent of
// whatever store credit is currently entered -- shared by
// renderOrderSummary() (which needs it every render) and the "Apply all"
// checkbox handler (which needs it once, without going through
// syncStoreCreditAmount()'s clamp/error-message path -- filling in
// min(balance, this) is the checkbox's job, not a correction of bad
// manual input).
function calculatePreCreditTotal() {
  const appliedCode = localStorage.getItem('forgewell_promo_code');
  const matchedCoupon = appliedCode
    ? availableCoupons.find(function(c) { return c.code.toUpperCase() === appliedCode.trim().toUpperCase(); })
    : null;
  const { total } = calculateCartTotals(cart, matchedCoupon);
  const shippingMethod = getSelectedShippingMethod();
  return Math.round((total + shippingMethod.cost) * 100) / 100;
}

// Reads the amount input, clamps it to [0, min(balance, preCreditTotal)],
// writes any clamp back into the field with an explanatory message, and
// syncs the "Apply all" checkbox to reflect whether the (possibly just-
// clamped) amount equals that max. Called on every renderOrderSummary()
// pass, not just when the amount field itself changes, since preCreditTotal
// can shrink out from under an already-entered amount (e.g. switching to
// a cheaper shipping method) without the customer touching the field at all.
function syncStoreCreditAmount(preCreditTotal) {
  const amountInput = document.getElementById('checkout-store-credit-amount');
  const allCheckbox = document.getElementById('checkout-store-credit-all-checkbox');
  const msgEl = document.getElementById('checkout-store-credit-msg');
  if (!amountInput) return 0; // block not rendered -- balance is 0, nothing to apply

  const balanceDollars = storeCreditBalanceCents / 100;
  const maxApplicable = Math.round(Math.min(balanceDollars, preCreditTotal) * 100) / 100;

  const raw = amountInput.value.trim();
  let parsed = raw === '' ? 0 : parseFloat(raw);
  if (!Number.isFinite(parsed) || parsed < 0) parsed = 0;

  // Small epsilon for float comparison -- avoids e.g. 12.00 vs 11.999999996
  // both from legitimate cent-level rounding elsewhere reading as "over".
  if (parsed > maxApplicable + 0.001) {
    msgEl.textContent = balanceDollars < preCreditTotal
      ? 'You only have $' + balanceDollars.toFixed(2) + ' in store credit available.'
      : "You can't apply more than the order total ($" + preCreditTotal.toFixed(2) + ').';
    msgEl.classList.add('error');
    parsed = maxApplicable;
    amountInput.value = parsed > 0 ? parsed.toFixed(2) : '';
  } else {
    msgEl.textContent = '';
    msgEl.classList.remove('error');
  }

  allCheckbox.checked = maxApplicable > 0 && Math.abs(parsed - maxApplicable) < 0.001;

  return parsed;
}

// NOTE: like the discount preview above, this total is a client-side
// preview only. Today's /api/checkout payload doesn't carry a shipping
// method at all (kept unchanged, per the "reuse the payment flow as-is"
// requirement), so there's no guarantee the amount shown here matches
// whatever the external backend actually charges. Same caveat applies to
// the store-credit line -- the real deduction/cap happens server-side (see
// the backend handoff spec), this just previews it the same way.
function renderOrderSummary() {
  const appliedCode = localStorage.getItem('forgewell_promo_code');
  const matchedCoupon = appliedCode
    ? availableCoupons.find(function(c) { return c.code.toUpperCase() === appliedCode.trim().toUpperCase(); })
    : null;
  const { subtotal, total, couponWon, couponSavings, bulkDiscountApplied, bulkSavings } = calculateCartTotals(cart, matchedCoupon);
  const shippingMethod = getSelectedShippingMethod();
  const preCreditTotal = total + shippingMethod.cost;

  // Qualifying total is the post-discount merchandise total (same "total"
  // calculateCartTotals() already produces) -- deliberately not reduced by
  // store credit (a payment method, not a discount on the order's size)
  // and not including shipping itself (that would be circular). Hidden
  // entirely rather than shown wrong if the threshold fetch never
  // resolved -- see loadFreeShippingThreshold()'s own comment.
  const freeShippingEl = document.getElementById('free-shipping-message');
  if (freeShippingEl) {
    if (freeShippingThreshold == null) {
      freeShippingEl.style.display = 'none';
    } else if (total >= freeShippingThreshold) {
      freeShippingEl.textContent = "You qualify for free shipping!";
      freeShippingEl.className = 'free-shipping-message qualified';
      freeShippingEl.style.display = 'block';
    } else {
      const remaining = freeShippingThreshold - total;
      freeShippingEl.textContent = 'Add $' + remaining.toFixed(2) + ' more to get FREE shipping!';
      freeShippingEl.className = 'free-shipping-message';
      freeShippingEl.style.display = 'block';
    }
  }

  const creditToApply = syncStoreCreditAmount(preCreditTotal);
  const grandTotal = Math.max(0, preCreditTotal - creditToApply);

  const itemCount = cart.reduce((sum, i) => sum + i.qty, 0);
  let html = '<div class="checkout-summary-line"><span>Subtotal (' + itemCount + ' item' + (itemCount === 1 ? '' : 's') + ')</span><span>$' + subtotal.toFixed(2) + '</span></div>';
  if (couponWon) {
    html += '<div class="checkout-summary-line checkout-summary-discount"><span>Coupon ' + matchedCoupon.code + ' applied</span><span>-$' + couponSavings.toFixed(2) + '</span></div>';
  } else if (bulkDiscountApplied) {
    html += '<div class="checkout-summary-line checkout-summary-discount"><span>Discount</span><span>-$' + bulkSavings.toFixed(2) + '</span></div>';
  }
  html += '<div class="checkout-summary-line"><span>Shipping</span><span>$' + shippingMethod.cost.toFixed(2) + '</span></div>';
  if (creditToApply > 0) {
    html += '<div class="checkout-summary-line checkout-summary-discount"><span>Store Credit</span><span>-$' + creditToApply.toFixed(2) + '</span></div>';
  }
  document.getElementById('checkout-summary-lines').innerHTML = html;
  document.getElementById('checkout-total').textContent = '$' + grandTotal.toFixed(2);

  // Coupon is not editable on this page -- it's carried over from
  // cart.html's selector/manual entry (see loadCoupons() below) -- so this
  // is a status note, not a control. Only shown when there's something to
  // say: a winning coupon still gets a "change on cart" pointer, an
  // applied-but-not-winning or unresolvable code explains why it isn't
  // reflected above, and no code at all means no note.
  const noteEl = document.getElementById('checkout-coupon-note');
  noteEl.classList.remove('error');
  if (!appliedCode) {
    noteEl.style.display = 'none';
  } else if (couponWon) {
    noteEl.style.display = 'block';
    noteEl.innerHTML = '<a href="/cart.html">Change coupon on cart page</a>';
  } else if (matchedCoupon) {
    noteEl.style.display = 'block';
    noteEl.innerHTML = 'Coupon ' + matchedCoupon.code + " doesn't beat your current discount, so it wasn't applied. <a href=\"/cart.html\">Change on cart page</a>";
  } else {
    noteEl.style.display = 'block';
    noteEl.innerHTML = 'Promo code ' + appliedCode + ' will be validated when you place your order. <a href="/cart.html">Change on cart page</a>';
  }
}

// NEW endpoint -- see the backend handoff spec.
function loadStoreCreditBalance() {
  return fetch('/api/store-credit/mine', { credentials: 'include' })
    .then(function(res) { return res.ok ? res.json() : { balanceCents: 0 }; })
    .then(function(data) {
      storeCreditBalanceCents = data.balanceCents || 0;
      if (storeCreditBalanceCents > 0) {
        document.getElementById('checkout-store-credit-block').style.display = 'block';
        document.getElementById('checkout-store-credit-balance').textContent =
          'Store Credit Available: $' + (storeCreditBalanceCents / 100).toFixed(2);
      }
      renderOrderSummary();
    })
    .catch(function() {});
}

// Not gated on being signed in -- unlike store credit/coupons, the free-
// shipping threshold applies to guest and signed-in checkouts alike.
function loadFreeShippingThreshold() {
  return fetch('/api/content/free-shipping-threshold')
    .then(function(res) { return res.ok ? res.json() : { threshold: null }; })
    .then(function(data) {
      freeShippingThreshold = data.threshold;
      renderOrderSummary();
    })
    .catch(function() {});
}

// NEW endpoint -- see the backend handoff spec. The coupon itself is
// chosen on cart.html now (selector + manual entry both live there) --
// this page just needs to know this customer's available coupons well
// enough to resolve forgewell_promo_code to a real discountType/
// discountValue for the read-only summary/note above, not to offer a
// picker of its own.
function loadCoupons() {
  fetch('/api/coupons/mine', { credentials: 'include' })
    .then(function(res) { return res.ok ? res.json() : []; })
    .then(function(coupons) {
      availableCoupons = (Array.isArray(coupons) ? coupons : []).filter(function(c) { return c.status === 'available'; });
      renderOrderSummary();
    })
    .catch(function() {});
}

if (cart.length === 0) {
  window.location.href = '/cart.html';
} else {
  const emailInput = document.getElementById('checkout-email-input');
  const emailError = document.getElementById('checkout-email-error');
  const shippingError = document.getElementById('checkout-shipping-error');
  const shipFields = {
    name: document.getElementById('checkout-ship-name'),
    line1: document.getElementById('checkout-ship-line1'),
    line2: document.getElementById('checkout-ship-line2'),
    city: document.getElementById('checkout-ship-city'),
    state: document.getElementById('checkout-ship-state'),
    zip: document.getElementById('checkout-ship-zip'),
    country: document.getElementById('checkout-ship-country'),
  };

  // Autofill from whatever was saved on a previous successful checkout
  const savedEmail = localStorage.getItem('forgewell_checkout_email');
  const savedShipping = JSON.parse(localStorage.getItem('forgewell_shipping_address') || 'null');
  emailInput.value = savedEmail || '';
  if (savedShipping) {
    Object.keys(shipFields).forEach(function(key) {
      if (shipFields[key] && savedShipping[key]) shipFields[key].value = savedShipping[key];
    });
  }
  if (!shipFields.country.value) shipFields.country.value = 'US';

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  // ============================================================
  // Saved addresses (signed-in customers only). checkout.html makes its
  // own /api/auth/me call here rather than reusing wireHeaderFooter()'s --
  // that one only drives the header's account icon and isn't the right
  // place for checkout-specific address logic.
  // ============================================================
  const savedAddressBlock = document.getElementById('checkout-saved-address-block');
  const savedAddressSelect = document.getElementById('checkout-saved-address-select');
  const savedAddressDeleteBtn = document.getElementById('checkout-saved-address-delete');
  const saveAddressBlock = document.getElementById('checkout-save-address-block');
  const saveAddressCheckbox = document.getElementById('checkout-save-address-checkbox');
  const saveAddressLabelWrap = document.getElementById('checkout-save-address-label-wrap');
  const saveAddressLabelInput = document.getElementById('checkout-save-address-label');

  let savedAddresses = [];
  let isSignedIn = false;

  function renderSavedAddressOptions() {
    savedAddressSelect.innerHTML = '<option value="">Enter a new address</option>' +
      savedAddresses.map(function(a) {
        var label = (a.label && a.label.trim()) || 'Address';
        return '<option value="' + a.id + '">' + label + ' — ' + a.line1 + ', ' + a.city + ', ' + a.state + '</option>';
      }).join('');
    savedAddressBlock.classList.toggle('show', savedAddresses.length > 0);
    savedAddressDeleteBtn.style.display = 'none';
  }

  function loadSavedAddresses() {
    return fetch('/api/addresses', { credentials: 'include' })
      .then(function(res) { return res.ok ? res.json() : []; })
      .then(function(addresses) {
        savedAddresses = Array.isArray(addresses) ? addresses : [];
        renderSavedAddressOptions();
      })
      .catch(function() { savedAddresses = []; });
  }

  // Fills the shipping fields (including name -- a saved address or past
  // order's own recipient name, kept together as one block rather than
  // mixed field-by-field with the account name below) from any object
  // shaped like { name, line1, line2, city, state, zip, country }, same
  // shape whether it comes from /api/addresses or an order's
  // shipping_address. Only ever touches form inputs -- nothing here
  // writes back to the account or address book, so it's a pure
  // convenience default the customer can freely overtype for this order.
  function applyShippingSource(source) {
    if (!source) return;
    Object.keys(shipFields).forEach(function(key) {
      if (shipFields[key] && source[key]) shipFields[key].value = source[key];
    });
  }

  fetch('/api/auth/me', { credentials: 'include' })
    .then(function(res) { return res.ok ? res.json() : null; })
    .then(function(customer) {
      isSignedIn = !!customer;
      if (!isSignedIn) return;
      // Account data is more authoritative than whatever an earlier
      // guest-like checkout left in localStorage, so it wins here --
      // may be further overridden just below by a saved address's own
      // name (e.g. shipping to someone else), same as picking that
      // address from the dropdown manually already would.
      if (customer.email) emailInput.value = customer.email;
      if (customer.name) shipFields.name.value = customer.name;
      saveAddressBlock.classList.add('show');
      loadSavedAddresses().then(function() {
        if (savedAddresses.length > 0) {
          // Saved addresses are the more current, purpose-built source
          // (the customer explicitly maintains this list and can mark a
          // default) -- prefer it over order history whenever it has
          // anything at all.
          var defaultAddress = savedAddresses.find(function(a) { return a.is_default; }) || savedAddresses[0];
          applyShippingSource(defaultAddress);
          savedAddressSelect.value = defaultAddress.id;
          savedAddressDeleteBtn.style.display = '';
          return;
        }
        // No saved address book entry yet -- fall back to the most recent
        // past order's shipping info as a simpler, still-useful default.
        // /api/orders/mine is already sorted newest-first, so [0] is it;
        // a first-time customer just gets [] here and the fields stay
        // whatever they already were (empty, unless localStorage had
        // something from a prior guest checkout on this browser).
        return fetch('/api/orders/mine', { credentials: 'include' })
          .then(function(res) { return res.ok ? res.json() : []; })
          .then(function(orders) {
            if (Array.isArray(orders) && orders.length > 0) {
              applyShippingSource(orders[0].shipping_address);
            }
          })
          .catch(function() {});
      });
      loadStoreCreditBalance();
      loadCoupons();
    })
    .catch(function() {});

  savedAddressSelect.addEventListener('change', function() {
    const selectedId = savedAddressSelect.value;
    if (!selectedId) {
      savedAddressDeleteBtn.style.display = 'none';
      return;
    }
    const address = savedAddresses.find(function(a) { return a.id === selectedId; });
    if (!address) return;
    Object.keys(shipFields).forEach(function(key) {
      if (shipFields[key]) shipFields[key].value = address[key] || '';
    });
    savedAddressDeleteBtn.style.display = '';
  });

  savedAddressDeleteBtn.addEventListener('click', function() {
    const selectedId = savedAddressSelect.value;
    if (!selectedId) return;
    if (!window.confirm('Delete this saved address?')) return;
    fetch('/api/addresses/' + encodeURIComponent(selectedId), { method: 'DELETE', credentials: 'include' })
      .then(function() { return loadSavedAddresses(); });
  });

  saveAddressCheckbox.addEventListener('change', function() {
    saveAddressLabelWrap.classList.toggle('show', saveAddressCheckbox.checked);
  });

  renderShippingMethods();
  renderOrderSummary();
  loadFreeShippingThreshold();
  document.getElementById('shipping-method-list').addEventListener('change', renderOrderSummary);

  // Typing a specific amount and checking "Apply all" both funnel through
  // renderOrderSummary() -> syncStoreCreditAmount(), which is the single
  // place that clamps/validates and keeps the two in sync -- see its own
  // comment. This handler's only job is deciding what to seed the amount
  // field with before that runs.
  document.getElementById('checkout-store-credit-amount').addEventListener('input', renderOrderSummary);
  document.getElementById('checkout-store-credit-all-checkbox').addEventListener('change', function() {
    const amountInput = document.getElementById('checkout-store-credit-amount');
    if (this.checked) {
      const maxApplicable = Math.round(Math.min(storeCreditBalanceCents / 100, calculatePreCreditTotal()) * 100) / 100;
      amountInput.value = maxApplicable > 0 ? maxApplicable.toFixed(2) : '';
    } else {
      amountInput.value = '';
    }
    renderOrderSummary();
  });

  document.getElementById('checkout-place-order-btn').addEventListener('click', async function() {
    const email = emailInput.value.trim();
    if (!isValidEmail(email)) {
      emailError.classList.add('show');
      return;
    }
    emailError.classList.remove('show');

    const shippingAddress = {
      name: shipFields.name.value.trim(),
      line1: shipFields.line1.value.trim(),
      line2: shipFields.line2.value.trim(),
      city: shipFields.city.value.trim(),
      state: shipFields.state.value.trim(),
      zip: shipFields.zip.value.trim(),
      country: shipFields.country.value.trim(),
    };
    // line2 is optional — everything else required, matches checkout.js validation
    const requiredOk = shippingAddress.name && shippingAddress.line1 && shippingAddress.city
      && shippingAddress.state && shippingAddress.zip && shippingAddress.country;
    if (!requiredOk) {
      shippingError.classList.add('show');
      return;
    }
    shippingError.classList.remove('show');

    localStorage.setItem('forgewell_checkout_email', email);
    localStorage.setItem('forgewell_shipping_address', JSON.stringify(shippingAddress));

    // Not read from an input here -- the coupon isn't editable on this
    // page, it's whatever was chosen on cart.html (see loadCoupons()/
    // renderOrderSummary() above).
    const promoCode = (localStorage.getItem('forgewell_promo_code') || '').trim();

    try {
      // Reads whatever renderOrderSummary()'s last pass already validated/
      // clamped into the field (syncStoreCreditAmount() runs on every
      // render, including right before this on qty/coupon/shipping
      // changes), rather than re-deriving it here -- the amount actually
      // shown in the order total is the amount actually submitted.
      const creditAmountInput = document.getElementById('checkout-store-credit-amount');
      const enteredCreditDollars = (isSignedIn && creditAmountInput) ? parseFloat(creditAmountInput.value) : 0;
      const storeCreditCentsToApply = Number.isFinite(enteredCreditDollars) && enteredCreditDollars > 0
        ? Math.round(enteredCreditDollars * 100)
        : 0;

      const res = await fetch('/api/checkout', {
        method: 'POST',
        // credentials:'include' added here (wasn't sent before) -- applying
        // store credit needs the backend to identify the real signed-in
        // customer from the session cookie, not just trust customerEmail
        // from the request body. See the backend handoff spec: it must cap
        // storeCreditCents to that customer's real balance and this order's
        // total, and only deduct what it actually applied.
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items: cart.map(i => ({ productId: i.productId, qty: i.qty })),
          customerEmail: email,
          shippingAddress: shippingAddress,
          discountCode: promoCode || undefined,
          storeCreditCents: storeCreditCentsToApply > 0 ? storeCreditCentsToApply : undefined
        })
      });
      const data = await res.json();

      // The backend rejects an invalid/already-used code with a 400 and no
      // order is created -- surface that on the coupon note (that's the
      // element the problem actually belongs to) rather than the earlier
      // fallback below, which used to fire for this too with a misleading
      // "checkout succeeded" message. There's no field to fix here anymore
      // (the coupon isn't editable on this page), so the note just sends
      // them back to cart.html the same way an unresolvable/losing coupon
      // already does in renderOrderSummary(). Any other 400/500 (bad
      // shipping data, unknown product, payment provider issue, etc.)
      // isn't about the promo code, so that still falls back to the
      // generic alert below -- this only narrows the one case this change
      // is actually about.
      if (!res.ok) {
        if (data.error && /promo code/i.test(data.error)) {
          const noteEl = document.getElementById('checkout-coupon-note');
          noteEl.style.display = 'block';
          noteEl.classList.add('error');
          noteEl.innerHTML = data.error + ' <a href="/cart.html">Fix on cart page</a>';
          return;
        }
        alert(data.error || 'Checkout failed — please try again.');
        console.error('Checkout failed:', data);
        return;
      }

      if (data.payment && data.payment.paymentUrl) {
        localStorage.setItem('forgewell_last_order_id', data.orderId);
        localStorage.removeItem('forgewell_promo_code');
        // Best-effort, opt-in only -- never blocks the redirect below. The
        // order itself already succeeded by this point; saving the address
        // to the account is a convenience side-effect, not part of the
        // critical path (same pattern as appendToSent() in the inbox-reply
        // feature not blocking a reply that already sent).
        if (isSignedIn && saveAddressCheckbox.checked) {
          fetch('/api/addresses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(Object.assign({ label: saveAddressLabelInput.value.trim() }, shippingAddress)),
          }).catch(function() {});
        }
        // Cart is intentionally left alone here -- this order is still
        // pending_payment, not paid. It's cleared on order-confirmation.html
        // once polling actually observes status === 'paid', so backing out
        // of PayRam (or the payment failing) leaves the cart intact.
        window.location.href = data.payment.paymentUrl;
        return;
      }

      // No payment.paymentUrl and status is 'paid' -- the order was fully
      // covered by store credit, so there's no PayRam step at all (see the
      // backend's own comment on that branch). order-confirmation.html
      // already handles status 'paid' correctly on its very first fetch
      // (the same code path a webhook-confirmed PayRam order reaches after
      // polling), including clearing the cart -- so this just skips
      // straight there instead of redirecting to a payment page.
      if (data.status === 'paid') {
        localStorage.setItem('forgewell_last_order_id', data.orderId);
        localStorage.removeItem('forgewell_promo_code');
        if (isSignedIn && saveAddressCheckbox.checked) {
          fetch('/api/addresses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(Object.assign({ label: saveAddressLabelInput.value.trim() }, shippingAddress)),
          }).catch(function() {});
        }
        window.location.href = '/order-confirmation.html';
        return;
      }

      alert('Checkout succeeded but no payment link was returned — check the console and contact support.');
      console.error('Checkout response missing payment.paymentUrl:', data);
    } catch (err) {
      console.error('Checkout failed:', err);
      alert('Checkout failed — check the console.');
    }
  });
}

let productsReady = loadProducts();
updateCartIcon();



</script>

</body>
</html>
